<style>
/* Layout: one-screen arcade cabinet — glass HUD strip, lit canvas tower, sculpted touch deck. Deliberately single dark theme. */
:root {
  --night: #050b18;
  --deck: #0b1730;
  --deck2: #07101f;
  --ice: #dff4ff;
  --frost: #86bde3;
  --gold: #ffcb52;
  --gold2: #ff9e2c;
  --ember: #ff6450;
  --mint: #5dffc4;
  --line: rgba(190, 228, 255, 0.16);
  --display: "Bungee", "Impact", "Arial Black", sans-serif;
  --sign: "Bungee Inline", "Bungee", "Impact", sans-serif;
  --body: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: radial-gradient(120% 80% at 50% 0%, #10224a 0%, var(--night) 60%); background-color: var(--night);
  color: var(--ice); font-family: var(--body);
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#app {
  height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; position: relative; z-index: 1; background: var(--night);
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px));
  box-shadow: 0 0 60px rgba(0,0,0,0.6);
}
#hud {
  display: flex; align-items: center; gap: 11px; position: relative; z-index: 2;
  padding-block: 9px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(180deg, #12244a, var(--deck));
  border-bottom: 1px solid rgba(190,228,255,0.22);
  box-shadow: 0 1px 0 rgba(0,0,0,0.6), 0 8px 18px rgba(0,0,0,0.35);
}
.stat { display: flex; flex-direction: column; line-height: 1; min-width: 0; }
.stat small { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--frost); font-weight: 600; white-space: nowrap; }
.stat b {
  font-family: var(--display); font-weight: 400; font-size: 22px; font-variant-numeric: tabular-nums; margin-top: 3px;
  background: linear-gradient(180deg, #ffffff 10%, #a9dcff 90%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 rgba(0,0,0,0.5));
}
#floorStat b, #coinStat b { background-image: linear-gradient(180deg, #fff3c4 5%, var(--gold) 50%, var(--gold2) 95%); }
#coinStat b { font-size: 17px; }
.spacer { flex: 1; }
#clock {
  --p: 0; width: 36px; height: 36px; border-radius: 50%; flex: none;
  background: conic-gradient(from 0deg, var(--ember) 0, var(--gold) calc(var(--p) * 1turn), rgba(190,228,255,0.12) 0);
  display: grid; place-items: center; box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 0 14px rgba(255,100,80,calc(var(--p) * 0.6));
}
#clock span {
  width: 27px; height: 27px; border-radius: 50%; background: radial-gradient(circle at 50% 30%, #1a3060, var(--deck2));
  display: grid; place-items: center; font-family: var(--display); font-size: 12px; color: var(--ice);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
}
.iconbtn {
  width: 36px; height: 36px; border-radius: 11px; border: 1px solid var(--line); flex: none; cursor: pointer;
  background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.01)); color: var(--ice);
  font: 700 15px var(--body); display: grid; place-items: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 2px 0 rgba(0,0,0,0.4);
}
.iconbtn svg { width: 18px; height: 18px; fill: currentColor; }
button:focus-visible, .chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#stage { flex: 1; position: relative; min-height: 0; touch-action: none; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#combo { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 230px; text-align: center; pointer-events: none; }
#combo .lbl {
  font-family: var(--display); font-size: 15px; letter-spacing: 0.04em;
  background: linear-gradient(180deg, #fff6cf, var(--gold) 55%, var(--gold2)); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 rgba(0,0,0,0.7)) drop-shadow(0 0 10px rgba(255,180,60,0.45));
}
#combo .bar { height: 7px; border-radius: 4px; margin-top: 6px; overflow: hidden; background: rgba(0,0,0,0.5); box-shadow: inset 0 1px 2px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,203,82,0.35); }
#combo .bar i { display: block; height: 100%; width: 100%; transform-origin: left; background: linear-gradient(90deg, var(--ember), var(--gold) 60%, #fff3c4); box-shadow: 0 0 10px var(--gold); }
#combo.frozen .bar i { background: linear-gradient(90deg, #7fd4ff, #ffffff); box-shadow: 0 0 10px #7fd4ff; }
#pills { position: absolute; left: max(30px, env(safe-area-inset-left, 0px)); top: 58px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.pill {
  font: 700 13px var(--body); letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px;
  background: rgba(5,10,24,0.75); border: 1px solid currentColor; font-variant-numeric: tabular-nums; width: max-content;
}
#modeTag {
  position: absolute; right: max(30px, env(safe-area-inset-right, 0px)); top: 12px; pointer-events: none;
  font: 700 12px var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--mint);
  padding: 4px 9px; border-radius: 999px; background: rgba(5,10,24,0.7); border: 1px solid rgba(93,255,196,0.4);
}
#raceBoard {
  position: absolute; right: max(30px, env(safe-area-inset-right, 0px)); top: 40px; width: 132px; pointer-events: none;
  background: rgba(5,10,24,0.72); border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px;
  font: 600 13px var(--body); display: flex; flex-direction: column; gap: 3px;
}
#raceBoard div { display: flex; gap: 6px; align-items: center; min-width: 0; }
#raceBoard i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
#raceBoard span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#raceBoard b { font-variant-numeric: tabular-nums; color: var(--gold); }
#raceBoard .me span { color: var(--gold); }
#hint {
  position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); pointer-events: none; width: max-content; max-width: calc(100% - 64px);
  font: 700 17px var(--body); letter-spacing: 0.04em; text-align: center; color: var(--ice);
  padding: 8px 16px; border-radius: 14px; background: rgba(5,10,24,0.8); border: 1px solid rgba(127,212,255,0.45);
  box-shadow: 0 0 20px rgba(127,212,255,0.25);
}
#hint b { color: var(--gold); }
.overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 3;
  padding-block: 14px; padding-left: 16px; padding-right: 16px;
  background: radial-gradient(90% 60% at 50% 45%, rgba(5,11,24,0.35), rgba(5,11,24,0.88));
}
.card {
  width: 100%; max-width: 340px; max-height: 100%; overflow-y: auto; text-align: center;
  display: flex; flex-direction: column; gap: 13px; align-items: center;
  padding: 22px 18px 20px; border-radius: 22px; position: relative;
  background: linear-gradient(180deg, rgba(22,44,88,0.78), rgba(8,16,34,0.88));
  border: 1px solid rgba(190,228,255,0.24);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 20px 50px rgba(0,0,0,0.55), 0 0 40px rgba(110,190,255,0.12);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  scrollbar-width: thin;
}
.card h1 {
  font-family: var(--sign); font-weight: 400; margin: 0; font-size: 42px; line-height: 0.92; letter-spacing: 0.01em;
  background: linear-gradient(100deg, #9fd6ff 0%, #ffffff 30%, #b6e4ff 45%, #ffffff 55%, #7fbfff 80%);
  background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 #1d4f86) drop-shadow(0 8px 18px rgba(110,190,255,0.45));
  animation: sheen 4.5s ease-in-out infinite;
}
@keyframes sheen { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0 0; } }
.tag { font-size: 12px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.card h2 {
  font-family: var(--display); font-weight: 400; margin: 0; font-size: 30px; line-height: 1;
  background: linear-gradient(180deg, #ffd0c6, var(--ember)); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 #5a160e); text-wrap: balance;
}
.card h2.cool { background-image: linear-gradient(180deg, #ffffff, #9fd6ff); filter: drop-shadow(0 3px 0 #1d4f86); }
.card h2.gold { background-image: linear-gradient(180deg, #fff7d2, var(--gold) 50%, var(--gold2)); filter: drop-shadow(0 3px 0 #7a4a06) drop-shadow(0 0 16px rgba(255,190,60,0.5)); }
.card p { margin: 0; font-size: 17px; line-height: 1.3; color: var(--ice); max-width: 30ch; }
.results { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
.results div { border-radius: 12px; padding: 8px 6px; background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02)); border: 1px solid var(--line); }
.results small { display: block; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--frost); font-weight: 600; }
.results b { font-family: var(--display); font-weight: 400; font-size: 20px; font-variant-numeric: tabular-nums; color: var(--ice); }
.results .wide { grid-column: 1 / -1; }
.results .gold b { color: var(--gold); }
.newbest { font-family: var(--display); color: #2a1c00; font-size: 13px; letter-spacing: 0.08em; background: linear-gradient(180deg, #fff1b8, var(--gold)); padding: 5px 12px; border-radius: 999px; box-shadow: 0 0 18px rgba(255,203,82,0.6); }
.btn {
  font-family: var(--display); font-size: 20px; padding: 14px 30px; border-radius: 16px; border: 0; cursor: pointer;
  background: linear-gradient(180deg, #fff0b0 0%, var(--gold) 40%, var(--gold2) 100%); color: #3a2300;
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.7), 0 6px 0 #a5620c, 0 10px 24px rgba(255,160,40,0.35);
  text-shadow: 0 1px 0 rgba(255,255,255,0.5); touch-action: manipulation;
}
.btn:active { transform: translateY(4px); box-shadow: inset 0 2px 0 rgba(255,255,255,0.7), 0 2px 0 #a5620c; }
.btn.alt {
  background: linear-gradient(180deg, #2a4f8f, #183466); color: var(--ice); text-shadow: none; font-size: 16px; padding: 11px 16px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 5px 0 #040a16;
}
.btn.alt:active { box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 1px 0 #040a16; }
.btn.alt small { display: block; font-family: var(--body); font-size: 12px; letter-spacing: 0.12em; color: var(--frost); font-weight: 600; margin-top: 2px; text-transform: uppercase; }
.btn:disabled { opacity: 0.45; cursor: default; transform: none; }
.stack { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
.chip {
  border-radius: 12px; border: 1px solid var(--line); cursor: pointer; color: var(--ice);
  background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  font: 700 12px var(--body); letter-spacing: 0.08em; text-transform: uppercase; padding: 9px 2px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative;
}
.chip svg { width: 20px; height: 20px; fill: currentColor; }
.chip .dot { position: absolute; top: 5px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 8px var(--ember); }
.best { font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--frost); font-weight: 600; }
.coins { color: var(--gold); }
.keys { font-size: 13px; color: var(--frost); opacity: 0.8; }
.sheet .card { max-width: 370px; align-items: stretch; text-align: left; }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet-head h3 { margin: 0; flex: 1; font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--ice); }
.muted { color: var(--frost); font-size: 15px; margin: 0; }
.mission { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,0.04); text-align: left; }
.mission .txt { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; line-height: 1.2; }
.mission .rw { font-family: var(--display); color: var(--gold); font-size: 14px; white-space: nowrap; }
.mission.done { border-color: rgba(93,255,196,0.5); background: rgba(93,255,196,0.08); }
.mission.done .rw { color: var(--mint); }
.outfits { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.outfit {
  border-radius: 14px; border: 1px solid var(--line); padding: 8px 4px 9px; text-align: center; cursor: pointer; color: var(--ice);
  background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02)); font: 600 13px var(--body);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.outfit canvas { width: 72px; height: 84px; }
.outfit .nm { line-height: 1.1; min-height: 2.2em; display: flex; align-items: center; }
.outfit .pr { font-family: var(--display); font-size: 12px; color: var(--gold); }
.outfit.sel { border-color: var(--gold); box-shadow: 0 0 16px rgba(255,203,82,0.35), inset 0 0 0 1px var(--gold); }
.outfit.locked canvas { filter: grayscale(0.8) brightness(0.6); }
.tabs { display: flex; gap: 6px; }
.tab { flex: 1; padding: 9px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--frost); font: 700 14px var(--body); letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
.tab.on { background: rgba(255,203,82,0.16); color: var(--gold); border-color: rgba(255,203,82,0.5); }
.lb { display: flex; flex-direction: column; gap: 4px; }
.lb-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,0.03); font-size: 16px; }
.lb-row .rk { font-family: var(--display); color: var(--frost); font-size: 14px; text-align: center; }
.lb-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.lb-row .sc { font-family: var(--display); font-size: 15px; font-variant-numeric: tabular-nums; text-align: right; }
.lb-row .sc small { display: block; font-family: var(--body); font-size: 12px; color: var(--frost); }
.lb-row.me { background: rgba(255,203,82,0.14); }
.lb-row.top .rk { color: var(--gold); }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 16px; font-weight: 600; }
.set-row small { display: block; font-weight: 500; color: var(--frost); font-size: 13px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
.seg button { border: 0; background: transparent; color: var(--frost); font: 700 13px var(--body); letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 11px; cursor: pointer; }
.seg button.on { background: var(--gold); color: #3a2300; }
.toggle { width: 50px; height: 28px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,0.08); position: relative; cursor: pointer; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--frost); transition: transform 0.15s; }
.toggle.on { background: rgba(255,203,82,0.35); border-color: var(--gold); }
.toggle.on::after { transform: translateX(22px); background: var(--gold); }
input[type=range] { accent-color: var(--gold); width: 130px; }
.field { display: flex; gap: 8px; }
.field input {
  flex: 1; min-width: 0; font: 400 20px var(--display); letter-spacing: 0.15em; text-transform: uppercase; text-align: center;
  padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,0.35); color: var(--ice);
  -webkit-user-select: text; user-select: text;
}
.field input.nick { font: 600 17px var(--body); letter-spacing: 0.02em; text-transform: none; text-align: left; }
.code { font-family: var(--display); font-size: 34px; letter-spacing: 0.22em; text-align: center; color: var(--gold); filter: drop-shadow(0 0 12px rgba(255,203,82,0.4)); -webkit-user-select: text; user-select: text; }
.players { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.player { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,0.04); font-size: 16px; font-weight: 600; text-align: left; }
.player i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.player span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player em { font-style: normal; color: var(--frost); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
.note { font-size: 14px; color: var(--frost); line-height: 1.3; margin: 0; }
#deck {
  display: none; gap: 12px; align-items: stretch; position: relative; z-index: 2;
  padding-block: 12px 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(180deg, var(--deck), var(--deck2));
  border-top: 1px solid rgba(190,228,255,0.22); box-shadow: 0 -8px 18px rgba(0,0,0,0.35); touch-action: none;
}
@media (pointer: coarse) { #deck { display: flex; } .keys { display: none; } }
@media (max-height: 720px) { .pad { height: 68px; } #deck { padding-block: 8px 10px; } .card h1 { font-size: 36px; } }
body::before, body::after { content: ""; position: fixed; inset: 0; pointer-events: none; }
body::before {
  background:
    radial-gradient(60% 45% at 12% 12%, rgba(93,255,196,0.3), transparent 70%),
    radial-gradient(50% 40% at 88% 20%, rgba(127,140,255,0.32), transparent 70%),
    linear-gradient(180deg, transparent 55%, rgba(127,212,255,0.08));
  animation: aurora 14s ease-in-out infinite alternate;
}
body::after {
  background-image:
    radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.75) 50%, transparent 52%),
    radial-gradient(1.5px 1.5px at 90px 120px, rgba(255,255,255,0.55) 50%, transparent 52%),
    radial-gradient(2.5px 2.5px at 160px 60px, rgba(255,255,255,0.6) 50%, transparent 52%);
  background-size: 200px 200px, 150px 150px, 260px 260px;
  animation: snowfall 22s linear infinite; opacity: 0.55;
}
@keyframes snowfall { to { background-position: 30px 200px, -20px 150px, 40px 260px; } }
@keyframes aurora { from { opacity: 0.6; transform: translateX(-2%); } to { opacity: 1; transform: translateX(2%); } }
/* title screen: logo on top, your climber centre stage, controls docked at the bottom; the live tower scrolls behind */
#menu { padding: 0; background: radial-gradient(55% 32% at 50% 45%, rgba(5,11,24,0.55), transparent 100%), linear-gradient(180deg, rgba(5,11,24,0.94) 0%, rgba(5,11,24,0.45) 28%, rgba(5,11,24,0.4) 52%, rgba(5,11,24,0.82) 70%, rgba(5,11,24,0.97) 100%); }
body.home #hud, body.home #deck { display: none !important; }
.title-screen { padding-top: max(18px, env(safe-area-inset-top, 0px)); }
.title-screen { box-sizing: border-box; height: 100%; width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 6px;
  padding-block: 14px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-y: auto; }
.ts-top { display: flex; flex-direction: column; align-items: center; position: relative; width: 100%; }
.to-arcade { align-self: flex-start; margin-bottom: 4px; color: var(--gold); text-decoration: none; font: 700 12px var(--body); letter-spacing: 0.14em; padding: 4px 0; }
.ts-tag { display: flex; align-items: center; gap: 8px; font: 700 12px var(--body); letter-spacing: 0.26em; text-transform: uppercase; color: var(--gold); }
.ts-tag i { width: 4px; height: 4px; transform: rotate(45deg); background: var(--frost); }
.logo { margin: 6px 0 0; font-family: var(--sign); font-weight: 400; line-height: 0.86; text-align: center; display: flex; flex-direction: column; align-items: center; }
.logo span {
  display: block; background: linear-gradient(100deg, #8fd0ff 0%, #ffffff 28%, #bfe8ff 42%, #ffffff 52%, #6fb4ff 78%, #e8f8ff 100%);
  background-size: 260% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 0 #173f6e) drop-shadow(0 0 22px rgba(127,212,255,0.55));
  animation: sheen 5s ease-in-out infinite;
}
.logo .l1 { font-size: clamp(40px, min(13vw, 7vh), 60px); letter-spacing: 0.04em; }
.logo .l2 { font-size: clamp(46px, min(16vw, 8.5vh), 72px); letter-spacing: 0.01em; margin-top: 2px; }
.drips { width: 78%; height: 16px; margin-top: -4px;
  background: linear-gradient(180deg, #dff4ff, #7fd4ff 60%, transparent);
  clip-path: polygon(0 0,100% 0,100% 20%,97% 20%,95% 85%,93% 20%,86% 20%,84% 60%,82% 20%,72% 20%,70% 100%,68% 20%,57% 20%,55% 55%,53% 20%,44% 20%,42% 90%,40% 20%,30% 20%,28% 50%,26% 20%,16% 20%,14% 75%,12% 20%,5% 20%,3% 45%,1% 20%,0 20%);
  opacity: 0.85; filter: drop-shadow(0 0 6px rgba(127,212,255,0.6)); }
.hero-wrap { position: relative; border: 0; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; flex: 1 1 auto; min-height: 0; justify-content: center; }
#hero { height: min(140px, 20vh); width: auto; aspect-ratio: 170 / 140; max-width: 100%; }
.hero-name {
  margin-top: 2px; font: 700 13px var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ice);
  padding: 4px 12px; border-radius: 999px; background: rgba(5,10,24,0.6); border: 1px solid rgba(127,212,255,0.35);
}
.hero-name::after { content: "  ›"; color: var(--gold); }
.dock { width: 100%; display: flex; flex-direction: column; gap: 9px; align-items: stretch; text-align: center; }
.btn.play { font-size: 26px; padding: 14px 30px; letter-spacing: 0.06em; position: relative; overflow: hidden; }
.btn.play::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,0.55) 50%, transparent 65%); transform: translateX(-120%); animation: glint 3.2s ease-in-out infinite; }
@keyframes glint { 0%, 55% { transform: translateX(-120%); } 85%, 100% { transform: translateX(120%); } }
.dock .chip { background: rgba(5,10,24,0.55); }
@media (max-height: 640px) { .hero-wrap { display: none; } }
@media (prefers-reduced-motion: reduce) { .logo span, .btn.play::after { animation: none; } }
@media (prefers-reduced-motion: reduce) { body::before, body::after { animation: none; } }
#deck.lefty { flex-direction: row-reverse; }
.pad {
  height: 84px; border-radius: 20px; display: grid; place-items: center; touch-action: none; cursor: pointer;
  color: var(--ice); font-family: var(--display); font-size: 17px; letter-spacing: 0.04em;
  background: linear-gradient(180deg, #1b3363, #0f1f40); border: 1px solid rgba(190,228,255,0.2);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), inset 0 -3px 0 rgba(0,0,0,0.35), 0 5px 0 #050b18;
  transition: transform 60ms, box-shadow 60ms, background 60ms;
}
.pad svg { width: 32px; height: 32px; fill: currentColor; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.5)); }
.pad.on { transform: translateY(4px); background: linear-gradient(180deg, #2a4f8f, #1a3463); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 1px 0 #050b18, 0 0 18px rgba(127,212,255,0.4); }
#padL, #padR { flex: 1; }
#padJ {
  flex: 1.45; color: #3a2300; text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  background: linear-gradient(180deg, #fff0b0, var(--gold) 45%, var(--gold2)); border-color: rgba(255,240,180,0.6);
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.7), inset 0 -3px 0 rgba(120,60,0,0.3), 0 5px 0 #8a5008;
}
#padJ.on { box-shadow: inset 0 2px 0 rgba(255,255,255,0.7), 0 1px 0 #8a5008, 0 0 24px rgba(255,190,60,0.6); background: linear-gradient(180deg, #fff6cc, #ffd56a 45%, #ffae3c); }
@media (prefers-reduced-motion: reduce) { .card h1 { animation: none; } .btn:active, .pad.on { transform: none; } }

  <footer id="deck">

  </footer>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
  const W = 360, WALL = 22, GAP = 80, SUMMIT = 500, RACE_GOAL = 100;
  let H = 640, dpr = 1, scale = 1, R = 1, T = 0;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function seeded(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const hashStr = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const fmtTime = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

  const ICON = {
    sound: '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7l-1.2-1.2a3.3 3.3 0 0 0 0-4.6zM18.4 6a8.5 8.5 0 0 1 0 12l-1.2-1.2a6.8 6.8 0 0 0 0-9.6z"/></svg>',
    mute: '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM15.6 9.2l1.2-1.2L19 10.2 21.2 8l1.2 1.2-2.2 2.2 2.2 2.2-1.2 1.2L19 12.6l-2.2 2.2-1.2-1.2 2.2-2.2z"/></svg>',
    pause: '<svg viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>',
    play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  };

  const ZONES = [
    { name: 'Glacier', sky: ['#14305c', '#081428'], back: '#21477a', mortar: '#0a1830', wall: '#2f5a8f', hi: '#a8dcff', plat: '#e2f6ff', top: '#b9e6ff', edge: '#5aa6dc', deep: '#1d4a78', glow: '#7fd4ff', mote: 'snow', music: { root: 57, prog: [[0, 'm'], [8, 'M'], [3, 'M'], [10, 'M']] } },
    { name: 'Basalt',  sky: ['#2a1f36', '#100c16'], back: '#3e3049', mortar: '#130e18', wall: '#54425f', hi: '#c9b2d8', plat: '#f1e2cd', top: '#d8c3a6', edge: '#a8896c', deep: '#5c4535', glow: '#ffb067', mote: 'ash', music: { root: 50, prog: [[0, 'm'], [10, 'M'], [8, 'M'], [7, 'm']] } },
    { name: 'Aurora',  sky: ['#0d3236', '#051416'], back: '#18504c', mortar: '#05191a', wall: '#1f6760', hi: '#97ffe0', plat: '#d6fff4', top: '#9ff3d8', edge: '#38c39b', deep: '#176451', glow: '#5dffc4', mote: 'aurora', music: { root: 52, prog: [[0, 'M'], [2, 'M'], [9, 'm'], [7, 'M']] } },
    { name: 'Ember',   sky: ['#3a150c', '#140604'], back: '#552116', mortar: '#190806', wall: '#76301d', hi: '#ffb487', plat: '#ffe2bd', top: '#ffc48e', edge: '#de7e42', deep: '#7e3417', glow: '#ff7a36', mote: 'ember', music: { root: 49, prog: [[0, 'm'], [1, 'M'], [0, 'm'], [10, 'M']] } },
    { name: 'Crown',   sky: ['#33270a', '#120e03'], back: '#504012', mortar: '#181204', wall: '#735a16', hi: '#ffe89a', plat: '#fff4cc', top: '#ffe08a', edge: '#e0ad34', deep: '#866414', glow: '#ffd75a', mote: 'gold', music: { root: 55, prog: [[0, 'M'], [7, 'M'], [9, 'm'], [5, 'M']] } },
  ];
  const zoneIdx = f => clamp(Math.floor(f / 100), 0, ZONES.length - 1);
  const zoneOf = f => ZONES[zoneIdx(f)];
  const PRAISE = [[70, 'UNTOUCHABLE'], [40, 'LEGENDARY'], [25, 'MONSTER'], [15, 'HUGE'], [8, 'CLEAN'], [4, 'NICE'], [0, 'COMBO']];

  const OUTFITS = [
    { id: 'frost', name: 'Frost', cost: 0, jacket: ['#ffe08a', '#ffc244', '#d48b16'], arm: '#c98a1e', mitt: '#ffd468', cuff: '#ff5a46', trim: '#e8f6ff', beanie: ['#ffffff', '#b9dcf2'], stripe: '#3f7fc4', pom: '#ff5a46', scarf: ['#ff5a46', '#ffd1c6'], pants: '#25365e', race: '#ffc244' },
    { id: 'southside', name: 'Southside Gold', cost: 150, jacket: ['#fff1b0', '#f2c230', '#a87c08'], arm: '#9c7408', mitt: '#1d1d1d', cuff: '#f2c230', trim: '#151515', beanie: ['#333333', '#0e0e0e'], stripe: '#f2c230', pom: '#f2c230', scarf: ['#151515', '#f2c230'], pants: '#161616', race: '#f2c230' },
    { id: 'risk', name: 'Risk Taker Red', cost: 250, jacket: ['#ff9a8a', '#e8322a', '#9c1410'], arm: '#a8160f', mitt: '#151515', cuff: '#ffffff', trim: '#151515', beanie: ['#ffffff', '#d8d8d8'], stripe: '#e8322a', pom: '#151515', scarf: ['#151515', '#e8322a'], pants: '#1a1a1a', race: '#ff4a3a' },
    { id: 'midnight', name: 'Midnight', cost: 400, jacket: ['#8a96ff', '#3a42c4', '#1c1f6e'], arm: '#262b8a', mitt: '#c9d2ff', cuff: '#7fd4ff', trim: '#c9d2ff', beanie: ['#3a3f80', '#15183d'], stripe: '#7fd4ff', pom: '#7fd4ff', scarf: ['#7fd4ff', '#2b2f6b'], pants: '#101330', race: '#7f8cff' },
    { id: 'aurora', name: 'Aurora', cost: 600, jacket: ['#b8ffe6', '#38c39b', '#147a5e'], arm: '#1a8a6a', mitt: '#ffffff', cuff: '#a68bff', trim: '#ffffff', beanie: ['#e2d6ff', '#a68bff'], stripe: '#38c39b', pom: '#5dffc4', scarf: ['#a68bff', '#5dffc4'], pants: '#123a36', race: '#5dffc4' },
    { id: 'crown', name: 'Crown King', cost: 1000, jacket: ['#ffffff', '#e4e4f0', '#a2a2b8'], arm: '#b4b4c6', mitt: '#ffcb52', cuff: '#ffcb52', trim: '#ffcb52', beanie: null, stripe: '#7a1fd1', pom: null, scarf: ['#7a1fd1', '#ffcb52'], pants: '#2a1450', race: '#c08bff', crown: true },
  ];
  const OUTFIT = id => OUTFITS.find(o => o.id === id) || OUTFITS[0];

  const MISSIONS = [
    { id: 'floor25', text: 'Reach floor 25', reward: 30, check: s => s.floor >= 25 },
    { id: 'combo10', text: 'Land a 10-floor combo', reward: 40, check: s => s.maxCombo >= 10 },
    { id: 'coins20', text: 'Grab 20 coins in one climb', reward: 50, check: s => s.coins >= 20 },
    { id: 'f50nb', text: 'Reach floor 50 without a wall bounce', reward: 80, check: s => s.floorNoBounce >= 50 },
    { id: 'c30', text: 'Land a 30-floor combo', reward: 100, check: s => s.maxCombo >= 30 },
    { id: 'spring5', text: 'Bounce on 5 springs in one climb', reward: 60, check: s => s.springs >= 5 },
    { id: 'basalt', text: 'Reach the Basalt zone (floor 100)', reward: 100, check: s => s.floor >= 100 },
    { id: 'surv120', text: 'Survive for 2 minutes', reward: 70, check: s => s.time >= 120 },
    { id: 'power3', text: 'Use 3 power-ups in one climb', reward: 60, check: s => s.powerups >= 3 },
    { id: 'bounce10', text: 'Bounce off walls 10 times in one climb', reward: 50, check: s => s.wallBounces >= 10 },
    { id: 'daily', text: 'Finish a daily climb', reward: 50, check: s => s.mode === 'daily' && s.ended },
    { id: 'c15x3', text: 'Land three 15-floor combos in one climb', reward: 120, check: s => s.combos15 >= 3 },
    { id: 'race1', text: 'Play an online race', reward: 80, check: s => s.mode === 'race' && s.ended },
    { id: 'aurora', text: 'Reach the Aurora zone (floor 200)', reward: 200, check: s => s.floor >= 200 },
    { id: 'ember', text: 'Reach the Ember zone (floor 300)', reward: 300, check: s => s.floor >= 300 },
    { id: 'crown', text: 'Take the crown at floor 500', reward: 1000, check: s => s.won },
  ];

  // ---------- save data (this device) ----------
  const SAVE_KEY = 'frostbound.v3';
  let save = {
    best: 0, bestFloor: 0, daily: { date: '', score: 0, floor: 0 }, coins: 0, owned: ['frost'], outfit: 'frost', char: 'boy',
    missions: { active: [], done: [] }, tutorialDone: false, nick: '',
    settings: { controls: 'buttons', lefty: false, haptics: true, music: 0.6, sfx: true, reduced: false, muted: false },
  };
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (s) save = { ...save, ...s, settings: { ...save.settings, ...(s.settings || {}) }, missions: { ...save.missions, ...(s.missions || {}) }, daily: { ...save.daily, ...(s.daily || {}) } };
    else {
      const old = JSON.parse(localStorage.getItem('frostbound.best') || 'null');
      if (old) { save.best = old.score || 0; save.bestFloor = old.floor || 0; save.tutorialDone = true; }
    }
  } catch (e) {}
  if (!save.nick) save.nick = 'Climber ' + Math.floor(rand(10, 99));
  const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };
  function ensureMissions() {
    const m = save.missions;
    m.active = m.active.filter(id => MISSIONS.some(x => x.id === id) && !m.done.includes(id));
    let pool = MISSIONS.filter(x => !m.done.includes(x.id) && !m.active.includes(x.id));
    if (!pool.length && m.active.length < 3) { m.done = []; pool = MISSIONS.filter(x => !m.active.includes(x.id)); }
    while (m.active.length < 3 && pool.length) m.active.push(pool.shift().id);
  }
  ensureMissions(); persist();
  const SET = save.settings;
  function buzz(p) { if (SET.haptics && navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} } }

  // ---------- audio ----------
  let ac = null, master = null, sfxBus = null, musicBus = null, noiseBuf = null;
  function audio() {
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.connect(ac.destination);
        sfxBus = ac.createGain(); sfxBus.connect(master);
        musicBus = ac.createGain(); musicBus.connect(master);
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        applyAudio();
      } catch (e) { ac = null; }
    }
    if (ac && ac.state === 'suspended') ac.resume();
  }
  function applyAudio() {
    if (!ac) return;
    master.gain.value = SET.muted ? 0 : 1;
    sfxBus.gain.value = SET.sfx ? 1 : 0;
    musicBus.gain.value = SET.music * 0.55;
  }
  const setMuteUI = () => { $('muteBtn').innerHTML = SET.muted ? ICON.mute : ICON.sound; $('muteBtn').setAttribute('aria-label', SET.muted ? 'Sound off' : 'Sound on'); };
  setMuteUI(); $('pauseBtn').innerHTML = ICON.pause;
  function tone(f1, f2, dur, type = 'square', vol = 0.06, delay = 0, bus) {
    if (!ac) return;
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(bus || sfxBus); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(t, dur, vol, freq, type = 'highpass', bus) {
    if (!ac) return;

  // ---------- character rig: jointed limbs driven by blended poses ----------

  const POSE_KEYS = ['lean', 'head', 't1', 'k1', 't2', 'k2', 'u1', 'e1', 'u2', 'e2'];

    else if (kind === 'rise') Object.assign(P, { lean: 0.2, head: -0.2, t1: 1.1, k1: 1.7, t2: -0.35, k2: 0.5, u1: 1.95, e1: 0.55, u2: 2.55, e2: 0.3 });
    else if (kind === 'apex') Object.assign(P, { lean: 0.06, head: 0, t1: 0.75, k1: 1.3, t2: 0.3, k2: 0.9, u1: 1.7, e1: 0.5, u2: 1.35, e2: 0.6 });

  // On the DARE Arcade site, races run over /api/room (each phone polls ~6x a second while racing) and leaderboards over /api/scores.
  function httpRoom() {

      if (st.countdown <= -0.2) { mode = 'play'; st.banner = { title: 'GLACIER', sub: 'ZONE 1', life: 1.6, max: 1.6, color: ZONES[0].glow }; }
    } else if (mode === 'dying' || mode === 'winning') {
      const slow = mode === 'dying' ? 0.3 : 0.6, p = st.p;
      st.endT -= dt;
      if (mode === 'dying') { p.vy = Math.min(18, p.vy + 0.48 * dt * 60 * slow); p.y += p.vy * dt * 60 * slow; p.rot += 0.03; st.camY += ((p.y - H * 0.55) - st.camY) * 0.05; }
      updatePose(p, 0, dt * 60 * slow);
      if (st.mode === 'race') { st.netT += dt; if (st.netT > 0.2) { st.netT = 0; racePresence(mode === 'dying'); } renderRaceBoard(); }
      stepFx(dt * slow, dt * 60 * slow);
      if (st.endT <= 0) finishRun();
    } else if (mode === 'menu') { st.camY -= 0.55 * dt * 60; genPlats(); stepFx(dt, dt * 60); }
    else if (mode === 'over') {
      stepFx(dt, dt * 60);
      if (st.mode === 'race' && race && race.state === 'done') { st.netT += dt; if (st.netT > 0.5) { st.netT = 0; showRaceResults(); } }
    }
    musicTick();
    draw();
    const home = mode === 'menu' && !$('menu').hidden;
    if (home !== isHome) { isHome = home; document.body.classList.toggle('home', home); }
    if (home) drawHero();
    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  resize(); newGame('classic'); refreshMenu(); applyControls();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (st) draw(); });
  requestAnimationFrame(frame);
  initNet();
})();
</script>
</body>
