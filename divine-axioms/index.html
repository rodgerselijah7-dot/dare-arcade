<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Divine Axioms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=Figtree:wght@500;600&display=swap">
<style>
/* Layout: night-sky book. A constellation of the 47 axioms opens the home screen (each restored axiom lights a star),
   then the daily axiom, then the six parts. Play screen: the axiom line being restored above, word plaques below at thumb level.
   Single dark look by choice (gilt on lapis night). */
:root{
  color-scheme:dark;
  --night:#0d1120; --vault:#151a2e; --rim:#262d48;
  --ivory:#efe7d6; --mist:#9aa0b8;
  --gilt:#d7b56d; --gilt-hi:#f1d99c; --gilt-lo:#7d6634;
  --ember:#e0705a;
  --inscr:'Cinzel','Trajan Pro',Georgia,serif;
  --book:'Spectral',Georgia,'Times New Roman',serif;
  --ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--night);color:var(--ivory);font-family:var(--book);-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(120% 60% at 50% -10%,#1d2546 0%,transparent 60%)}
.wrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 24px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--gilt);outline-offset:3px;border-radius:6px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px}
.back{font:600 .85rem var(--ui);color:var(--mist);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.back:hover{color:var(--ivory)}
.eyebrow{font:600 .7rem var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--gilt)}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
.title{font-family:var(--inscr);font-size:clamp(1.55rem,6.4vw,2.1rem);letter-spacing:.06em;line-height:1.15}
.title em{display:block;font-style:normal;font-size:.5em;letter-spacing:.32em;color:var(--gilt);margin-top:6px}
.authors{font:500 .78rem var(--ui);color:var(--mist);letter-spacing:.04em}

/* constellation */
.sky{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--rim);background:linear-gradient(180deg,#0a0e1b,#111733)}
.sky canvas{display:block;width:100%;height:230px}
.sky .count{padding:10px 14px 12px;border-top:1px solid var(--rim);font:600 .78rem var(--ui);color:var(--mist);font-variant-numeric:tabular-nums}
.sky .count b{color:var(--gilt-hi);font-family:var(--inscr);font-size:1.1rem;margin-right:4px}

/* daily */
.daily{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:16px;background:var(--vault);border:1px solid var(--gilt-lo)}
.daily .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.daily p{margin:0;font-size:1.12rem;line-height:1.45}
.daily .sealed{color:var(--mist);font-style:italic}
.streak{font:600 .75rem var(--ui);color:var(--mist);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;font:600 .9rem var(--ui);padding:12px 18px;border-radius:999px;background:var(--gilt);color:#1a1408}
.btn.ghost{background:transparent;color:var(--ivory);border:1px solid var(--rim)}
.btn[disabled]{opacity:.45;cursor:default}

/* parts */
.parts{display:flex;flex-direction:column;gap:2px}
.part{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--rim);text-align:left;width:100%}
.part .num{font-family:var(--inscr);font-size:1.35rem;color:var(--gilt);text-align:center}
.part .meta{min-width:0;display:flex;flex-direction:column;gap:6px}
.part .meta span{font:600 .9rem var(--ui)}
.part .meta small{font-size:.92rem;color:var(--mist);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:3px;background:var(--rim);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gilt)}
.part .tally{font:600 .8rem var(--ui);color:var(--mist);font-variant-numeric:tabular-nums}
.part.locked{opacity:.45}
.links{display:flex;gap:10px;flex-wrap:wrap}

/* axiom list */
.list{display:flex;flex-direction:column}
.ax{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:16px 4px;border-bottom:1px solid var(--rim);text-align:left;width:100%;align-items:start}
.ax .n{font-family:var(--inscr);color:var(--gilt);font-size:1rem;padding-top:2px}
.ax p{margin:0;font-size:1.05rem;line-height:1.45}
.ax .sub{font:600 .75rem var(--ui);color:var(--mist);margin-top:6px;display:block;letter-spacing:.04em}
.ax.open p{color:var(--gilt-hi)}
.ax.locked{opacity:.4}
.ax .excerpt{font-size:.95rem;color:var(--mist);font-style:italic;margin-top:10px;line-height:1.55}
.stars{color:var(--gilt);letter-spacing:2px;font-size:.8rem}
.stars .off{color:var(--rim)}

/* play */
.play{flex:1;display:flex;flex-direction:column;gap:18px}
.line{min-height:200px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px 10px;padding:26px 14px;border-radius:18px;background:var(--vault);border:1px solid var(--rim);text-align:center}
.word{font-size:clamp(1.15rem,4.8vw,1.45rem);line-height:1.3;color:var(--gilt-hi);animation:settle .35s ease-out}
.slot{display:inline-block;height:1.4rem;border-bottom:2px dotted var(--gilt-lo);align-self:flex-end;margin-bottom:6px}
@keyframes settle{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lights{display:flex;justify-content:center;gap:10px;align-items:center;font:600 .75rem var(--ui);color:var(--mist)}
.lamp{width:10px;height:10px;border-radius:50%;background:var(--gilt-hi);box-shadow:0 0 10px var(--gilt)}
.lamp.out{background:var(--rim);box-shadow:none}
.pool{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:auto}
.tile{font-size:1.08rem;padding:11px 16px;border-radius:10px;background:linear-gradient(180deg,#232a45,#1a2038);border:1px solid var(--gilt-lo);color:var(--ivory);box-shadow:0 2px 0 #0a0d18;transition:transform .12s,opacity .2s}
.tile:active{transform:translateY(2px);box-shadow:none}
.tile.hint{border-color:var(--gilt-hi);box-shadow:0 0 0 2px var(--gilt),0 0 18px var(--gilt)}
.tile.wrong{animation:shake .35s;border-color:var(--ember)}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* reveal */
.veil{position:fixed;inset:0;background:rgba(6,8,16,.82);display:grid;place-items:center;z-index:5;overflow-y:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 20px)}
.card{width:100%;max-width:460px;background:var(--vault);border:1px solid var(--gilt-lo);border-radius:20px;padding:28px 22px;display:flex;flex-direction:column;gap:16px;text-align:center;animation:settle .45s ease-out}
.card .axiom{font-size:clamp(1.3rem,5.6vw,1.65rem);line-height:1.35;color:var(--gilt-hi)}
.card .big-stars{font-size:1.5rem;letter-spacing:6px;color:var(--gilt)}
.card .big-stars .off{color:var(--rim)}
.card blockquote{margin:0;text-align:left;font-style:italic;color:var(--ivory);opacity:.85;line-height:1.6;font-size:1rem;border-left:2px solid var(--gilt-lo);padding-left:14px;max-width:65ch}
.card .cite{font:500 .72rem var(--ui);color:var(--mist);letter-spacing:.06em;text-align:left}
.card .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.empty{color:var(--mist);font-style:italic;text-align:center;padding:30px 10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <!-- HOME -->
  <section id="home" class="wrap-inner" style="display:flex;flex-direction:column;gap:20px">
    <div class="bar"><a class="back" href="/">‹ Arcade</a><span class="authors">Dontae Amare &amp; Samiya Daniel</span></div>
    <h1 class="title">Divine Axioms<em>&amp; Maxims</em></h1>
    <div class="sky"><canvas id="sky" aria-label="Constellation of restored axioms"></canvas><div class="count"><b id="countN">0</b>of 47 axioms restored</div></div>
    <div class="daily" id="daily"></div>
    <div>
      <div class="eyebrow" style="margin-bottom:6px">The six parts</div>
      <div class="parts" id="parts"></div>
    </div>
    <div class="links"><button class="btn ghost" id="toCodex" type="button">Open the Codex</button></div>
  </section>

  <!-- PART -->
  <section id="partView" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="bar"><button class="back" data-home type="button">‹ All parts</button><span class="eyebrow" id="partTally"></span></div>
    <h2 class="title" id="partTitle"></h2>
    <div class="list" id="axList"></div>
  </section>

  <!-- PLAY -->
  <section id="playView" class="play" hidden>
    <div class="bar"><button class="back" id="leave" type="button">‹ Back</button><span class="eyebrow" id="playLabel"></span></div>
    <p style="margin:0;color:var(--mist);font-style:italic;text-align:center">Tap the words in order to restore the axiom.</p>
    <div class="line" id="line" aria-live="polite"></div>
    <div class="lights" id="lights"></div>
    <div class="pool" id="pool"></div>
    <div class="tools"><button class="btn ghost" id="hintBtn" type="button">Reveal next word</button><span class="streak" id="hintNote">Costs one light</span></div>
  </section>

  <!-- CODEX -->
  <section id="codexView" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="bar"><button class="back" data-home type="button">‹ Home</button><span class="eyebrow" id="codexTally"></span></div>
    <h2 class="title">The Codex</h2>
    <p style="margin:0;color:var(--mist)">Every axiom you restore is kept here. Tap one to read from its reflection.</p>
    <div class="list" id="codexList"></div>
  </section>
</div>

<div class="veil" id="reveal" hidden>
  <div class="card">
    <div class="eyebrow" id="rvLabel"></div>
    <div class="big-stars" id="rvStars"></div>
    <p class="axiom" id="rvAxiom" style="margin:0"></p>
    <blockquote id="rvExcerpt"></blockquote>
    <div class="cite">From the reflection in <i>Divine Axioms &amp; Maxims</i></div>
    <div class="acts"><button class="btn" id="rvNext" type="button">Next axiom</button><button class="btn ghost" id="rvBack" type="button">Back</button></div>
  </div>
</div>

<script>
(() => {
const A = [{"t": "Prepare your heart to reap the harvest of what God is cultivating.", "p": 0, "x": "In the vast tapestry of existence, our hearts serve as fertile ground where divine seeds are sown. Just as a farmer tends to the fields, we are called to nurture and cultivate our hearts with intention and care."}, {"t": "Outspoken and Observant cannot coexist.", "p": 0, "x": "In the realm of human interaction and self-awareness, we often find ourselves torn between two seemingly opposing qualities: being outspoken and being observant. On one hand, being outspoken involves expressing our thoughts, opinions, and emotions openly and assertively."}, {"t": "Heal and then reveal.", "p": 0, "x": "In the journey of self-discovery and personal growth, we often encounter aspects of ourselves that are wounded or in need of healing. We carry within us the scars of past experiences, traumas, and emotional burdens that can hinder our ability to fully express and embody our true selves."}, {"t": "Judgment should never be assumed or predestined. Nor infringed upon by acts of bias, coercion, manipulation, or malicious intent.", "p": 0, "x": "The axiom calls us to question the nature of judgment and encourages us to approach it with caution and discernment. Judgment is a complex aspect of human existence, as it involves assessing, categorizing, and forming opinions about people, situations, and experiences."}, {"t": "Peace identifies and witnesses itself through the eye of the storm.", "p": 0, "x": "In the chaos and turbulence of life, finding peace can feel like an elusive quest. However, this axiom reveals a profound truth about the nature of inner tranquility."}, {"t": "You can only become the difference, as the difference maker.", "p": 0, "x": "This axiom carries a profound message about the transformative power of action and the responsibility we have in shaping our reality. It emphasizes that change and growth are not passive endeavors but are brought forth through intentional, purposeful engagement with the world."}, {"t": "The tallest stance of man is upright.", "p": 0, "x": "This axiom speaks to the essence of human character and the nobility of standing tall with integrity and moral virtue. To be upright is not just about physical posture but embodies a metaphorical stance that reflects one's moral and ethical principles."}, {"t": "The soul undergoes constant crystallization, but the process is enhanced and accelerated while encapsulated in a human body.", "p": 0, "x": "At the heart of this axiom lies the profound notion that our human existence serves as a crucible for the refinement and evolution of the soul. Like a diamond in the rough, the soul undergoes continuous transformation and crystallization as it journeys through the realms of existence."}, {"t": "Being present in every moment presented is the basis of intentional living.", "p": 1, "x": "Intentional living is about consciously directing our thoughts, actions, and energies towards creating a purposeful and meaningful life. It begins with the simple yet profound act of being fully present in each passing moment."}, {"t": "The war is won by not fighting.", "p": 1, "x": "This axiom challenges conventional notions of conflict and offers a profound perspective on the nature of victory. It suggests that true triumph lies not in engaging in battles, but in transcending the need for conflict altogether."}, {"t": "Think highly of yourself until you become your higher self.", "p": 1, "x": "This axiom highlights the profound impact of self-belief and self-perception on our personal growth and evolution. It urges us to recognize the immense potential within ourselves and to nurture a positive and empowering self-image."}, {"t": "The lone star only shines as bright as the darkness it's surrounded by, while a constellation only shines as bright as its counterparts.", "p": 1, "x": "This profound axiom draws an analogy between celestial bodies and the nature of human existence. It speaks to the significance of contrast and interconnectedness in our journey of self-discovery, growth, and contribution to the world."}, {"t": "You can either cause harm or create harmony.", "p": 1, "x": "This axiom succinctly captures the fundamental duality of human actions and their consequences. It serves as a powerful reminder of the profound impact our choices and behaviors can have on the world around us."}, {"t": "The shadow exists as proof of light.", "p": 1, "x": "This profound axiom encapsulates a timeless truth about the nature of existence and the interplay of light and darkness in our lives. It reminds us that shadows are not merely the absence of light but rather an undeniable evidence of its presence."}, {"t": "Be imperfect yet powerfully imperial", "p": 1, "x": "In a world that often glorifies perfection and achievement, this axiom reminds us of the beauty and strength found in embracing our imperfections. It encourages us to acknowledge and accept our flaws, while also recognizing our inherent power and authority over our own lives."}, {"t": "Those who compete are in some ways deplete, insecure, inadequate, or incomplete", "p": 1, "x": "Competition has long been seen as a driving force in our society, pushing individuals to strive for success and excellence. However, this axiom challenges the conventional notion of competition and invites us to explore its deeper implications."}, {"t": "Weigh your heart against the feather nightly and daily. Never allow either side to remain unbalanced", "p": 2, "x": "The axiom \"Weigh your heart against the feather nightly and daily. Never allow either side to remain unbalanced\" holds profound significance in the realms of self-reflection, introspection, and maintaining a sense of inner harmony."}, {"t": "Truth and knowledge must become the ultimate source of your power. Any illusion of either paradigm will ultimately and untimely self-destruct", "p": 2, "x": "The axiom \"Truth and knowledge must become the ultimate source of your power. Any illusion of either paradigm will ultimately and untimely self-destruct\" carries profound wisdom, urging us to seek truth and knowledge as the foundation of our personal growth, empowerment, and understanding of the world."}, {"t": "Growth is a direct result of Diligence", "p": 2, "x": "The axiom \"growth is a direct result of diligence\" speaks to the close connection between diligent effort and personal growth. It emphasizes the notion that progress and development in any aspect of life require consistent and focused application of one's energy and resources."}, {"t": "Obedience Omits Forgiveness", "p": 2, "x": "The axiom \"Obedience Omits Forgiveness\" explores the intricate relationship between obedience and forgiveness, shedding light on the potential conflicts and consequences that arise when obedience takes precedence over the act of forgiveness."}, {"t": "The First Person to Walk Down the Path Less Traveled Must Endure Uncertain Dangers in Order to Ensure the Safety and Survival of the Second", "p": 2, "x": "The axiom \"The First Person to Walk Down the Path Less Traveled Must Endure Uncertain Dangers in Order to Ensure the Safety and Survival of the Second\" reflects upon the challenges and responsibilities faced by trailblazers and pioneers who venture into uncharted territories."}, {"t": "Health Is the Prerequisite of Wealth", "p": 2, "x": "The axiom \"Health Is the Prerequisite of Wealth\" underscores the foundational importance of physical, mental, and emotional well-being as a fundamental requirement for achieving true wealth and prosperity in life."}, {"t": "Revenge has the ability to corrupt its host long before it reaches its destination", "p": 2, "x": "The axiom \"Revenge has the ability to corrupt its host long before it reaches its destination\" underscores the destructive nature of revenge and its detrimental impact on those who seek it."}, {"t": "Surround Yourself with Greater Versions of Yourself", "p": 3, "x": "The axiom \"Surround Yourself with Greater Versions of Yourself\" emphasizes the significance of the company we keep and the impact it has on our personal growth and development. It highlights the importance of surrounding ourselves with individuals who inspire, challenge, and uplift us."}, {"t": "Ex's Are Excellent Examples", "p": 3, "x": "The axiom \"Ex's Are Excellent Examples\" addresses the concept of learning from past romantic relationships and viewing them as valuable opportunities for personal growth and self-discovery."}, {"t": "The Future Exists in the Minds of Children", "p": 3, "x": "The axiom \"The Future Exists in the Minds of Children\" emphasizes the profound potential and importance of children in shaping the future. It recognizes that the thoughts, dreams, and aspirations of young minds hold the power to influence and create the world yet to come."}, {"t": "Deserving of the Ensuing Depravity is He Who Trades Eternal Loyalty for Temporary Companionship", "p": 3, "x": "This profound axiom delves into the consequences of compromising one's values and long-term commitments for the sake of short-lived and shallow connections. It highlights the inherent danger of sacrificing deep, meaningful relationships in exchange for temporary gratification, often leading to a sense of emptiness and spiritual decay."}, {"t": "The Weight of Solitude Defeats Even the Mightiest of Men", "p": 3, "x": "This axiom delves into the profound impact that solitude can have on individuals, regardless of their strength or power. It suggests that the burden and challenges of isolation can overpower even the most resilient and influential individuals, highlighting the inherent vulnerability and universal need for connection and companionship."}, {"t": "Time is Only Relevant to the Speculator", "p": 3, "x": "This axiom explores the subjective nature of time and its significance in our lives. It suggests that the perception and importance of time vary depending on an individual's perspective, intentions, and level of engagement with the present moment."}, {"t": "Nothing is New Under the Sun Except for That Which Has Been Forgotten Under the Moon", "p": 3, "x": "This axiom encapsulates the idea that while many things may seem novel or original, they often have their roots in concepts, ideas, or experiences that have existed before. It emphasizes the cyclical nature of life, where knowledge and wisdom are rediscovered or reinterpreted over time."}, {"t": "The Most Humorous Action in the Eyes of God is the Surety of One's Own Intentions", "p": 4, "x": "This axiom delves into the intricacies of human nature, highlighting the irony and humor that can be found when we confidently assert our intentions with absolute certainty. It suggests that despite our best efforts to be certain about our intentions, we are often limited by our own fallibility and the complexities of life."}, {"t": "Occupy the Seat of the Soul", "p": 4, "x": "This powerful axiom directs our attention inward, inviting us to delve into the depths of our being and connect with the essence of who we are. It suggests that true fulfillment and purpose in life can be found by occupying the seat of our soul, the core of our being where our truest self resides."}, {"t": "There is no Mastery without Discipline and no Discipline without Submission", "p": 4, "x": "This axiom emphasizes the essential relationship between mastery, discipline, and submission in our journey of personal growth and development. It highlights the interconnectedness of these three elements and how they contribute to our ability to achieve excellence and reach our highest potential."}, {"t": "Greed and Gluttony are to the Spirit a Swarm of Locusts to a Lush Field of Vegetation", "p": 4, "x": "This axiom draws a powerful analogy between the detrimental effects of greed and gluttony on the human spirit and the destructive impact of a swarm of locusts on a flourishing field of vegetation."}, {"t": "Decide Divinely", "p": 4, "x": "The axiom \"Decide Divinely\" invites us to approach the process of decision-making from a higher perspective, guided by wisdom, intuition, and a connection to a greater power or universal truth."}, {"t": "Forgiveness Keeps Youthful the Heart", "p": 4, "x": "The axiom \"Forgiveness keeps youthful the heart\" holds a profound truth about the transformative power of forgiveness in nurturing a youthful and vibrant spirit. Forgiveness is not just an act of pardoning others for their wrongdoings; it is also an act of self-liberation, releasing the burdens that weigh down the heart and hinder personal growth."}, {"t": "Follow Your Own Feet", "p": 4, "x": "\"Follow your own feet\" serves as a powerful reminder to embrace individuality and authenticity on life's journey. It urges us to trust our inner compass and take ownership of our path, rather than being swayed by external influences or societal expectations."}, {"t": "The Fruit of the Spirit Either Ripens or Rots Through Intentions", "p": 4, "x": "The axiom \"The fruit of the spirit either ripens or rots through intentions\" highlights the significant role that our intentions play in shaping the outcomes and impact of our actions."}, {"t": "Deceived is the One Who Believes. Discerned is the One Who Knows.", "p": 4, "x": "This profound axiom invites us to reflect on the distinction between belief and knowledge and their implications on our understanding of reality. It sheds light on the potential pitfalls of blindly accepting beliefs without critical examination and the power of discernment in seeking deeper truths."}, {"t": "You are only as complete as you have prepared yourself to be.", "p": 5, "x": "The axiom \"You are only as complete as you have prepared yourself to be\" highlights the importance of personal growth, self-development, and taking responsibility for one's own journey toward fulfillment and wholeness."}, {"t": "Death is the ultimate liberation.", "p": 5, "x": "The axiom \"Death is the ultimate liberation\" delves into the profound idea that death, often viewed as an end, can be seen as a release or liberation from the constraints of physical existence."}, {"t": "Men of action are preferred most by the goddess of manifestation.", "p": 5, "x": "This powerful axiom delves into the principle that proactive individuals who take decisive actions are more likely to receive the blessings of manifestation from the universe or higher powers."}, {"t": "Acknowledging, then depriving it of its desired behavior serves as a cease and desist to the ego.", "p": 5, "x": "This profound axiom delves into the concept of self-awareness and the understanding that our ego, with its desires, attachments, and self-centered tendencies, can often hinder our growth and spiritual development."}, {"t": "Selfless souls are the servants of God.", "p": 5, "x": "This profound axiom explores the concept of selflessness and its connection to spirituality and divine service. It suggests that individuals who embody selflessness, who prioritize the well-being and upliftment of others above their own personal interests, are seen as true servants of the divine."}, {"t": "The wisdom of ages is etched in the wrinkles of time.", "p": 5, "x": "This evocative axiom suggests that deep wisdom and profound insights are accumulated through the passage of time and the experiences of countless generations. It acknowledges that the lessons learned, the knowledge gained, and the understanding acquired by humanity over centuries are imprinted in the fabric of time itself, often reflected in the aged individuals who carry the stories and wisdom of the past."}, {"t": "Truth is the compass that guides the seeker's journey.", "p": 5, "x": "This powerful axiom highlights the essential role that truth plays in guiding individuals on their personal and spiritual quests for knowledge, understanding, and meaning. It asserts that truth serves as a reliable compass, pointing the way and providing direction as seekers navigate the vast landscapes of life's questions and mysteries."}, {"t": "Knowledge of self becomes wisdom in its attempt to understand life's existential proponents.", "p": 5, "x": "This thought-provoking axiom points to the profound relationship between self-knowledge and wisdom, highlighting how the journey of understanding ourselves deeply can lead to a greater understanding of the existential aspects of life."}];
const PARTS = ['I','II','III','IV','V','VI'];
const $ = id => document.getElementById(id);

// ---------- progress ----------
let S = { solved: {}, daily: { last: '', streak: 0, done: '' } };
try { const s = JSON.parse(localStorage.getItem('divine-axioms') || 'null'); if (s && s.solved) S = Object.assign(S, s); } catch (e) {}
const save = () => { try { localStorage.setItem('divine-axioms', JSON.stringify(S)); } catch (e) {} };
const solvedCount = () => Object.keys(S.solved).length;
const inPart = p => A.map((a, i) => i).filter(i => A[i].p === p);
const partDone = p => inPart(p).every(i => S.solved[i]);
const partOpen = p => p === 0 || partDone(p - 1);
function axOpen(i) {
  if (S.solved[i]) return true;
  const ids = inPart(A[i].p), k = ids.indexOf(i);
  return partOpen(A[i].p) && (k === 0 || !!S.solved[ids[k - 1]]);
}
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => dayKey(new Date());
function dailyIndex() {
  const d = new Date(); const n = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
  return (n * 7 + 3) % A.length;
}
const starStr = n => '★'.repeat(n) + `<span class="off">${'★'.repeat(3 - n)}</span>`;

// ---------- screens ----------
const views = ['home', 'partView', 'playView', 'codexView'];
function show(id) { views.forEach(v => $(v).hidden = v !== id); scrollTo(0, 0); if (id === 'home') renderHome(); }
document.querySelectorAll('[data-home]').forEach(b => b.onclick = () => show('home'));
$('toCodex').onclick = () => { renderCodex(); show('codexView'); };

function renderHome() {
  $('countN').textContent = solvedCount();
  const di = dailyIndex(), done = S.daily.done === today();
  let streak = S.daily.streak || 0;
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (S.daily.last !== today() && S.daily.last !== dayKey(y)) streak = 0;
  $('daily').innerHTML = `
    <div class="row"><span class="eyebrow">Today's axiom · No. ${di + 1}</span><span class="streak">${streak} day streak</span></div>
    <p class="${done ? '' : 'sealed'}">${done ? A[di].t : 'Sealed until you restore it.'}</p>
    <div class="row"><button class="btn" id="dailyGo" type="button">${done ? 'Read it again' : 'Restore today’s axiom'}</button><span class="streak">Part ${PARTS[A[di].p]}</span></div>`;
  $('dailyGo').onclick = () => done ? openReveal(di, S.solved[di] || 3, 'daily', true) : startPlay(di, 'daily');
  $('parts').innerHTML = PARTS.map((r, p) => {
    const ids = inPart(p), n = ids.filter(i => S.solved[i]).length, open = partOpen(p);
    const first = ids.find(i => S.solved[i]);
    const sub = !open ? `Restore all of Part ${PARTS[p - 1]} to open` : first != null ? `“${A[first].t}”` : 'Begin here';
    return `<button class="part ${open ? '' : 'locked'}" data-p="${p}" type="button">
      <span class="num">${r}</span>
      <span class="meta"><span>Part ${r}</span><small>${sub}</small><span class="prog"><i style="width:${n / ids.length * 100}%"></i></span></span>
      <span class="tally">${n}/${ids.length}</span></button>`;
  }).join('');
  $('parts').querySelectorAll('.part').forEach(b => b.onclick = () => {
    const p = +b.dataset.p;
    if (!partOpen(p)) { b.animate([{ transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'none' }], 250); return; }
    openPart(p);
  });
  drawSky();
}

let curPart = 0;
function openPart(p) {
  curPart = p;
  const ids = inPart(p);
  $('partTitle').textContent = `Part ${PARTS[p]}`;
  $('partTally').textContent = `${ids.filter(i => S.solved[i]).length} of ${ids.length} restored`;
  $('axList').innerHTML = ids.map(i => {
    const s = S.solved[i], open = axOpen(i);
    if (s) return `<button class="ax" data-i="${i}" type="button"><span class="n">${i + 1}</span><span><p>${A[i].t}</p><span class="sub"><span class="stars">${starStr(s)}</span> · Play again</span></span></button>`;
    if (open) return `<button class="ax open" data-i="${i}" type="button"><span class="n">${i + 1}</span><span><p>Restore this axiom</p><span class="sub">${A[i].t.split(' ').length} words</span></span></button>`;
    return `<div class="ax locked"><span class="n">${i + 1}</span><span><p style="color:var(--mist);font-style:italic">Sealed</p></span></div>`;
  }).join('');
  $('axList').querySelectorAll('button.ax').forEach(b => b.onclick = () => startPlay(+b.dataset.i, 'part'));
  show('partView');
}

function renderCodex() {
  const ids = A.map((a, i) => i).filter(i => S.solved[i]);
  $('codexTally').textContent = `${ids.length} of 47`;
  $('codexList').innerHTML = ids.length ? ids.map(i => `<button class="ax" data-i="${i}" type="button" aria-expanded="false"><span class="n">${i + 1}</span><span><p>${A[i].t}</p><span class="sub">Part ${PARTS[A[i].p]} · <span class="stars">${starStr(S.solved[i])}</span></span><span class="excerpt" hidden>${A[i].x}</span></span></button>`).join('')
    : `<p class="empty">Nothing restored yet. Start with Part I or today's axiom.</p>`;
  $('codexList').querySelectorAll('.ax').forEach(b => b.onclick = () => { const x = b.querySelector('.excerpt'); x.hidden = !x.hidden; b.setAttribute('aria-expanded', !x.hidden); });
}

// ---------- play ----------
const norm = w => w.toLowerCase().replace(/[^a-z']/g, '');
let G = null;
function chunksOf(t) {
  const words = t.split(' '), size = Math.ceil(words.length / 9), out = [];
  for (let k = 0; k < words.length; k += size) out.push(words.slice(k, k + size).join(' '));
  return { chunks: out, size };
}
function decoys(i, size, n) {
  const mine = new Set(A[i].t.split(' ').map(norm)), pool = [];
  A.forEach((a, j) => {
    if (j === i) return;
    const w = a.t.split(' ');
    for (let k = 0; k + size <= w.length; k++) {
      const piece = w.slice(k, k + size);
      if (piece.some(x => mine.has(norm(x)) || norm(x).length < 3)) continue;
      pool.push(piece.join(' ').replace(/[.,]$/, ''));
    }
  });
  const out = [];
  while (out.length < n && pool.length) { const p = pool.splice((Math.random() * pool.length) | 0, 1)[0]; if (!out.includes(p)) out.push(p); }
  return out;
}
function startPlay(i, from) {
  const { chunks, size } = chunksOf(A[i].t);
  const extra = decoys(i, size, chunks.length <= 4 ? 3 : 2);
  const tiles = chunks.map((t, k) => ({ t, k })).concat(extra.map(t => ({ t, k: -1 })));
  for (let k = tiles.length - 1; k > 0; k--) { const j = (Math.random() * (k + 1)) | 0; [tiles[k], tiles[j]] = [tiles[j], tiles[k]]; }
  G = { i, from, chunks, tiles, pos: 0, miss: 0 };
  $('playLabel').textContent = from === 'daily' ? `Today's axiom · No. ${i + 1}` : `Part ${PARTS[A[i].p]} · No. ${i + 1}`;
  $('pool').innerHTML = tiles.map((x, n) => `<button class="tile" data-n="${n}" type="button">${x.t}</button>`).join('');
  $('pool').querySelectorAll('.tile').forEach(b => b.onclick = () => tap(b));
  renderLine(); renderLights();
  show('playView');
}
function renderLine() {
  const g = G;
  $('line').innerHTML = g.chunks.map((c, k) => k < g.pos ? `<span class="word">${c}</span>` : `<span class="slot" style="width:${Math.min(9, 1.2 + c.length * 0.55)}rem"></span>`).join('');
}
function renderLights() {
  $('lights').innerHTML = [0, 1, 2].map(k => `<span class="lamp ${k < G.miss ? 'out' : ''}"></span>`).join('') + `<span style="margin-left:6px">${Math.max(0, 3 - G.miss)} lights left</span>`;
}
function tap(b) {
  const g = G, tile = g.tiles[+b.dataset.n];
  document.querySelectorAll('.tile.hint').forEach(t => t.classList.remove('hint'));
  if (tile.t === g.chunks[g.pos]) {
    b.disabled = true; b.style.opacity = 0; setTimeout(() => b.hidden = true, 180);
    g.pos++; renderLine();
    if (g.pos === g.chunks.length) setTimeout(finish, 500);
  } else {
    g.miss++; renderLights();
    b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
  }
}
$('hintBtn').onclick = () => {
  const g = G; if (!g || g.pos >= g.chunks.length) return;
  const n = g.tiles.findIndex((x, k) => x.t === g.chunks[g.pos] && !document.querySelector(`.tile[data-n="${k}"]`).disabled);
  const b = document.querySelector(`.tile[data-n="${n}"]`);
  if (b && !b.classList.contains('hint')) { b.classList.add('hint'); g.miss++; renderLights(); }
};
$('leave').onclick = () => G && G.from === 'part' ? openPart(A[G.i].p) : show('home');

function finish() {
  const g = G, stars = Math.max(1, 3 - g.miss);
  S.solved[g.i] = Math.max(S.solved[g.i] || 0, stars);
  if (g.from === 'daily' && S.daily.done !== today()) {
    const y = new Date(); y.setDate(y.getDate() - 1);
    S.daily.streak = S.daily.last === dayKey(y) ? (S.daily.streak || 0) + 1 : 1;
    S.daily.last = today(); S.daily.done = today();
  }
  save();
  openReveal(g.i, stars, g.from);
}
function openReveal(i, stars, from, reread) {
  $('rvLabel').textContent = (from === 'daily' ? "Today's axiom" : `Part ${PARTS[A[i].p]}`) + ` · No. ${i + 1}`;
  $('rvStars').innerHTML = starStr(stars);
  $('rvStars').hidden = !!reread;
  $('rvAxiom').textContent = A[i].t;
  $('rvExcerpt').textContent = A[i].x;
  const ids = inPart(A[i].p), nxt = ids.find(k => !S.solved[k]);
  const nb = $('rvNext');
  if (from === 'daily') { nb.textContent = 'Continue the journey'; nb.onclick = () => { $('reveal').hidden = true; show('home'); }; }
  else if (nxt != null) { nb.textContent = 'Next axiom'; nb.onclick = () => { $('reveal').hidden = true; startPlay(nxt, 'part'); }; }
  else if (A[i].p < 5) { nb.textContent = `Open Part ${PARTS[A[i].p + 1]}`; nb.onclick = () => { $('reveal').hidden = true; openPart(A[i].p + 1); }; }
  else { nb.textContent = 'Open the Codex'; nb.onclick = () => { $('reveal').hidden = true; renderCodex(); show('codexView'); }; }
  $('rvBack').onclick = () => { $('reveal').hidden = true; from === 'part' ? openPart(A[i].p) : show('home'); };
  $('reveal').hidden = false;
}

// ---------- constellation ----------
const sky = $('sky'), ctx = sky.getContext('2d');
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const STARS = A.map(() => null);
const centers = [[.14, .38], [.32, .7], [.48, .3], [.64, .68], [.8, .34], [.9, .74]];
PARTS.forEach((r, p) => {
  const ids = inPart(p); let ang = rnd() * 6;
  ids.forEach((i, k) => {
    ang += 0.9 + rnd() * 0.9; const rad = 0.035 + (k / ids.length) * 0.07 + rnd() * 0.02;
    STARS[i] = { x: centers[p][0] + Math.cos(ang) * rad * 1.1, y: centers[p][1] + Math.sin(ang) * rad * 2.2, tw: rnd() * 6 };
  });
});
const dust = Array.from({ length: 90 }, () => ({ x: rnd(), y: rnd(), r: rnd() * 0.9 + 0.2, a: rnd() * 0.5 + 0.1 }));
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
function drawSky(t = 0) {
  const dpr = Math.min(devicePixelRatio || 1, 2), w = sky.clientWidth, h = sky.clientHeight;
  if (!w) return;
  if (sky.width !== w * dpr) { sky.width = w * dpr; sky.height = h * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  dust.forEach(d => { ctx.fillStyle = `rgba(239,231,214,${d.a})`; ctx.beginPath(); ctx.arc(d.x * w, d.y * h, d.r, 0, 7); ctx.fill(); });
  PARTS.forEach((r, p) => {
    const ids = inPart(p);
    ctx.strokeStyle = 'rgba(215,181,109,.45)'; ctx.lineWidth = 1;
    ctx.beginPath(); let on = false;
    ids.forEach(i => { const s = STARS[i]; if (S.solved[i]) { on ? ctx.lineTo(s.x * w, s.y * h) : ctx.moveTo(s.x * w, s.y * h); on = true; } else on = false; });
    ctx.stroke();
    ctx.fillStyle = 'rgba(154,160,184,.55)'; ctx.font = '600 10px Cinzel, Georgia, serif'; ctx.textAlign = 'center';
    ctx.fillText(r, centers[p][0] * w, Math.min(h - 8, centers[p][1] * h + 0.16 * h * 1.3));
  });
  A.forEach((a, i) => {
    const s = STARS[i], lit = !!S.solved[i], x = s.x * w, y = s.y * h;
    if (lit) {
      const tw = still ? 1 : 0.8 + Math.sin(t / 700 + s.tw) * 0.2;
      const g = ctx.createRadialGradient(x, y, 0, x, y, 10 * tw);
      g.addColorStop(0, 'rgba(241,217,156,.9)'); g.addColorStop(1, 'rgba(241,217,156,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 10 * tw, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff6dc'; ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 7); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(154,160,184,.35)'; ctx.beginPath(); ctx.arc(x, y, 1.6, 0, 7); ctx.fill();
    }
  });
}
function loop(t) { if (!$('home').hidden) drawSky(t); if (!still) requestAnimationFrame(loop); }
addEventListener('resize', () => drawSky());
renderHome();
requestAnimationFrame(loop);
})();
</script>
