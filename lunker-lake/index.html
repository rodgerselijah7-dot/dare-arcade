<title>Lunker Lake — Dontae Amare</title>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}
.to-arcade{align-self:flex-start;color:#f4c542;text-decoration:none;font-weight:700;font-size:12px;letter-spacing:.14em;padding:4px 0;font-family:"Barlow Condensed","Arial Narrow",sans-serif}
.to-arcade:focus-visible{outline:2px solid #f4c542;outline-offset:2px}</style>

<style>
/* Layout: full-bleed canvas lake; HUD chips pinned to safe edges; fight console docked bottom; overlays as tackle-box cards */
:root{
  --ink:#0b1a24; --panel:#102a36; --panel-2:#16394a; --bone:#f3ead8; --mute:#9fb7bf;
  --amber:#f2a541; --lure:#e5483a; --reed:#7fb069; --gold:#f4c542;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --ui:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;}
[hidden]{display:none!important;}
body{background:var(--ink);color:var(--bone);font-family:var(--ui);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
#game{position:fixed;inset:0;}
canvas{display:block;width:100%;height:100%;}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;}
.hud .col{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0;}
.hud .col.r{align-items:flex-end;}
.chip{background:rgba(8,20,28,.7);border:1px solid rgba(243,234,216,.14);border-radius:999px;padding:5px 12px;font-weight:700;font-size:17px;letter-spacing:.04em;font-variant-numeric:tabular-nums;white-space:nowrap;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.chip small{font-size:12px;color:var(--mute);letter-spacing:.12em;margin-right:6px;text-transform:uppercase;}
.chip.gold{background:rgba(244,197,66,.92);color:var(--ink);border-color:transparent;}
.chip.gold small{color:rgba(11,26,36,.7);}
.chip.sm{font-size:14px;padding:4px 10px;}
#mute,#fs{display:grid;place-items:center;width:36px;height:36px;padding:0;pointer-events:auto;cursor:pointer;color:var(--bone);font:inherit;font-weight:700;font-size:14px;}
.btnrow{display:flex;gap:6px;}
.chip.ico[hidden]{display:none!important;}
#fs:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
@media (orientation:landscape) and (max-height:520px){
  .hud{padding-top:calc(6px + env(safe-area-inset-top,0px));}
  .hud .col{flex-direction:row;flex-wrap:wrap;align-items:center;}
  .hud .col.r{flex-direction:row-reverse;}
  .chip{font-size:15px;padding:4px 10px;}
  .chip.sm,#mute,#fs{font-size:12px;}
  #fight{left:auto;transform:none;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(320px,45vw);padding:8px 12px;gap:5px;}
  .fhead b{font-size:16px;} .track.big{height:14px;} .track{height:10px;}
  #hint{bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:15px;}
  #hint.up{bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(55vw - 32px);left:max(16px,env(safe-area-inset-left,0px));transform:none;text-align:left;}
  #hint.alert{font-size:19px;}
  .card{padding:16px;gap:10px;}
  .title{font-size:40px;}
  .list{max-height:44vh;}
  #fishcv{height:110px;}
}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));
  font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--bone);text-shadow:0 2px 8px rgba(0,0,0,.7);pointer-events:none;text-align:center;width:calc(100% - 32px);transition:bottom .2s;}
#hint.up{bottom:calc(150px + env(safe-area-inset-bottom,0px));}
#hint.alert{color:var(--gold);font-size:24px;}
#fight{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(460px,calc(100% - 32px));
  background:rgba(8,20,28,.82);border:1px solid rgba(243,234,216,.14);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;pointer-events:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.fhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.fhead b{font-family:var(--display);font-size:20px;line-height:1;}
.fhead span{color:var(--mute);font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;}
.bar{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:10px;}
.bar label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700;}
.track{height:14px;border-radius:7px;background:rgba(243,234,216,.1);position:relative;overflow:hidden;}
.track .zone{position:absolute;top:0;bottom:0;left:40%;width:45%;background:rgba(127,176,105,.28);border-left:2px solid var(--reed);border-right:2px solid var(--reed);}
.track .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:7px;background:var(--reed);}
.track.big{height:20px;border-radius:10px;}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,rgba(6,14,20,.25),rgba(6,14,20,.7));
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto;}
.card{width:min(420px,100%);background:linear-gradient(180deg,rgba(20,54,70,.96),rgba(12,34,46,.97));border:1px solid rgba(244,197,66,.24);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:22px;padding:22px 20px;box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);display:flex;flex-direction:column;gap:14px;animation:pop .28s ease-out;}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.title{font-family:var(--display);font-size:clamp(44px,13vw,64px);line-height:.9;letter-spacing:.01em;color:var(--amber);text-wrap:balance;text-shadow:3px 3px 0 #7a2e1f;}
.title span{display:block;color:var(--bone);text-shadow:3px 3px 0 #1d4d5c;}
.sub{color:var(--mute);font-size:18px;line-height:1.3;}
.h2{font-family:var(--display);font-size:28px;color:var(--bone);line-height:1;}
.btns{display:flex;flex-direction:column;gap:10px;}
button.b{font-family:var(--ui);font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase;border:0;border-radius:14px;padding:13px 16px;cursor:pointer;color:var(--ink);background:var(--amber);box-shadow:0 4px 0 #9a5b14;}
button.b:active{transform:translateY(3px);box-shadow:0 1px 0 #9a5b14;}
button.b.alt{background:var(--panel-2);color:var(--bone);box-shadow:0 4px 0 #0a1d26;border:1px solid rgba(243,234,216,.14);}
button.b:disabled{opacity:.4;cursor:default;}
button.b:focus-visible,#mute:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.stat{background:rgba(22,57,74,.8);border-radius:12px;padding:8px 12px;min-width:0;}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums;color:var(--bone);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stat small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);}
.list{display:flex;flex-direction:column;gap:6px;max-height:48vh;overflow-y:auto;}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(22,57,74,.8);border-radius:12px;padding:9px 12px;font-size:18px;}
.row .n{font-weight:700;min-width:0;}
.row .n small{display:block;font-weight:500;font-size:14px;color:var(--mute);letter-spacing:.03em;}
.row .v{font-variant-numeric:tabular-nums;color:var(--amber);font-weight:700;text-align:right;white-space:nowrap;}
.row.locked .n{color:var(--mute);}
.row canvas{width:64px;height:34px;flex:none;}
.pips{display:inline-flex;gap:4px;margin-top:4px;}
.pips i{width:16px;height:6px;border-radius:3px;background:rgba(243,234,216,.15);}
.pips i.on{background:var(--amber);}
.catch-w{font-family:var(--display);font-size:46px;color:var(--bone);line-height:1;font-variant-numeric:tabular-nums;}
.badges{display:flex;gap:6px;flex-wrap:wrap;}
.badge{background:var(--gold);color:var(--ink);font-weight:700;letter-spacing:.12em;font-size:14px;padding:3px 10px;border-radius:999px;text-transform:uppercase;}
.badge.red{background:var(--lure);color:var(--bone);}
.badge.teal{background:#2f7d86;color:var(--bone);}
#fishcv{width:100%;height:150px;border-radius:14px;background:radial-gradient(ellipse at 50% 40%,#2a6b7a,#0e2531 75%);}
.coins{color:var(--gold);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid2 button.b{font-size:17px;padding:11px 10px;}
.list.shop button.b{font-size:15px;padding:8px 11px;flex:none;}
.seg{display:flex;background:rgba(8,20,28,.6);border-radius:12px;padding:4px;gap:4px;}
.seg button{flex:1;font:inherit;font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);background:transparent;border:0;border-radius:9px;padding:9px 8px;cursor:pointer;}
.seg button.on{background:var(--amber);color:var(--ink);}
.seg button:focus-visible,.sk:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
.skins{display:flex;gap:10px;justify-content:center;}
.sk{width:34px;height:34px;border-radius:50%;border:2px solid rgba(243,234,216,.2);cursor:pointer;}
.sk.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(244,197,66,.3);}
#angcv{width:100%;height:150px;border-radius:14px;background:radial-gradient(ellipse at 50% 30%,#3b6f86,#14313f 75%);}
.rodsw{flex:none;width:46px;height:8px;border-radius:4px;position:relative;align-self:center;}
.rodsw i{position:absolute;left:40%;top:-1px;width:3px;height:10px;border-radius:1px;}
.st2{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center;margin-top:5px;max-width:200px;}
.st2 em{font-style:normal;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);}
.meter{height:5px;border-radius:3px;background:rgba(243,234,216,.12);overflow:hidden;}
.meter i{display:block;height:100%;background:var(--amber);border-radius:3px;}
.osw{flex:none;display:flex;gap:3px;}
.osw i{width:12px;height:26px;border-radius:4px;border:1px solid rgba(243,234,216,.15);}
.lsw{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid rgba(243,234,216,.15);}
.mnote{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;background:rgba(244,197,66,.1);border:1px solid rgba(244,197,66,.25);border-radius:12px;padding:8px 12px;font-size:16px;}
.mnote span{color:var(--mute);font-size:12px;letter-spacing:.12em;text-transform:uppercase;align-self:center;}
.board{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:22vh;overflow-y:auto;}
.tick{display:flex;justify-content:space-between;gap:6px;background:rgba(22,57,74,.8);border-radius:10px;padding:6px 10px;font-size:15px;min-width:0;}
.tick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute);}
.tick b{font-variant-numeric:tabular-nums;white-space:nowrap;}
.tick.hot{box-shadow:inset 0 0 0 1px var(--gold);} .tick.glut{opacity:.75;}
.up{color:var(--reed);} .dn{color:var(--lure);} .fl{color:var(--mute);}
.break{display:flex;flex-direction:column;gap:2px;font-size:16px;color:var(--mute);font-variant-numeric:tabular-nums;}
.break div{display:flex;justify-content:space-between;}
.break .tot{color:var(--bone);font-weight:700;font-size:19px;border-top:1px solid rgba(243,234,216,.15);padding-top:4px;margin-top:2px;}
@media (prefers-reduced-motion:reduce){button.b:active{transform:none;}.card{animation:none;}}
</style>

</head>
<body>

<div class="hud">
  <div class="col">
    <div class="chip" id="clock"><small>Time</small>6:00 AM</div>

  </div>

    <div class="btnrow"><button class="chip ico" id="fs" aria-label="Full screen" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="chip ico" id="mute" aria-label="Sound on"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>

</div>

  for(let i=0;i<n;i++){const f=makeFish(sp,x-dir*i*(22+Math.random()*14),y+(Math.random()-.5)*26,dir);f.spd=sp.spd*(.9+Math.random()*.1);fish.push(f);}
}
const freeFish=()=>fish.filter(f=>f.st!=='hooked').length;

/* ---------- input ---------- */
function down(e){
  if(e.target!==cv)return;ac();G.hold=true;G.holdT=0;
  if(G.state==='idle'){G.state='aim';G.power=0;G.pDir=1;}
  else if(G.state==='sink'){if(G.eng&&G.eng.st==='nibble'){spook(G.eng);flash('Too early. Wait for the !');}}
  else if(G.state==='bite'){hookFish();}
}
function up(){
  const wasTap=G.holdT<.18;G.hold=false;
  if(G.state==='aim'){castLure();}
  else if(G.state==='sink'&&wasTap&&G.lure&&!(G.eng&&G.eng.st!=='approach')){twitch();}
}
cv.addEventListener('pointerdown',down);
window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
window.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&ov.hidden){e.preventDefault();down({target:cv});}});
window.addEventListener('keyup',e=>{if(e.code==='Space')up();});

function flash(m,t=1.6){G.msg=m;G.msgT=t;}
function floatText(x,y,txt,col='#f4c542',size=22){floats.push({x,y,txt,col,size,life:1.4});}
function twitch(){const L=G.lure;if(L.y<surf+6)return;L.y=Math.max(surf+6,L.y-14);L.x-=4;G.twitch=1.3;sfx.twitch();ripples.push({x:L.x,y:L.y,r:4,a:.8,u:1});
  for(let i=0;i<4;i++)parts.push({x:L.x,y:L.y,vx:(Math.random()-.5)*20,vy:-25-Math.random()*20,life:1.2,b:1});}

function castLure(){
  const p=G.power;const minX=tip.x+50,maxX=W-24;
  G.lure={x:rodTip.x,y:rodTip.y,sx:rodTip.x,sy:rodTip.y,tx:minX+(maxX-minX)*p,ty:surf,t:0,dur:.55+p*.45,phase:'fly',spin:0};
  G.state='cast';sfx.cast();
}
function spook(f){f.st='flee';f.cool=4;f.dir=f.x<G.lure.x?-1:1;G.eng=null;}
function hookFish(){
  const f=G.eng;if(!f)return;
  const perfect=G.biteT>G.biteMax-.2;
  f.st='hooked';G.state='fight';sfx.hook();buzz(40);G.flash=.25;G.shake=6;
  const d=Math.hypot(f.x-tip.x,f.y-tip.y);
  const strF=f.sp.str*(.6+.8*f.sz);
  G.fx={f,D:d,D0:d,ax:f.x,ay:f.y,T:.3,stam:perfect?.78:1,strF,surge:0,surgeCd:1+Math.random()*2,slack:0,wob:0,jump:null,jumpCd:2.5+Math.random()*3};
  if(perfect){sfx.perfect();floatText(f.x,f.y-30,'PERFECT HOOK','#f4c542',24);}
  const known=S.rec[f.sp.id];
  fname.textContent=f.sp.nf?(f.sp.rest?'Something heavy…':'Something’s kicking…'):known?f.sp.name:(f.sp.legend?'Something HUGE':'Unknown fish');
  fwt.textContent=f.sp.nf?'? lb':'~'+Math.max(1,Math.round(f.w*(.8+Math.random()*.4)))+' lb';
  fightEl.hidden=false;
  for(let i=0;i<10;i++)parts.push({x:f.x,y:f.y,vx:(Math.random()-.5)*60,vy:-30-Math.random()*40,life:1,b:1});
}

/* ---------- day flow ---------- */
function rollWeather(){let r=Math.random();for(const w of WEATHER){r-=w.p;if(r<=0)return w;}return WEATHER[0];}
function startDay(){
  G.t=0;G.haul=0;G.catches=[];G.state='idle';G.lure=null;G.eng=null;G.fx=null;G.overAfter=false;G.streak=0;G.lost=0;
  G.weather=rollWeather();
  const reach=UP.line.depth[lv('line')];
  const pool=SP.filter(s=>!s.nf&&!s.legend&&s.d[0]<=reach-.05&&!s.crown&&(!s.lakes||s.lakes.includes(S.lake))&&(lake().w[s.id]==null||lake().w[s.id]>0));
  G.bounty=pool[Math.floor(Math.random()*pool.length)];
  fish=[];while(freeFish()<10)spawnFish(true);
  rain=[];hideOv();
  G.banner={t:3.4,a:lake().name,b:`Day ${S.days+1} · ${G.weather.name} · Bounty: ${G.bounty.name} pays 2×`};
  flash('Hold to power up · release to cast',3.6);
}
function endDay(){
  G.state='over';fightEl.hidden=true;hintEl.className='';S.days++;
  const isBest=G.haul>S.bestDay;if(isBest)S.bestDay=G.haul;save();
  const real=G.catches.filter(c=>!SPI[c.id].nf);
  const big=real.slice().sort((a,b)=>b.w-a.w)[0];
  const rows=G.catches.slice(-8).reverse().map(c=>`<div class="row"><div class="n">${SPI[c.id].name}<small>${SPI[c.id].nf?(SPI[c.id].kind==='critter'?'Released':SPI[c.id].kind==='reward'?'Treasure find':'Junk'):fmtW(c.w)}</small></div><div class="v">$${c.v}</div></div>`).join('');
  showOv(`<div class="card">
    <div class="h2">Weigh-in</div>
    <div class="sub">Sun's down on day ${S.days}. Here's what came off the boat.</div>
    ${isBest&&G.haul>0?'<div class="badges"><div class="badge">Best day yet</div></div>':''}
    <div class="stats">
      <div class="stat"><small>Catch value</small><b class="coins">$${G.haul}</b></div>
      <div class="stat"><small>Fish landed</small><b>${real.length}</b></div>
      <div class="stat"><small>Biggest</small><b>${big?fmtW(big.w):'—'}</b></div>
      <div class="stat"><small>Bank</small><b class="coins">$${S.coins}</b></div>
    </div>
    ${rows?`<div class="list" style="max-height:32vh">${rows}</div>`:'<div class="sub">Skunked. Tomorrow’s another day.</div>'}
    <div class="btns"><button class="b" id="bMk">Sell at the market${S.cooler.length?' · '+S.cooler.length+' on ice':''}</button><button class="b alt" id="bShop">Tackle shop</button><button class="b alt" id="bMenu">Back to the dock</button></div></div>`);
  on('bMk',marketView);on('bShop',shopView);on('bMenu',menuView);
}
function fmtW(w){const lb=Math.floor(w),oz=Math.round((w-lb)*16);return oz===16?`${lb+1} lb`:`${lb} lb ${oz} oz`;}

/* ---------- overlays ---------- */

function hideOv(){ov.hidden=true;ov.innerHTML='';cardAnim=null;}
function on(id,fn){const el=$(id);if(el)el.addEventListener('click',()=>{ac();fn();});}
function howView(){

   <div class="btns"><button class="b" id="bBack">Got it</button></div></div>`);

function catchView(f){
  const sp=f.sp,k=sp.kind;const r=S.rec[sp.id];const isNew=!r;const isPB=r&&f.w>r.best;
  S.rec[sp.id]={n:(r?r.n:0)+1,best:Math.max(r?r.best:0,f.w)};
  G.state='caught';sfx.catch();buzz([30,40,30]);
  let title=sp.name,lines='',note='',badges=[],val=0;
  const tot=(lab,v)=>`<div class="tot"><span>${lab}</span><span class="coins">$${v}</span></div>`;
  if(!sp.nf){
    const raw=sp.base+sp.per*f.w;const bounty=G.bounty&&G.bounty.id===sp.id;G.streak++;const sm=streakMul();
    val=Math.round(raw*(bounty?2:1)*sm);
    S.cooler.push({id:sp.id,w:Math.round(f.w*100)/100,v:val,day:S.days+1});G.haul+=val;
    lines=`<div><span>Dock price</span><span>$${Math.round(raw)}</span></div>${bounty?'<div><span>Daily bounty</span><span>×2</span></div>':''}${sm>1?`<div><span>Streak · ${G.streak} in a row</span><span>×${sm}</span></div>`:''}`+tot('Base value',val);
    note='On ice in your cooler. Sell it at the fish market after the weigh-in.';
    if(sp.crown||sp.legend)badges.push('<div class="badge">Legendary</div>');if(isNew)badges.push('<div class="badge teal">New species</div>');if(isPB)badges.push('<div class="badge red">Personal best</div>');if(bounty)badges.push('<div class="badge">Bounty 2×</div>');
  }else if(k==='junk'||k==='treasure'){
    val=Math.round(sp.base*(k==='treasure'?1+f.sz*.6:1));S.cooler.push({id:sp.id,w:Math.round(f.w*100)/100,v:val,day:S.days+1});G.haul+=val;
    if(sp.id==='boot')title='Well, that’s a boot.';
    lines=tot(k==='junk'?'Scrap value':'Base value',val);note=k==='junk'?'Tossed in the cooler. Scrap sells at the market.':'Worth a lot at the fish market.';
    badges.push(k==='junk'?'<div class="badge teal">Junk</div>':'<div class="badge">Treasure</div>');
  }else if(k==='reward'){
    if(sp.id==='bottle'){val=20+Math.floor(Math.random()*61);S.coins+=val;lines=tot('Cash rolled up inside',val);note='The note says: “'+TIPS[Math.floor(Math.random()*TIPS.length)]+'”';badges.push('<div class="badge">Message</div>');}
    else if(sp.id==='chest'){val=100+Math.floor(Math.random()*201);S.coins+=val;lines=tot('Gold coins',val);note='Added straight to your bank.';badges.push('<div class="badge">Treasure</div>');}
    else{if(S.lv.lure<3){S.lv.lure++;note='Inside: a '+LBL.lure[S.lv.lure]+'. Your lure just got a free upgrade.';}else{val=150;S.coins+=val;lines=tot('Sold the spare gear',val);note='You already have the best lure, so you sold the extras.';}badges.push('<div class="badge">Free gear</div>');}
  }else{
    val=sp.base;S.coins+=val;lines=tot('Release bonus',val);note='You let it go. Good karma pays.';badges.push('<div class="badge teal">Released</div>');
  }
  G.catches.push({id:sp.id,w:f.w,v:val});save();
  showOv(`<div class="card">
    ${badges.length?`<div class="badges">${badges.join('')}</div>`:''}
    <canvas id="fishcv"></canvas>
    <div class="h2">${title}</div>
    ${sp.nf?'':`<div class="catch-w">${fmtW(f.w)}</div>`}
    ${lines?`<div class="break">${lines}</div>`:''}
    <div class="sub" style="font-size:15px">${note}</div>
    <div class="btns"><button class="b" id="bGo">Keep fishing</button></div></div>`);
  const fc=$('fishcv');const fw=fc.clientWidth,fh=fc.clientHeight;fc.width=Math.round(fw*DPR);fc.height=Math.round(fh*DPR);
  const c2=fc.getContext('2d');const scale=Math.min((fw*.72)/f.len,(fh*.62)/(f.len*Math.min(1.2,sp.h)*1.5));
  const gl=sp.glow||'#ffd75a',special=sp.crown||sp.legend||k==='treasure'||k==='reward';
  const sparks=[];for(let i=0;i<30;i++)sparks.push({x:Math.random()*fw,y:Math.random()*fh,v:10+Math.random()*25,s:Math.random()*2+1,p:Math.random()*6});
  cardAnim=(time)=>{c2.setTransform(DPR,0,0,DPR,0,0);c2.clearRect(0,0,fw,fh);
    for(const s of sparks){s.y-=s.v*.016;if(s.y<-4)s.y=fh+4;c2.fillStyle=special?mixA(gl,gl,0,.4+.4*Math.sin(time*.005+s.p)):`rgba(220,245,255,${.25+.25*Math.sin(time*.004+s.p)})`;c2.beginPath();c2.arc(s.x,s.y,s.s,0,7);c2.fill();}
    const bob=RM?0:Math.sin(time*.003)*4;drawFish(c2,sp,fw/2,fh/2+bob,f.len*scale,1,time,{swim:1.4});};
  on('bGo',()=>{hideOv();if(G.overAfter||G.t>=DAY_LEN)endDay();else G.state='idle';});
}

/* ---------- update ---------- */
function update(dt){
  const playing=['idle','aim','cast','sink','bite','fight'].includes(G.state);
  if(playing)G.t=Math.min(DAY_LEN,G.t+dt);
  if(G.hold)G.holdT+=dt;
  G.msgT=Math.max(0,G.msgT-dt);G.twitch=Math.max(0,G.twitch-dt);G.shake=Math.max(0,G.shake-dt*20);G.flash=Math.max(0,G.flash-dt);
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
  if(playing||G.state==='caught'||G.state==='menu'){while(freeFish()<10)spawnFish(false);}
  ambient(dt);

  const L=G.lure;
  for(const f of fish){
    f.t+=dt;f.cool=Math.max(0,f.cool-dt);
    f.face+=(f.dir-f.face)*Math.min(1,dt*6);
    if(f.st==='swim'){
      if(!f.sp.rest){f.x+=f.dir*f.spd*dt;f.y=f.by+Math.sin(f.t*.9+f.ph)*6;if(Math.random()<.0025)f.dir*=-1;
        if(f.sp.gulp){if(!f.gT&&Math.random()<dt*.04){f.gT=2.6;f.gp=0;}
          if(f.gT>0){f.gT=Math.max(0,f.gT-dt);const q=1-f.gT/2.6,e=Math.sin(q*Math.PI);f.y=lerp(f.by,surf+8,e);
            if(q>.45&&!f.gp){f.gp=1;ripples.push({x:f.x+f.len*.4*f.dir,y:surf,r:2,a:.9});ripples.push({x:f.x+f.len*.4*f.dir,y:surf,r:6,a:.6});for(let i=0;i<5;i++)parts.push({x:f.x+f.len*.4*f.dir,y:surf+4,vx:(Math.random()-.5)*14,vy:-10,life:.8,b:1});}}}}
      if(G.state==='sink'&&!G.eng&&L&&L.phase==='sink'&&f.cool<=0){
        const d=Math.hypot(f.x-L.x,f.y-L.y);
        const ar=attractR()*(f.sp.ambush?1.6:1);
        if(d<ar&&Math.random()<dt*(f.sp.rest?3:f.sp.ambush?2.2:1.0)*biteMul()*fishBite(f.sp)){if(!(f.sp.rest&&d>30)){f.st='approach';G.eng=f;f.gT=0;}}
      }
    }else if(f.st==='approach'){
      if(!L||G.state!=='sink'){f.st='swim';G.eng=null;continue;}
      const dx=L.x-f.x,dy=L.y-f.y,d=Math.hypot(dx,dy);
      if(Math.abs(dx)>4)f.dir=dx>=0?1:-1;
      const sp=Math.max(30,f.spd*.8)*(f.sp.ambush?3.2:1);
      const mx=f.x+(f.len*.48)*f.dir;const md=Math.hypot(L.x-mx,L.y-f.y);
      if(md<10||d<8){f.st='nibble';f.nib=f.sp.ambush?.12+Math.random()*.2:.6+Math.random()*1.3;f.nt=0;if(f.sp.ambush){G.shake=Math.max(G.shake,3);sfx.splash(.12);}}
      else{f.x+=dx/d*sp*dt;f.y+=dy/d*sp*dt;f.by=f.y;}
    }else if(f.st==='nibble'){
      f.nt+=dt;
      f.x=L.x-(f.len*.48)*f.dir+Math.sin(f.nt*18)*1.5;f.y=L.y;
      if(Math.random()<dt*3)ripples.push({x:L.x,y:L.y,r:2,a:.5,u:1});
      if(f.nt>=f.nib&&G.state==='sink'){G.state='bite';G.biteMax=G.biteT=f.sp.rest?1.2:.62+lv('lure')*.06;sfx.bite();buzz(25);}
    }else if(f.st==='flee'){
      f.x+=f.dir*f.spd*2.4*dt;f.by=f.y;if(f.cool<1)f.st='swim';
    }
  }
  fish=fish.filter(f=>f.st==='hooked'||(f.x>-160&&f.x<W+160));

  if(G.state==='aim'){G.power+=G.pDir*dt*1.15;if(G.power>=1){G.power=1;G.pDir=-1;}if(G.power<=0){G.power=0;G.pDir=1;}}
  if(G.state==='cast'&&L){
    L.t+=dt;const k=Math.min(1,L.t/L.dur);
    L.x=L.sx+(L.tx-L.sx)*k;L.y=L.sy+(L.ty-L.sy)*k-Math.sin(k*Math.PI)*(80+(L.tx-L.sx)*.25);L.spin+=dt*14;
    if(k>=1){L.phase='sink';L.y=surf;G.state='sink';sfx.plop();splash(L.x,surf,16);ripples.push({x:L.x,y:surf,r:4,a:1});ripples.push({x:L.x,y:surf,r:1,a:.7});
      if(G.msgT<=0)flash('Tap to twitch · hold to reel in',2);}
  }
  if(G.state==='sink'&&L){
    L.spin+=dt*(G.hold?16:3);
    const maxY=Math.min(maxDepthY(),bottomAt(L.x)-6);
    const engaged=G.eng&&(G.eng.st==='nibble'||G.eng.st==='approach');
    if(G.hold&&G.holdT>=.18&&!engaged){
      const dx=tip.x-L.x,dy=surf+4-L.y,d=Math.hypot(dx,dy);const s=reelSpd()*.55*dt;
      if(d<s+40&&L.x<tip.x+60){reset('idle');}
      else{L.x+=dx/Math.max(d,1)*s;L.y=Math.max(surf+4,L.y+dy/Math.max(d,1)*s);if(Math.random()<.25)sfx.tick();}
    }else if(L.y<maxY){L.y=Math.min(maxY,L.y+70*dt);}
    if(Math.random()<dt*1.5)parts.push({x:L.x,y:L.y,vx:(Math.random()-.5)*6,vy:-20,life:1.4,b:1});
    if(G.t>=DAY_LEN&&!G.eng){reset('idle');endDay();return;}
  }
  if(G.state==='bite'){
    G.biteT-=dt;if(G.biteT<=0){if(G.eng)spook(G.eng);G.state='sink';flash('Missed it. Tap the moment the ! pops');sfx.lose();}
  }
  if(G.state==='idle'&&G.t>=DAY_LEN){endDay();return;}
  if(G.state==='fight')updateFight(dt);

  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.b)p.vy+=420*dt;p.life-=dt;if(p.b&&p.y<surf)p.life=0;if(!p.b&&p.y>surf&&p.vy>0){p.life=0;if(Math.random()<.3)ripples.push({x:p.x,y:surf,r:1,a:.4});}}
  parts=parts.filter(p=>p.life>0);
  for(const r of ripples){r.r+=(r.u?30:42)*dt;r.a-=dt*.8;}ripples=ripples.filter(r=>r.a>0);
  for(const f of floats){f.y-=30*dt;f.life-=dt;}floats=floats.filter(f=>f.life>0);
  hud();
}
function ambient(dt){
  for(const c of clouds){c.x+=c.v*dt;if(c.x>W+160)c.x=-160;}
  for(const s of snow){s.y-=s.v*dt*.3;s.x+=Math.sin(s.y*.05)*.1;if(s.y<surf+4){s.y=bottom;s.x=Math.random()*W;}}
  if(G.weather.id==='rain'&&G.state!=='menu'){for(let i=0;i<Math.round(W/40);i++)if(Math.random()<dt*14)rain.push({x:Math.random()*(W+60),y:-10,v:600+Math.random()*200});}
  for(const r of rain){r.y+=r.v*dt;r.x-=r.v*dt*.12;if(r.y>=surf){r.dead=1;if(Math.random()<.4)ripples.push({x:r.x,y:surf,r:1,a:.35});}}
  rain=rain.filter(r=>!r.dead);
  if(Math.random()<dt*.05&&birds.length<4){const n=3+Math.floor(Math.random()*4),y=surf*(.15+Math.random()*.3);for(let i=0;i<n;i++)birds.push({x:-20-i*18,y:y+(i%2)*8+i*3,v:40+Math.random()*10,p:Math.random()*6});}
  for(const b of birds)b.x+=b.v*dt;birds=birds.filter(b=>b.x<W+40);
  const t=dayT();
  if(t>.78&&flies.length<18&&Math.random()<dt*4)flies.push({x:Math.random()*W,y:surf-10-Math.random()*40,p:Math.random()*6,life:6});
  for(const f of flies){f.life-=dt;f.x+=Math.sin(f.p+f.life)*8*dt;f.y+=Math.cos(f.p*2+f.life)*5*dt;}flies=flies.filter(f=>f.life>0);
}
function reset(st){G.lure=null;G.eng=null;G.fx=null;G.state=st;fightEl.hidden=true;}

function updateFight(dt){
  const F=G.fx,f=F.f;
  F.surgeCd-=dt;if(F.surgeCd<=0&&F.surge<=0&&!F.jump){F.surge=.6+Math.random()*1.0*F.stam;F.surgeCd=1.4+Math.random()*2.6/F.strF;}
  if(F.surge>0)F.surge-=dt;
  // jumps
  F.jumpCd-=dt;

  if(lx!==null){const T=G.fx?G.fx.T:0;const sag=G.fx?(1-Math.min(1,T))*60:G.state==='cast'?6:36;const mx=(rodTip.x+lx)/2;
    const cy=G.state==='cast'?Math.min(rodTip.y,ly)-10:Math.min(surf+sag,Math.max(ly,surf)+sag*.2);
    const path=()=>{ctx.beginPath();ctx.moveTo(rodTip.x,rodTip.y);ctx.quadraticCurveTo(mx,cy,lx,ly);};
    path();ctx.strokeStyle=G.fx&&T>.85?'rgba(229,72,58,.95)':'rgba(243,234,216,.85)';ctx.lineWidth=G.fx?1.3:1;ctx.stroke();
    ctx.save();ctx.beginPath();ctx.rect(0,surf+1,W,H);ctx.clip();path();ctx.strokeStyle='rgba(20,60,70,.45)';ctx.lineWidth=1.4;ctx.stroke();ctx.restore();
    if(!G.fx)drawLure(lx,ly,G.lure.spin||0,time);}
  if(G.state==='sink'&&G.lure&&!G.eng){const pr=G.twitch>0?(1-G.twitch/1.3):0;ctx.strokeStyle=`rgba(244,197,66,${G.twitch>0?.35*(1-pr):.1})`;ctx.setLineDash([3,6]);ctx.beginPath();ctx.arc(G.lure.x,G.lure.y,attractR()*(G.twitch>0?.6+pr*.4:1),0,7);ctx.stroke();ctx.setLineDash([]);}
  if(G.state==='bite'&&G.lure){const p=1+Math.sin(time*.03)*.12;ctx.save();ctx.translate(G.lure.x,G.lure.y-40);ctx.scale(p,p);
    ctx.fillStyle='rgba(244,197,66,.25)';ctx.beginPath();ctx.arc(0,0,28,0,7);ctx.fill();g=ctx.createRadialGradient(-5,-6,1,0,0,18);g.addColorStop(0,'#ffe58a');g.addColorStop(1,'#e8a51c');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,18,0,7);ctx.fill();ctx.fillStyle='#0b1a24';ctx.font='26px "Bowlby One",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',0,2);ctx.restore();
    ctx.strokeStyle='#f4c542';ctx.lineWidth=3;ctx.beginPath();ctx.arc(G.lure.x,G.lure.y-40,23,-Math.PI/2,-Math.PI/2+Math.PI*2*(G.biteT/G.biteMax));ctx.stroke();ctx.textBaseline='alphabetic';ctx.textAlign='left';}
  for(const p of parts){if(p.b){const a=p.life*.55;ctx.strokeStyle=`rgba(220,245,255,${a})`;ctx.lineWidth=.9;ctx.beginPath();ctx.arc(p.x,p.y,2.1,0,7);ctx.stroke();ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fillRect(p.x-1,p.y-1.2,.9,.9);}
    else{const a=Math.min(1,p.life*1.2);ctx.fillStyle=`rgba(225,245,255,${a*.85})`;ctx.beginPath();ctx.arc(p.x,p.y,1.9,0,7);ctx.fill();ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fillRect(p.x-.8,p.y-.9,.8,.8);}}
  if(rain.length){ctx.strokeStyle='rgba(205,220,235,.42)';ctx.lineWidth=1;ctx.beginPath();for(const r of rain){ctx.moveTo(r.x,r.y);ctx.lineTo(r.x+2,r.y-13);}ctx.stroke();}
  if(G.state==='aim'){const bw=Math.min(220,W*.5),bx=Math.max(14,Math.min(W-bw-50,tip.x-40)),by=Math.max(70,rodTip.y-30);
    ctx.fillStyle='rgba(8,20,28,.85)';rr(bx-4,by-4,bw+8,22,11);ctx.fill();
    const pg=ctx.createLinearGradient(bx,0,bx+bw,0);pg.addColorStop(0,'#7fb069');pg.addColorStop(.6,'#f2a541');pg.addColorStop(1,'#e5483a');ctx.fillStyle=pg;rr(bx,by,Math.max(8,bw*G.power),14,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.25)';rr(bx+2,by+1,Math.max(4,bw*G.power-4),4,2);ctx.fill();
    ctx.fillStyle='#f3ead8';ctx.font='700 14px "Barlow Condensed",sans-serif';ctx.fillText(`${Math.round(G.power*100)}%`,bx+bw+12,by+12);
    const tx=tip.x+50+(W-24-tip.x-50)*G.power;ctx.strokeStyle='rgba(244,197,66,.75)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(tx,surf+2,11,3.2,0,0,7);ctx.stroke();}
  ctx.textAlign='center';
  for(const f of floats){ctx.globalAlpha=Math.min(1,f.life);ctx.font=`${f.size}px "Bowlby One",sans-serif`;const hw=ctx.measureText(f.txt).width/2+10;const fx=Math.min(W-hw,Math.max(hw,f.x));ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillText(f.txt,fx+2,f.y+2);ctx.fillStyle=f.col;ctx.fillText(f.txt,fx,f.y);}
  ctx.globalAlpha=1;
  if(G.banner){const b=G.banner,a=Math.min(1,b.t/.5,(3.2-b.t)/.4);ctx.globalAlpha=Math.max(0,a);
    ctx.font=`${Math.min(56,W*.12)}px "Bowlby One",sans-serif`;ctx.fillStyle='#7a2e1f';ctx.fillText(b.a,W/2+3,surf*.5+3);ctx.fillStyle='#f2a541';ctx.fillText(b.a,W/2,surf*.5);
    ctx.font='700 18px "Barlow Condensed",sans-serif';ctx.fillStyle='#f3ead8';ctx.fillText(b.b.toUpperCase(),W/2,surf*.5+30);ctx.globalAlpha=1;}
  ctx.textAlign='left';
  ctx.restore();
  // post: flare, grade, vignette, grain, flash
  if(!over&&sun.y<surf-6&&sun.y>-20&&dk>.3){const cx=W/2,cy=H*.45,vx=cx-sun.x,vy=cy-sun.y;ctx.save();ctx.globalCompositeOperation='lighter';
    for(const q of [[.32,.5,'255,220,160',.07],[.6,1.1,'140,220,255',.045],[.88,.35,'255,180,120',.09],[1.25,1.9,'180,255,220',.035]]){const gx=sun.x+vx*q[0],gy=sun.y+vy*q[0],r=sun.r*q[1]*2;
      const gg=ctx.createRadialGradient(gx,gy,0,gx,gy,r);gg.addColorStop(0,`rgba(${q[2]},${q[3]*dk})`);gg.addColorStop(.7,`rgba(${q[2]},${q[3]*.6*dk})`);gg.addColorStop(1,`rgba(${q[2]},0)`);ctx.fillStyle=gg;ctx.beginPath();ctx.arc(gx,gy,r,0,7);ctx.fill();}
    ctx.restore();}
  ctx.save();ctx.globalCompositeOperation='soft-light';
  if(wk>0){ctx.fillStyle=`rgba(255,140,60,${.32*wk})`;ctx.fillRect(0,0,W,H);}
  if(dk<1){ctx.fillStyle=`rgba(40,60,150,${.45*(1-dk)})`;ctx.fillRect(0,0,W,H);}
  ctx.restore();
  if(dk<1){ctx.fillStyle=`rgba(8,8,30,${(1-dk)*.2})`;ctx.fillRect(0,0,W,H);}
  g=ctx.createRadialGradient(W/2,H*.45,Math.min(W,H)*.35,W/2,H*.45,Math.max(W,H)*.82);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.38)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(grainPat){ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.07;const ox=RM?0:(Math.random()*128)|0,oy=RM?0:(Math.random()*128)|0;ctx.translate(-ox,-oy);ctx.fillStyle=grainPat;ctx.fillRect(0,0,W+128,H+128);ctx.restore();}
  if(G.flash>0){ctx.fillStyle=`rgba(255,250,230,${G.flash*.6})`;ctx.fillRect(0,0,W,H);}
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawLure(x,y,spin,time){
  const Lv=lv('lure');ctx.save();ctx.translate(x,y);ctx.scale(1.15,1.15);
  ctx.strokeStyle='#cfd5d8';ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,4);ctx.stroke();
  ctx.strokeStyle='#d8dde0';ctx.lineWidth=1;ctx.beginPath();ctx.arc(1.5,10,2.4,Math.PI*.1,Math.PI*1.1);ctx.stroke();
  let g;
  if(Lv===0){g=ctx.createRadialGradient(-1.4,-1.4,.3,0,0,4.4);g.addColorStop(0,'#ff8a7a');g.addColorStop(1,'#a8251a');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,4.2,0,7);ctx.fill();
    ctx.fillStyle='#e5483a';ctx.beginPath();ctx.moveTo(-3,3);ctx.quadraticCurveTo(0,13+Math.sin(time*.02)*1.5,3,3);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(1.2,-1,1.1,0,7);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(1.5,-1,.55,0,7);ctx.fill();}
  else if(Lv===1){g=ctx.createLinearGradient(-3,0,3,0);g.addColorStop(0,'#c47a1a');g.addColorStop(1,'#ffc062');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,2,3,4.6,0,0,7);ctx.fill();
    const s=Math.abs(Math.sin(spin));g=ctx.createLinearGradient(-10,-5,-2,0);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#9aa4aa');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(-6,-3,5*s+1,2.6,-.6,0,7);ctx.fill();
    ctx.strokeStyle='rgba(229,72,58,.85)';ctx.lineWidth=.8;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(0,6);ctx.lineTo(i*1.4,12+Math.sin(time*.02+i)*1.2);ctx.stroke();}}
  else if(Lv===2){g=ctx.createLinearGradient(0,-4,0,10);g.addColorStop(0,'#2f7d86');g.addColorStop(.5,'#e5483a');g.addColorStop(1,'#f2a541');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,3,4,7.2,0,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.ellipse(-1.4,1,1.2,4,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-1.4,-.4,1.3,0,7);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-1.2,-.4,.65,0,7);ctx.fill();
    ctx.fillStyle='rgba(243,234,216,.75)';ctx.beginPath();ctx.moveTo(-2.5,-4);ctx.lineTo(2.5,-4);ctx.lineTo(1.5,-7);ctx.lineTo(-1.5,-7);ctx.fill();}
  else{const s=.55+.45*Math.abs(Math.sin(spin));g=ctx.createLinearGradient(-4*s,0,4*s,0);g.addColorStop(0,'#b8780a');g.addColorStop(.45,'#fff0a0');g.addColorStop(1,'#d79a1c');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,4,4*s,7.2,Math.sin(spin)*.3,0,7);ctx.fill();
    ctx.fillStyle=`rgba(255,220,100,${.16+.12*Math.sin(time*.01)})`;ctx.beginPath();ctx.arc(0,4,13,0,7);ctx.fill();}
  ctx.restore();
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(ov.hidden)update(dt);
  else{ambient(dt);for(const f of fish){f.t+=dt;f.face+=(f.dir-f.face)*Math.min(1,dt*6);if(f.st!=='hooked'&&!f.sp.rest){f.x+=f.dir*f.spd*dt*.6;f.y=f.by+Math.sin(f.t*.9+f.ph)*6;}}
    fish=fish.filter(f=>f.x>-160&&f.x<W+160);while(freeFish()<10)spawnFish(false);
    for(const r of ripples){r.r+=40*dt;r.a-=dt*.8;}ripples=ripples.filter(r=>r.a>0);
    for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.b)p.vy+=420*dt;p.life-=dt;}parts=parts.filter(p=>p.life>0);
    G.shake=0;G.flash=Math.max(0,G.flash-dt);if(cardAnim)cardAnim(now);}
  draw(now);requestAnimationFrame(frame);}
window.addEventListener('resize',resize);
resize();while(freeFish()<10)spawnFish(true);
menuView();requestAnimationFrame(frame);
})();
</script>
