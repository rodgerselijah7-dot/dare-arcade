ACTS.handIn=i=>{const ch=storyCh();const q=ch.q[+i];if(!q||!q.h||!hasAll(q.h))return;for(const [k,n] of Object.entries(q.h))take(k,n);chState().hand[+i]=1;addFriend(ch.who,3);sfx.coin();save();rerenderSheet()};
ACTS.chapterDone=()=>{const ch=storyCh();if(!ch||!ch.q.every((q,i)=>qDone(ch,q,i)))return;const st=chState();st.done.push(ch.id);st.cur=null;
  if(ch.rw.d){S.decoStore=S.decoStore||{};S.decoStore[ch.rw.d]=(S.decoStore[ch.rw.d]||0)+1}const r={...ch.rw};delete r.d;giveRw(r);addXP(50*ch.id);addFriend(ch.who,3);sfx.lvl();
  const nx=storyCh();save();rerenderSheet();
  showModal(`${face(ch.who,'pfx')}<h2>Chapter ${ch.id} complete!</h2><div style="font-weight:700;margin:6px 0">${festRwTxt(ch.rw)} +⭐${50*ch.id}</div><div class="sub" style="margin-bottom:14px">“Thank you, neighbor.” — ${CHARS[ch.who].n}${nx?`<br>Next: <b>${nx.t}</b>${S.lvl<nx.lvl?` (Lv ${nx.lvl})`:''}`:''}</div><button class="btn gold" data-close>Onward</button>`)};

/* named neighbors sometimes visit instead of strangers */
function charVisitor(){
  if(S.lvl<2||Math.random()>.45)return null;
  const ids=Object.keys(CHARS).filter(id=>!S.visitors.some(v=>v.ch===id));if(!ids.length)return null;
  const id=pick(ids),c=CHARS[id];const pool=c.likes.filter(x=>srcOwned(ITEMS[x].src)&&(ITEMS[x].lvl||1)<=S.lvl);
  const item=pool.length&&Math.random()<.75?pick(pool):null;return {id,item};
}

const strangerCache={};
function strangerFace(v){if(strangerCache[v.id])return strangerCache[v.id];const size=64;const c=document.createElement('canvas');c.width=c.height=size*2;const g=c.getContext('2d');const main=ctx;ctx=g;
  try{g.fillStyle='#fdf0cf';g.beginPath();g.arc(size,size,size,0,7);g.fill();g.save();g.beginPath();g.arc(size,size,size-2,0,7);g.clip();drawPerson(size,size*.82+29*size/10,false,0,false,lookFor(v.id),size/10);g.restore()}finally{ctx=main}
  return strangerCache[v.id]=c.toDataURL()}

/* ================= HARVEST FESTIVAL (weekly event) ================= */
const FEST_TIERS=[{p:50,r:{c:150}},{p:120,r:{t:2}},{p:220,r:{g:3}},{p:350,r:{d:'arch'}},{p:520,r:{c:600}},{p:750,r:{g:6}},{p:1000,r:{d:'tractor'}},{p:1300,r:{t:4}},{p:1700,r:{g:10}},{p:2200,r:{d:'trophy'}}];
const FEST_WAYS=[['🚚','Truck order',10],['⭐','Express order',25],['📦','Boat crate',15],['🚃','Train car',10],['🛒','Visitor sale',5],['💰','Shop sale',5],['🤝','Help a neighbor',8],['📋','Daily challenge',20]];
function weekStart(d=new Date()){const x=new Date(d);x.setHours(0,0,0,0);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);return x}
function festKey(){return weekStart().toISOString().slice(0,10)}
function festEnd(){const w=weekStart();w.setDate(w.getDate()+7);return w.getTime()}
function festState(){const k=festKey();if(!S.fest||S.fest.week!==k)S.fest={week:k,pts:0,claimed:[]};return S.fest}
function festPts(n,gx,gy){if(S.lvl<3)return;const f=festState();f.pts+=n;if(gx!==undefined)setTimeout(()=>worldFx(gx,gy-1,`+${n}🎪`,'#ffd56e'),350);updateFestBadge()}
const festReady=()=>{const f=festState();return FEST_TIERS.some((t,i)=>f.pts>=t.p&&!f.claimed.includes(i))};
function updateFestBadge(){const b=$('#festBadge');if(!b)return;const n=FEST_TIERS.filter((t,i)=>festState().pts>=t.p&&!festState().claimed.includes(i)).length;b.hidden=!n;b.textContent=n;$('#btnFest').hidden=S.lvl<3}
const festRwTxt=r=>r.d?`${DECOS[r.d].e} ${DECOS[r.d].n}`:rwStr(r);
function openFest(){
  openSheet('🎪 Harvest Festival',()=>{const f=festState();const next=FEST_TIERS.find(t=>f.pts<t.p);
    let h=`<div class="fest"><div class="fe">🎪</div><div class="m"><b>${f.pts} festival points</b><div class="sub">Ends in <span data-end="${festEnd()}">${fmt(festEnd()-now())}</span> · resets every Monday</div>
      <div class="capbar"><i style="width:${next?f.pts/next.p*100:100}%"></i></div><div class="sub">${next?`${next.p-f.pts} to next reward`:'Every reward unlocked!'}</div></div></div>`;
    h+=`<div class="ways">${FEST_WAYS.map(([e,n,p])=>`<span class="chip">${e} ${n} +${p}</span>`).join('')}</div><h4>Rewards</h4>`;
    h+=FEST_TIERS.map((t,i)=>{const got=f.claimed.includes(i),ok=f.pts>=t.p&&!got,ex=!!t.r.d;
      return `<div class="row tier ${got?'dim':''} ${ex?'ex':''}"><div class="tn">${i+1}</div><div class="e">${t.r.d?DECOS[t.r.d].e:t.r.c?'<i class="ii ii-coin"></i>':t.r.g?'<i class="ii ii-gem"></i>':'🧰'}</div><div class="m"><div class="t">${festRwTxt(t.r)}${ex?' <span class="xtag">EXCLUSIVE</span>':''}</div><div class="sub">${t.p} points</div></div>
        ${ok?`<button class="btn gold sm" data-act="festClaim:${i}">Claim</button>`:got?'<span class="sub">✔︎</span>':`<span class="sub">🔒</span>`}</div>`}).join('');
    h+=commHTML();return h;},'fest');
}
ACTS.festClaim=i=>{const f=festState();const t=FEST_TIERS[+i];if(!t||f.pts<t.p||f.claimed.includes(+i))return;f.claimed.push(+i);
  if(t.r.d){S.decoStore=S.decoStore||{};S.decoStore[t.r.d]=(S.decoStore[t.r.d]||0)+1;showModal(`<div class="star">${DECOS[t.r.d].e}</div><h2>${DECOS[t.r.d].n}</h2><div class="sub" style="margin-bottom:12px">Festival exclusive · ✨+${beautyOf(DECOS[t.r.d])} beauty. Find it in Build ▸ Decor.</div><button class="btn gold" data-close="placeEx:${t.r.d}">Place it now</button>`)}
  else{giveRw(t.r);toast(`Festival reward! +${rwStr(t.r)}`)}
  sfx.lvl();save();rerenderSheet();updateFestBadge()};
ACTS.placeEx=k=>{closeSheet();ACTS.placeDeco(k,'1')};

/* ================= SOCIAL: ranks, chat, favorites, likes, community goal ================= */
let rankTab='lvl';
function rankRows(){
  const me={id:'me',name:S.name||'Your farm',lvl:S.lvl,fp:festState().pts,beauty:beauty(),me:true};
  let rows=[me];
  if(Net.online)rows=rows.concat(Net.farms.map(f=>({id:f.id,name:f.name||'A neighbor’s farm',lvl:f.lvl,fp:f.fw===festKey()?(f.fp|0):0,beauty:f.beauty|0,real:true})));
  else rows=rows.concat(botFarms().map((b,i)=>({id:b.id,name:b.name,lvl:b.lvl,fp:Math.round((i*137+S.lvl*23)%900*weekFrac()),beauty:60+((i*97)%300)})));
  return rows;
}
function weekFrac(){return clamp((now()-weekStart().getTime())/(7*864e5),0,1)}
function ranksHTML(){
  const key=rankTab,rows=rankRows().sort((a,b)=>(b[key]||0)-(a[key]||0));
  const lab={lvl:'Level',fp:'Festival',beauty:'Beauty'};
  let h=`<div class="seg">${Object.entries(lab).map(([k,n])=>`<button class="${k===key?'on':''}" data-act="rankTab:${k}">${n}</button>`).join('')}</div>`;
  h+=rows.slice(0,25).map((r,i)=>`<div class="row rank ${r.me?'me':''}"><div class="rk">${i<3?['🥇','🥈','🥉'][i]:i+1}</div><div class="m"><div class="t">${esc(r.name)}${r.real?' 👤':''}${r.me?' (you)':''}</div></div><b>${key==='lvl'?'Lv '+r.lvl:key==='fp'?r.fp+' 🎪':r.beauty+' ✨'}</b></div>`).join('');
  if(!Net.online)h+=`<div class="sub" style="text-align:center;margin-top:6px">Offline: ranking against town farms.</div>`;
  return h;
}
ACTS.rankTab=k=>{rankTab=k;rerenderSheet()};
ACTS.fav=id=>{S.favs=S.favs||[];S.favs=S.favs.includes(id)?S.favs.filter(x=>x!==id):[...S.favs,id];save();rerenderSheet()};

function renderChat(){const el=$('#chatLog');if(!el)return;const atBottom=el.scrollHeight-el.scrollTop-el.clientHeight<40;el.innerHTML=chatLogHTML();if(atBottom)el.scrollTop=el.scrollHeight}
ACTS.openChat=()=>{openSheet('💬 Neighborhood Chat',()=>`<div id="chatLog" class="chatlog">${chatLogHTML()}</div>

ACTS.sendChat=async()=>{const i=$('#chatTxt');if(!i||!Net.online)return;const txt=i.value.replace(/\s+/g,' ').trim().slice(0,140);if(!txt)return;

/* community goal (weekly, everyone together) */
const COMM=[{p:3000,r:{g:5}},{p:7000,r:{c:1500,t:3}},{p:12000,r:{d:'mural'}}];
function commTotal(){
  const town=Math.round(4000*weekFrac());
  const players=Net.online?Net.farms.filter(f=>f.fw===festKey()).reduce((s,f)=>s+(f.fp|0),0):0;
  return town+players+festState().pts;
}
function commHTML(){
  const tot=commTotal(),f=festState();f.comm=f.comm||[];const next=COMM.find(c=>tot<c.p);
  return `<h4>Community goal</h4><div class="comm"><div class="m"><b>🤝 ${tot.toLocaleString()} points together</b><div class="sub">Every farm${Net.online?' and player':''} on the Southside adds to this. Everyone who chips in gets the rewards.</div><div class="capbar"><i style="width:${Math.min(100,tot/(next?next.p:COMM[2].p)*100)}%"></i></div></div></div>`+
    COMM.map((c,i)=>{const got=f.comm.includes(i),ok=tot>=c.p&&!got&&f.pts>=30;return `<div class="row ${got?'dim':''}"><div class="e">${c.r.d?DECOS[c.r.d].e:c.r.g?'<i class="ii ii-gem"></i>':'<i class="ii ii-coin"></i>'}</div><div class="m"><div class="t">${festRwTxt(c.r)}</div><div class="sub">${c.p.toLocaleString()} community points${f.pts<30?' · earn 30 yourself to qualify':''}</div></div>${ok?`<button class="btn gold sm" data-act="commClaim:${i}">Claim</button>`:got?'<span class="sub">✔︎</span>':'<span class="sub">🔒</span>'}</div>`}).join('');
}
ACTS.commClaim=i=>{const f=festState();f.comm=f.comm||[];const c=COMM[+i];if(!c||f.comm.includes(+i)||commTotal()<c.p||f.pts<30)return;f.comm.push(+i);
  if(c.r.d){S.decoStore=S.decoStore||{};S.decoStore[c.r.d]=(S.decoStore[c.r.d]||0)+1;toast(`${DECOS[c.r.d].e} ${DECOS[c.r.d].n} is in your Decor storage!`)}else{giveRw(c.r);toast(`Community reward! +${rwStr(c.r)}`)}sfx.lvl();save();rerenderSheet()};

/* ================= NOTIFICATIONS =================
   Three ways, best first:
   1) Desktop app (installed from the Claude desktop app): real system notifications + dock badge.
   2) Browser notifications, where the page is allowed to ask (e.g. when hosted on its own site later).
   3) Always: a count of ready things in the tab title, and a welcome-back summary in the game. */
const NOTE_TYPES=[['crops','🌾','Crops ready'],['animals','🐔','Animals ready'],['goods','🏭','Goods finished'],['orchard','🍎','Trees & hives ready'],['ships','🚢','Boat & train arrivals'],['daily','🎁','Daily gift']];
const Notify={desk:null,mode:'none',last:{},sentAt:{},state:'off',
  async init(){
    try{if(window.claude&&claude.use){const d=await Promise.race([claude.use('desktop'),new Promise(r=>setTimeout(()=>r(null),11000))]);this.desk=d||null}}catch(e){}
    if(this.desk&&this.desk.notification){
      try{this.state=await this.desk.permissions.state('notifications')}catch(e){this.state='unavailable'}
      this.mode='desktop';try{this.desk.app.dock.setIcon(appIcon()).catch(()=>{})}catch(e){}
    }else if('Notification' in window){this.mode='web';
      // on the arcade site, alerts go through the arcade's service worker (required on Android, and on iPhone home-screen apps)
      try{if(!window.claude&&'serviceWorker' in navigator&&/^https:/.test(location.protocol)){navigator.serviceWorker.register('/sw.js').then(r=>{this.swReg=r}).catch(()=>{})}}catch(e){}try{this.state=Notification.permission==='granted'?'granted':Notification.permission==='denied'?'denied':'prompt'}catch(e){this.mode='none'}}
    if(sheetKey==='settings')rerenderSheet();
  },
  canInstall:false,
  async installState(){try{return this.desk&&this.desk.install?await this.desk.install.state():'unavailable'}catch(e){return 'unavailable'}},
  async enable(){
    S.notif=S.notif||{};S.notif.on=true;save();
    try{
      if(this.mode==='desktop'){const r=await this.desk.permissions.request(['notifications']);this.state=r.notifications}
      else if(this.mode==='web'){const p=await Notification.requestPermission();this.state=p==='granted'?'granted':p==='denied'?'denied':'prompt'}
    }catch(e){this.state='unavailable'}
    if(this.state==='granted'&&Net.arcade)await Alerts.subscribe();
    if(this.state==='granted')this.send('Notifications are on! We’ll tell you when your farm needs you. 🌾');
    rerenderSheet();
  },
  send(body){
    body=String(body).replace(/<[^>]+>/g,'').slice(0,300);
    try{
      if(this.mode==='web'&&this.swReg&&Notification.permission==='granted'){this.swReg.showNotification('Southside Acres',{body,icon:'/southside-acres/icon-192.png',badge:'/icons/favicon-32.png?v=2',tag:'acres',renotify:true,data:{url:location.pathname}}).catch(()=>{});return true}
      if(this.mode==='desktop'&&this.state==='granted'){this.desk.notification.show({body}).catch(()=>{});return true}
      if(this.mode==='web'&&this.state==='granted'){new Notification('Southside Acres',{body,tag:'acres',renotify:true});return true}
    }catch(e){}
    return false;
  },
  counts(){
    const t=now();let crops=0,animals=0,goods=0,orchard=0;
    for(const o of S.objs){
      if(o.t==='plot'&&o.c&&plotState(o).s==='ready')crops++;
      else if(o.t==='pen')animals+=o.a.filter(a=>animalState(PENS[o.k],a).s==='ready').length;
      else if(o.t==='bld')goods+=o.q.filter(j=>t>=j.end).length;
      else if(o.t==='tree'&&!o.dead&&treeState(o).s==='ready')orchard++;
      else if(o.t==='hive'&&hiveReady(o))orchard++;
    }
    const ships=(S.feat.dock&&S.boat&&S.boat.state==='docked'?1:0)+(S.feat.station&&S.train&&S.train.state==='here'?1:0);
    return{crops,animals,goods,orchard,ships,daily:dailyReady()?1:0};
  },
  tick(){
    const c=this.counts();const total=c.crops+c.animals+c.goods+c.orchard;
    const away=document.hidden||!document.hasFocus();
    try{document.title=(away&&total?`(${total}) `:'')+'Southside Acres'}catch(e){}
    try{if(this.desk&&this.desk.app)this.desk.app.dock.setBadge(total?String(total):'').catch(()=>{})}catch(e){}
    const on=S.notif&&S.notif.on&&this.state==='granted'&&!(Net.arcade&&Alerts.sub);
    if(on&&away){
      const pref=S.notif,msgs=[];
      const rose=k=>c[k]>0&&!(this.last[k]>0)&&pref[k]!==false&&now()-(this.sentAt[k]||0)>10*60000;
      if(rose('crops'))msgs.push(`${c.crops} field${c.crops>1?'s are':' is'} ready to harvest`);
      if(rose('animals'))msgs.push(`${c.animals} animal${c.animals>1?'s are':' is'} ready to collect`);
      if(rose('goods'))msgs.push(`${c.goods} good${c.goods>1?'s are':' is'} done`);
      if(rose('orchard'))msgs.push('fruit and honey are ready');
      if(rose('ships'))msgs.push(S.boat&&S.boat.state==='docked'?'a boat just docked':'the train is in');
      if(rose('daily'))msgs.push('your daily gift is waiting');
      if(msgs.length){const m=msgs.join(', ');this.send(m.charAt(0).toUpperCase()+m.slice(1)+'. 🚜');for(const k of Object.keys(c))if(c[k]>0&&!(this.last[k]>0))this.sentAt[k]=now()}
    }
    this.last=c;
  },
};
function appIcon(){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#bfe7ff');gr.addColorStop(.55,'#e9f7ff');gr.addColorStop(.55,'#86c254');gr.addColorStop(1,'#5f9a3c');g.fillStyle=gr;g.fillRect(0,0,256,256);
  g.drawImage(ICO.canvasFor('wheat'),24,96,130,130);g.drawImage(ICO.canvasFor('an_chicken'),110,90,140,140);return c.toDataURL('image/png')}
function notifHTML(){

  }else{

/* ================= WEATHER ================= */
const WX={sun:{e:'☀️',n:'Sunny'},cloud:{e:'⛅',n:'Cloudy'},rain:{e:'🌧️',n:'Rain — crops grow 25% faster'},rainbow:{e:'🌈',n:'Rainbow — lucky finds doubled'}};
function weatherTick(){
  const t=now();
  if(!S.weather||t>=S.weather.until){
    const prev=S.weather&&S.weather.k;let k;const r=Math.random();
    if(prev==='rain'&&r<.45)k='rainbow';else k=r<.55?'sun':r<.78?'cloud':'rain';
    S.weather={k,until:t+(k==='rainbow'?4:7+rnd(8))*60000};
    if(k==='rain'){toast('🌧️ Rain rolling in — crops grow faster!');}
    if(k==='rainbow'){toast('🌈 A rainbow! Lucky finds are doubled for a bit');sfx.lvl()}
  }
  if(S.weather.k==='rain'){for(const o of S.objs){if(o.t==='plot'&&o.c&&plotState(o).s==='grow')o.pt-=250;if(o.t==='tree'&&!o.dead&&treeState(o).s==='grow')o.pt-=250}}
  rainSound(S.weather.k==='rain'&&S.ambient!==false);
  const w=WX[S.weather.k];const el=$('#wx');if(el){el.textContent=w.e;el.title=w.n}
}
const luck=()=>S.weather&&S.weather.k==='rainbow'?2:1;
let rainNode=null;
function rainSound(on){
  if(!AC)return;on=on&&S.sfx;
  if(on&&!rainNode){try{const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),c=buf.getChannelData(0);for(let i=0;i<len;i++)c[i]=Math.random()*2-1;
    const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=buf;s.loop=true;f.type='lowpass';f.frequency.value=1400;g.gain.value=0;g.gain.setTargetAtTime(.05,AC.currentTime,1.5);s.connect(f).connect(g).connect(master);s.start();rainNode={s,g}}catch(e){}}
  else if(!on&&rainNode){const n=rainNode;rainNode=null;n.g.gain.setTargetAtTime(0,AC.currentTime,1);setTimeout(()=>{try{n.s.stop()}catch(e){}},4000)}
}
const drops=Array.from({length:110},()=>({x:Math.random(),y:Math.random(),s:.7+Math.random()*.6}));
function drawWeather(t,dt){
  const k=S.weather&&S.weather.k;if(!k||VIEW||S.wfx===false)return;
  ctx.save();ctx.setTransform(DPR,0,0,DPR,0,0);
  if(k==='rain'||k==='cloud'){ctx.fillStyle=k==='rain'?'rgba(40,55,80,.18)':'rgba(60,70,90,.07)';ctx.fillRect(0,0,VW,VH)}
  if(k==='rain'){ctx.strokeStyle='rgba(210,225,255,.55)';ctx.lineWidth=1.2;ctx.beginPath();
    for(const d of (liteFx?drops.slice(0,40):drops)){d.y+=dt*.0014*d.s;d.x-=dt*.00012;if(d.y>1){d.y=-.05;d.x=Math.random()*1.1}if(d.x<-.05)d.x=1.05;const x=d.x*VW,y=d.y*VH;ctx.moveTo(x,y);ctx.lineTo(x-3,y+12*d.s)}ctx.stroke();
    for(let i=0;i<5;i++){const ph=((t/700)+i/5)%1;const x=((i*0.37+Math.floor(t/700)*.13)%1)*VW,y=VH*.3+((i*.29+Math.floor(t/700)*.21)%1)*VH*.6;ctx.strokeStyle=`rgba(220,235,255,${.5*(1-ph)})`;ctx.beginPath();ctx.ellipse(x,y,ph*10,ph*4,0,0,7);ctx.stroke()}}
  if(k==='rainbow'){const cx=VW*.75,cy=VH*.55,R=VW*.9;const cols=['#ff5a5a','#ffa93a','#ffe14a','#6be46b','#4fb4ff','#8a6bff'];ctx.globalAlpha=.16;ctx.lineWidth=10;cols.forEach((c,i)=>{ctx.strokeStyle=c;ctx.beginPath();ctx.arc(cx,cy,R-i*10,Math.PI*1.1,Math.PI*1.75);ctx.stroke()});ctx.globalAlpha=1}
  ctx.restore();
}

/* ================= BEEHIVES ================= */
function hiveTime(){return HIVE.time*1000*(1-.1*stars('hive_honey'))}
function hiveReady(o){return now()-(o.ht||0)>=hiveTime()}
function hiveYield(o){return 2+(S.objs.some(p=>(p.t==='deco'||p.t==='tree')&&Math.abs(p.x-o.x)<=4&&Math.abs(p.y-o.y)<=4)?1:0)}
function tapHive(o){
  if(hiveReady(o)){const n=hiveYield(o);if(spaceFor('honey')<n){fullMsg('honey');return}add('honey',n);addXP(4*n);o.ht=now();sfx.pop();addMastery('hive_honey');stat('honey',n);
    worldFx(o.x+.5,o.y+.5,`+${n}🍯`);flyTo(o.x+.5,o.y+.5,'🍯','#btnStore');burst(o.x+.5,o.y+.3,['#ffd23a','#f0a81d'],10);save();return}
  const left=(o.ht||0)+hiveTime()-now();
  showPop(`<div class="pe">🐝</div><div class="pm"><b>Beehive</b><div class="sub">Honey in <span data-end="${(o.ht||0)+hiveTime()}">${fmt(left)}</span> · ${hiveYield(o)===3?'flowers nearby: +1 🍯':'put flowers or trees nearby for +1 🍯'}</div></div><button class="btn gem sm" data-act="skipHive:${o.id}">⚡ <i class="ii ii-gem"></i>${gemCost(left)}</button><button class="x sm" data-act="hidepop">✕</button>`,o);
}

function drawFish(f,t){
  const {g,W,H}=f;const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#5ab8e6');gr.addColorStop(1,'#1d6fa3');g.fillStyle=gr;g.fillRect(0,0,W,H);

  if(f.st==='wait'||f.st==='bite'){const dip=f.st==='bite'?Math.abs(Math.sin(t/60))*8:Math.sin(t/400)*2;

function renderMine(){

ACTS.mineEnter=()=>{
  if(S.mine&&S.mine.sw>0)return;
  if(!have('pickaxe')){toast('Need a ⛏️ Pickaxe — buy one here or in Build ▸ Supplies');sfx.bad();return}
  take('pickaxe',1);const cells=[];
  const D=DEPTHS[S.mineDepth||0];const tot=Object.values(D.w).reduce((a,b)=>a+b,0);
  for(let i=0;i<30;i++){let r=Math.random()*tot,l='none';for(const [k,w] of Object.entries(D.w)){r-=w;if(r<=0){l=k;break}}
    cells.push({l,hp:Math.random()<D.hard?2:1,tool:pick(TOOL_DROPS)})}

ACTS.mineHit=i=>{
  const m=S.mine;if(!m||m.sw<=0){toast('Out of swings — start a new dig');return}
  const c=m.cells[+i];if(c.hp<=0)return;
  c.max=c.max||c.hp;m.sw--;c.hp--;sfx.chop();stat('mined');
  if(c.hp<=0){
    if(c.l==='gem'){S.gems+=1;sfx.clink();toast('<i class="ii ii-gem"></i> A gem!')}
    else if(c.l==='tool'){if(spaceFor(c.tool)>0)add(c.tool,1);sfx.clink()}

  }

};

/* ================= ONLINE: cloud save, market, neighborhood ================= */
const Net={dev:Math.random().toString(36).slice(2,10),user:null,owner:false,likes:0,chat:[],db:null,uid:null,online:false,helpCount:0,market:[],helps:[],farms:[],saving:false,saveT:0,pubT:0,
  status(){return this.online?'Synced to your account — play on any device':'Saved on this device'},
  async init(){
    try{
      if(!window.claude||!window.claude.use)return ARC.on()?this.initArcade():this.offline();
      const to=new Promise(r=>setTimeout(()=>r(null),11000));
      const [db,user]=await Promise.all([Promise.race([claude.use('db'),to]),Promise.race([claude.use('user'),to])]);
      if(!db||!user)return this.offline();
      const uid=await user.id();if(!uid)return this.offline();
      this.db=db;this.uid=uid;this.online=true;this.user=user;try{this.owner=await user.isOwner()}catch(e){}
      await this.loadCloud();
      this.subscribe();this.publishFarm(true);try{frInit()}catch(e){}
      $('#netDot').className='on';
    }catch(e){this.offline()}
  },
  offline(){this.online=false;$('#netDot').className='off'},
  saveRef(){return this.db.doc(`data/users/${this.uid}/save`)},
  async loadCloud(){
    try{const snap=await this.saveRef().get();
      if(snap.exists){const d=snap.data();if(d&&d.s&&(d.saved||0)>(S.saved||0)+2000){const cs=JSON.parse(d.s);if(cs&&cs.v===2){S=cs;normalize();penAnims.clear();actors.vis.clear();fillOrders();updateFarmName();toast('☁️ Loaded your farm from the cloud');try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}}}
      else this.queueSave(true);
    }catch(e){}
  },
  queueSave(force){
    if(!this.online)return;clearTimeout(this.saveT);
    this.saveT=setTimeout(()=>this.flush(),force?100:6000);
  },
  async flush(){
    if(!this.online)return;if(this.saving){this.queueSave();return}
    this.saving=true;try{await this.saveRef().set({s:JSON.stringify(S),saved:S.saved||now(),dev:this.dev})}catch(e){}this.saving=false;
  },
  subscribe(){
    const db=this.db;
    db.collection('market').orderBy('t','desc').limit(80).onSnapshot(s=>{this.market=s.docs.map(d=>({id:d.id,...d.data()})).filter(validListing);this.checkSales();if(sheetKey==='paper'||sheetKey==='stand'||sheetKey==='nb')rerenderSheet()},()=>{});
    db.collection('help').orderBy('t','desc').limit(60).onSnapshot(s=>{this.helps=s.docs.map(d=>({id:d.id,...d.data()}));this.checkHelps();if(sheetKey==='nb')rerenderSheet()},()=>{});
    db.collection('farms').orderBy('t','desc').limit(50).onSnapshot(s=>{this.farms=s.docs.map(d=>({id:d.id,...d.data()})).filter(f=>f.id!==this.uid&&typeof f.lvl==='number'&&f.lvl>0&&f.lvl<200);if(sheetKey==='nb'||sheetKey==='fest')rerenderSheet()},()=>{});
    db.collection('chat').orderBy('t','desc').limit(40).onSnapshot(s=>{this.chat=s.docs.map(d=>({id:d.id,...d.data()})).filter(m=>typeof m.txt==='string'&&m.txt.length<=140).reverse();renderChat()},()=>{});
    db.collection('likes/'+this.uid+'/by').onSnapshot(s=>{this.likes=s.size},()=>{});
    this.saveRef().onSnapshot(d=>{if(!d.exists)return;const x=d.data();if(x&&x.dev&&x.dev!==this.dev&&(x.saved||0)>(S.saved||0)+3000&&!this.conflict){this.conflict=true;showModal(`<div class="star">☁️</div><h2>Played on another device</h2><div class="sub" style="margin-bottom:14px">Your farm was saved on another phone or tab after this one. Which farm do you want to keep?</div><button class="btn gold" style="width:100%;margin-bottom:8px" data-close="useCloud">Load the newer farm</button><button class="btn red" style="width:100%" data-close="keepLocal">Keep this one</button>`)}},()=>{});
  },
  /* -------- farm profile for visits -------- */
  publishFarm(force){
    if(!this.online)return;const t=now();if(!force&&t-this.pubT<30000)return;this.pubT=t;
    const objs=S.objs.map(o=>{switch(o.t){case'plot':return[o.t,o.x,o.y,o.c||''];case'pen':return[o.t,o.x,o.y,o.k,o.a.length];case'bld':return[o.t,o.x,o.y,o.k];case'tree':return[o.t,o.x,o.y,o.k,o.dead?1:0];case'deco':return[o.t,o.x,o.y,o.k];default:return[o.t,o.x,o.y]}});
    const f=festState();this.db.doc('farms/'+this.uid).set({name:(S.name||'').slice(0,24),lvl:S.lvl,t,objs:JSON.stringify(objs),land:S.land,feat:S.feat,fp:f.pts,fw:f.week,beauty:beauty(),hs:S.hs|0,ch:(S.story&&S.story.done||[]).length}).catch(()=>{});
  },
  /* -------- market -------- */
  async list(slot){
    if(!this.online)return;
    try{const ref=await this.db.collection('market').add({seller:this.uid,farm:(S.name||'').slice(0,24),item:slot.item,qty:slot.qty,price:slot.price,t:now(),buyer:''});slot.lid=ref.id;save()}catch(e){}
  },
  checkSales(){
    let ch=false;
    for(const sl of S.stand.slots){if(!sl.lid||sl.sold)continue;const m=this.market.find(x=>x.id===sl.lid);
      if(m&&m.buyer&&m.buyer!=='bot'){sl.sold=true;sl.buyer='neighbor';ch=true;toast(`💰 A neighbor bought your ${E(sl.item)}×${sl.qty}!`);sfx.coin()}}
    if(ch)save();
  },
  async buy(listing){
    if(!this.online||!validListing(listing))return false;
    const ref=this.db.doc('market/'+listing.id);
    try{const l=await ref.acquire({holder:this.uid,ttlMs:4000});if(!l.acquired)return false;
      const snap=await ref.get();if(!snap.exists)return false;const d=snap.data();if(d.buyer)return false;
      await ref.update({buyer:this.uid,bt:now()});return true}catch(e){return false}
  },
  removeListing(lid){if(this.online&&lid)this.db.doc('market/'+lid).delete().catch(()=>{})},
  async claimForBot(lid){ // townsfolk purchase: only if no player bought it first
    if(!this.online||!lid)return true;const ref=this.db.doc('market/'+lid);
    try{const l=await ref.acquire({holder:this.uid,ttlMs:4000});if(!l.acquired)return false;const s=await ref.get();if(!s.exists)return true;if(s.data().buyer)return false;await ref.update({buyer:'bot'});return true}catch(e){return true}
  },
  /* -------- help -------- */
  requestHelp(req){
    if(this.online){this.db.collection('help').add({owner:this.uid,farm:(S.name||'').slice(0,24),...req,t:now(),filledBy:''}).catch(()=>{})}
    S.botHelp=S.botHelp||{};S.botHelp[req.ref]=now()+(this.online?12:4)*60000+rnd(4*60000); // a townsfolk pitches in if nobody does
  },
  checkHelps(){
    const mine=this.helps.filter(h=>h.owner===this.uid);
    for(const h of mine){if(!h.filledBy)continue;applyHelp(h.ref,true);this.db.doc('help/'+h.id).delete().catch(()=>{})}
    this.helpCount=this.helps.filter(h=>h.owner!==this.uid&&!h.filledBy).length;
  },
  async fillHelp(h){
    if(!this.online)return false;const ref=this.db.doc('help/'+h.id);
    try{const l=await ref.acquire({holder:this.uid,ttlMs:4000});if(!l.acquired)return false;const s=await ref.get();if(!s.exists||s.data().filledBy)return false;await ref.update({filledBy:this.uid});return true}catch(e){return false}
  },
};

function applyHelp(ref,byNeighbor){
  if(!S.helpReq[ref])return;delete S.helpReq[ref];if(S.botHelp)delete S.botHelp[ref];
  if(ref.startsWith('tree')){const o=objById(+ref.slice(4));if(o&&o.dead){reviveTree(o);toast(`👥 ${byNeighbor?'A neighbor':'A townsfolk'} watered your ${TREES[o.k].n}!`)}}
  else if(ref.startsWith('crate')&&S.boat&&S.boat.state==='docked'){const i=+ref[5];if(ref==='crate'+i+S.boat.t)completeCrate(i,true)}

function botTick(){
  const t=now();
  // townsfolk help
  if(S.botHelp)for(const [ref,at] of Object.entries(S.botHelp)){if(t>=at)applyHelp(ref,false)}
  // townsfolk buy from your stand
  for(const sl of S.stand.slots){
    if(sl.sold||sl.pending)continue;
    if(!sl.botAt){const val=ITEMS[sl.item].sell*sl.qty,ratio=sl.price/val;if(ratio>2.4){sl.botAt=-1;continue}sl.botAt=t+(60000+ratio*ratio*90000)*(.6+Math.random()*.8);continue}
    if(sl.botAt>0&&t>=sl.botAt){sl.pending=true;Net.claimForBot(sl.lid).then(ok=>{sl.pending=false;if(ok){sl.sold=true;sl.buyer='townsfolk';toast(`💰 A townsfolk bought your ${E(sl.item)}×${sl.qty}`);sfx.coin()}else sl.botAt=-1;save();if(sheetKey==='stand')rerenderSheet()})}
  }
  // refresh bot newspaper
  if(!S.paper||t>S.paper.until)S.paper={until:t+8*60000,items:genBotListings()};
}

    const mult=it.k==='tool'?1.2+Math.random():.9+Math.random()*.8;out.push({id:'b'+i+'_'+t36(),item:id,qty,price:Math.max(1,Math.round(it.sell*qty*mult)),farm:pick(FARM_NAMES),bot:true})}
  return out;
}

/* bot farms: seeded layouts so they look the same each visit */
function seeded(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function botFarms(){return FARM_NAMES.slice(0,6).map((n,i)=>({id:'bot'+i,name:n,lvl:6+((i*7+S.lvl)%14)}))}
/* every bot farm is its own place: its own land shape, house style, farm type and arrangement */
const BOT_TYPES=['garden','ranch','orchard','maker','showcase','garden'];
function botLayout(i){
  const r=seeded(1234+i*777);const R=n=>Math.floor(r()*n),pk=a=>a[R(a.length)];
  const type=BOT_TYPES[i%BOT_TYPES.length];
  // land: start blocks plus a seeded spread of neighbouring blocks
  const land=START_BLOCKS.slice();const all=[];for(let x=0;x<4;x++)for(let y=0;y<4;y++)all.push(x+','+y);
  const adj=b=>{const [x,y]=b.split(',').map(Number);return [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>land.includes((x+dx)+','+(y+dy)))};
  for(let k=0,n=1+R(4);k<n;k++){const c=all.filter(b=>!land.includes(b)&&adj(b));if(c.length)land.push(pk(c))}
  const objs=[];const own=(x,y)=>x>=FARM0&&y>=FARM0&&x<FARM1&&y<FARM1&&land.includes(blockOf(x,y));
  const free=(o,x,y)=>{const [w,h]=foot(o);for(let a=0;a<w;a++)for(let b=0;b<h;b++){const X=x+a,Y=y+b;if(!own(X,Y)||(X>=15&&X<=16&&Y>=27))return false;for(const p of objs){const [pw,ph]=foot(p);if(X>=p.x&&X<p.x+pw&&Y>=p.y&&Y<p.y+ph)return false}}return true};
  const put=(o,cx,cy)=>{for(let rr=0;rr<20;rr++)for(let dx=-rr;dx<=rr;dx++)for(let dy=-rr;dy<=rr;dy++){if(Math.max(Math.abs(dx),Math.abs(dy))!==rr)continue;const x=Math.round(cx)+dx,y=Math.round(cy)+dy;if(free(o,x,y)){o.x=x;o.y=y;objs.push(o);return o}}return null};
  // homestead corner differs per farm
  const corners=[[13,12],[23,12],[13,21],[23,20],[18,13],[14,16]];const [hx,hy]=corners[(i*5+R(3))%corners.length];
  put({t:'house'},hx,hy);put({t:'silo'},hx+4,hy+R(2));put({t:'barn'},hx+(r()<.5?-4:7),hy+R(3));
  put({t:'stand'},16,25);put({t:'orders'},13,24);
  const crops=['wheat','corn','carrot','soy','sugarcane','tomato','strawberry','potato','pumpkin','cotton','pepper','okra','watermelon'];
  const mix={garden:[11,1,2,1,6],ranch:[4,4,2,1,5],orchard:[4,1,1,10,5],maker:[6,1,6,2,4],showcase:[4,2,2,3,14]}[type];
  const [nPlots,nPens,nBld,nTrees,nDeco]=mix;
  // fields grouped in a patch, with a favourite crop for this farm
  const fav=crops[R(crops.length)],fx=12+R(12),fy=14+R(10);
  for(let k=0;k<nPlots;k++)put({t:'plot',c:r()<.85?(r()<.6?fav:pk(crops)):null,pt:now()-R(900000)},fx+(k%3)*2,fy+Math.floor(k/3)*2);
  const pens=Object.keys(PENS);for(let k=0;k<nPens;k++)put({t:'pen',k:pens[(i+k*2)%pens.length],a:Array.from({length:3+R(3)},()=>({f:now()-R(200000)}))},20+R(8),15+R(10));
  const blds=Object.keys(BUILDINGS);for(let k=0;k<nBld;k++)put({t:'bld',k:blds[(i*3+k*5)%blds.length],q:[],slots:2},14+R(14),18+R(10));
  const trees=Object.keys(TREES),tk=pk(trees),tx=12+R(14),ty=12+R(14);for(let k=0;k<nTrees;k++)put({t:'tree',k:type==='orchard'&&r()<.7?tk:pk(trees),pt:now()-R(500000),h:0,dead:r()<.08},tx+(k%4)*2,ty+Math.floor(k/4)*2);
  const decos=Object.keys(DECOS).filter(k=>!DECOS[k].ex&&!DECOS[k].g);
  // a garden around the house, then scattered pieces
  for(let k=0;k<nDeco;k++){const d=k<4?pk(['flowers','sunflower','lantern','bench','mailbox','fountain']):pk(decos);put({t:'deco',k:d},k<4?hx+R(5)-1:12+R(18),k<4?hy+3+R(2):12+R(18))}
  if(r()<.6)put({t:'hive',ht:now()-R(400000)},hx+5,hy+4);
  for(let k=0,n=1+R(3);k<n;k++)put({t:pk(['rock','stump','bigtree'])},12+R(18),12+R(18));
  return {name:FARM_NAMES[i],objs,land,hs:i%HOUSE_STYLES.length,feat:{pond:i%3!==1,dock:i%2===0,station:i>2,mine:i>3}};
}
function expandCompact(arr){
  const t=now();return arr.map(([type,x,y,a,b])=>{switch(type){
    case'plot':return{t:'plot',x,y,c:a||null,pt:a?t-ITEMS[a].time*600:0};
    case'pen':return{t:'pen',x,y,k:a,a:Array.from({length:b||1},()=>({f:t}))};
    case'bld':return{t:'bld',x,y,k:a,q:[],slots:2};
    case'tree':return{t:'tree',x,y,k:a,dead:!!b,pt:t-200000,h:0};
    case'deco':return{t:'deco',x,y,k:a};
    default:return{t:type,x,y}}}).filter(o=>o.t!=='pen'||PENS[o.k]).filter(o=>o.t!=='bld'||BUILDINGS[o.k]).filter(o=>o.t!=='tree'||TREES[o.k]).filter(o=>o.t!=='deco'||DECOS[o.k]).map((o,i)=>(o.id=100000+i,o));
}

ACTS.frAdd=async()=>{const el=$('#frCode');const code=(el&&el.value||'').trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code))return toast('Codes are 6 letters and numbers');
  if(code===myCode())return toast('That’s your own code 🙂');S.friends=S.friends||[];
  try{const d=await Net.db.doc('codes/'+code).get();if(!d.exists)return toast('No farm found with that code');const uid=d.data().uid;if(!uid||S.friends.some(f=>f.id===uid))return toast('Already friends!');
    if(S.friends.length>=30)return toast('Friend list is full (30)');S.friends.push({id:uid,code});save();frLoad(uid);sfx.lvl();toast('🤝 Friend added!');rerenderSheet()}catch(e){toast('Couldn’t reach the neighborhood — try again')}};
ACTS.frGift=uid=>{S.giftSent=S.giftSent||{};if(S.giftSent[uid]===dayKey())return;
  // send 3 of a crop you have plenty of (it leaves your silo)
  const opts=Object.keys(S.inv).filter(id=>ITEMS[id]&&ITEMS[id].k==='crop'&&have(id)>=6);if(!opts.length)return toast('Grow a few more crops first — gifts are 3 of a crop you have 6+ of');
  const id=opts.sort((a,b)=>have(b)-have(a))[0];take(id,3);S.giftSent[uid]=dayKey();
  try{Net.db.collection('gifts').add({to:uid,from:(S.name||'A Southside farm').slice(0,24),item:id,qty:3,t:now()}).catch(()=>{})}catch(e){}
  stat('gifts');sfx.coin();toast(`🎁 Sent 3× ${E(id)} — they’ll get it next time they play`);addXP(5);save();rerenderSheet()};

/* ---- gem decor: cosmetic pieces you can only get with gems ---- */
ACTS.buyGemDeco=k=>{const d=DECOS[k];if(!d||!d.g)return;if(S.gems<d.g){toast(`Need <i class="ii ii-gem"></i>${d.g}`);sfx.bad();return}
  const o={t:'deco',k};startPlacing(o,ok=>{if(!ok||S.gems<d.g)return;S.gems-=d.g;o.id=S.nextId++;S.objs.push(o);sfx.build();bump(o);save();updateHUD()})};

/* ---- performance: quality presets, FPS meter, battery saver frame cap ---- */
const GQ={auto:'Auto',high:'High',bal:'Balanced',save:'Battery saver'};
let fpsEl=null,fpsN=0,fpsT=0,lowFps=0,gqWarned=false;
function gq(){return S.gq||'auto'}
function perfTick(tp){fpsN++;if(!fpsT)fpsT=tp;if(tp-fpsT<1000)return;const fps=Math.round(fpsN*1000/(tp-fpsT));fpsN=0;fpsT=tp;R3.fps=fps;
  if(S.fpsMeter){if(!fpsEl){fpsEl=document.createElement('div');fpsEl.id='fpsMeter';document.body.appendChild(fpsEl)}fpsEl.hidden=false;fpsEl.textContent=`${fps} fps · ${R3on?'3D':'2D'} · ${GQ[gq()]}${R3.low?' (reduced)':''}`}else if(fpsEl)fpsEl.hidden=true;
  // Auto: if 3D keeps struggling, drop to reduced 3D; if that still struggles, suggest the classic look once
  if(gq()==='auto'&&R3on&&!document.hidden){if(fps<24)lowFps++;else lowFps=Math.max(0,lowFps-1);
    if(lowFps>=4&&!R3.low){R3.low=true;lowFps=0;toast('⚡ Smoother mode on — lighter shadows for your phone')}
    else if(lowFps>=6&&R3.low&&!gqWarned){gqWarned=true;toast('Tip: Settings ▸ 3D graphics off runs fastest on this phone')}}}
function frameSkip(tp){if(gq()!=='save')return false;if(tp-(frameSkip.last||0)<31)return true;frameSkip.last=tp;return false}
ACTS.cycleGQ=()=>{const k=Object.keys(GQ);S.gq=k[(k.indexOf(gq())+1)%k.length];R3.low=false;lowFps=0;save();rerenderSheet()};
ACTS.toggleFps=()=>{S.fpsMeter=!S.fpsMeter;save();rerenderSheet()};

/* ================= DARE ARCADE ONLINE: the live neighborhood + closed-game alerts =================
   On the arcade site there is no Claude account, so the phone keeps a secret farm key and talks to /api/acres.
   ADB mimics the small slice of the database API the game already uses, so markets, help, chat, likes, friends
   and gifts work the same way as on Claude. Alerts are scheduled on the server and pushed through the arcade's
   service worker, so they arrive with the game fully closed. */
const ARC={on(){return !window.claude&&/^https?:$/.test(location.protocol)&&(/^\/southside-acres/.test(location.pathname)||/^(localhost|127\.)/.test(location.hostname))}};
const ADB={key:null,uid:null,cache:{},
  async call(op,body={},ka){const r=await fetch('/api/acres',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op,key:this.key,...body}),keepalive:!!ka});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()},
  snap(rows){return{size:rows.length,docs:rows.map(d=>({id:d.id,exists:true,data:()=>d}))}},
  one(d){return{exists:!!d,id:d&&d.id,data:()=>d}},
  doc(path){const p=path.split('/'),c=p[0],id=p[1],self=this;
    return{
      async get(){if(c==='codes'){const r=await self.call('lookup',{code:id});return self.one(r.uid?{uid:r.uid}:null)}
        if(c==='farms'){const r=await self.call('getFarm',{id});return self.one(r.farm)}
        if(c==='market'||c==='help'){const r=await self.call(c);const d=(r.items||[]).find(x=>x.id===id);return self.one(d)}
        return self.one(null)},
      async set(d){if(c==='farms')return self.call('farm',{farm:d});if(c==='codes')return self.call('code');if(c==='likes')return self.call('like',{farm:id});return null},
      async update(){return null},
      async delete(){if(c==='market')return self.call('unlist',{id});if(c==='help')return self.call('unask',{id});if(c==='chat')return self.call('unsay',{id});return null},
      async acquire(){return{acquired:true}},
      onSnapshot(){return()=>{}}}},
  collection(path){const self=this;let n=50;
    const q={orderBy(){return q},limit(k){n=k;return q},
      async add(d){if(path==='chat')return{id:(await self.call('say',{txt:d.txt,farm:d.farm})).id};
        if(path==='help')return{id:(await self.call('ask',d)).id};
        if(path==='gifts')return self.call('gift',{to:d.to,item:d.item,qty:d.qty,from:d.from});
        if(path==='market')return{id:(await self.call('list',d)).id};return{}},
      onSnapshot(cb,err){
        const poll=async()=>{if(document.hidden)return;try{
          let rows;if(path==='farms')rows=(await self.call('farms')).farms;
          else if(path==='gifts')rows=(await self.call('gifts')).gifts;
          else if(path.startsWith('likes/')){const r=await self.call('likes');cb({size:r.n,docs:[]});return}
          else rows=(await self.call(path)).items;
          cb(self.snap((rows||[]).slice(0,n)))}catch(e){err&&err(e)}};
        const every={chat:7000,market:15000,help:20000,farms:45000,gifts:60000}[path]||60000;
        poll();const h=setInterval(poll,every);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});return()=>clearInterval(h)}};
    return q}};

async function arcKey(){let k=null;try{k=localStorage.getItem('acres-key')}catch(e){}
  if(!/^[A-Za-z0-9]{32}$/.test(k||'')){const A='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';k=Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>A[b%62]).join('');try{localStorage.setItem('acres-key',k)}catch(e){}}
  const h=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('acres:'+k)));
  return[k,Array.from(h,b=>b.toString(16).padStart(2,'0')).join('').slice(0,16)]}

Net.initArcade=async function(){
  try{const [k,uid]=await arcKey();ADB.key=k;ADB.uid=uid;
    // make sure the neighborhood answers before switching online
    const r=await fetch('/api/acres',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'farms'})});if(!r.ok)return this.offline();
    this.db=ADB;this.uid=uid;this.online=true;this.arcade=true;this.owner=false;
    // atomic first-buyer-wins operations go straight to the server
    this.buy=async l=>{if(!validListing(l))return false;try{return (await ADB.call('buy',{id:l.id})).ok}catch(e){return false}};
    this.claimForBot=async lid=>{if(!lid)return true;try{return (await ADB.call('buy',{id:lid,bot:true})).ok}catch(e){return false}};
    this.fillHelp=async h=>{try{return (await ADB.call('fill',{id:h.id})).ok}catch(e){return false}};
    this.loadCloud=async()=>{};this.flush=async()=>{};this.queueSave=()=>{};
    this.status=()=>'Saved on this phone · live neighborhood on';
    this.subscribe();this.publishFarm(true);try{frInit()}catch(e){}
    $('#netDot').className='on';if(sheetKey)rerenderSheet();
    Alerts.init();
  }catch(e){this.offline()}
};

/* ---------- alerts with the game closed ---------- */
const Alerts={sub:null,
  async init(){if(!this.supported())return;
    document.addEventListener('visibilitychange',()=>{if(document.hidden)this.schedule(true);else this.clear()});
    addEventListener('pagehide',()=>this.schedule(true));
    try{const reg=await navigator.serviceWorker.ready;const s=await reg.pushManager.getSubscription();if(s)this.sub=s.toJSON()}catch(e){}
    if(S.notif&&S.notif.on&&Notification.permission==='granted'&&!this.sub)this.subscribe()},
  supported(){return Net.arcade&&'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window},
  keyBytes(s){const p='='.repeat((4-s.length%4)%4),raw=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(raw,c=>c.charCodeAt(0))},
  async subscribe(){if(!this.supported())return false;
    try{const reg=await navigator.serviceWorker.register('/sw.js').then(()=>navigator.serviceWorker.ready);let s=await reg.pushManager.getSubscription();
      if(!s){const d=await (await fetch('/api/lfg',{cache:'no-store'})).json();if(!d.key)return false;s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:this.keyBytes(d.key)})}
      this.sub=s.toJSON();await ADB.call('alerts',{sub:this.sub,items:[]});return true}catch(e){return false}},
  // the next moment each kind of thing will be ready, as push alerts
  plan(){const t=now(),pref=S.notif||{},out=[];
    const soon=(tag,k,at,body)=>{if(pref[k]===false||!(at>t+30000))return;const ex=out.find(o=>o.tag===tag);if(!ex||at<ex.at){if(ex)out.splice(out.indexOf(ex),1);out.push({tag,at,body})}};
    for(const o of S.objs){
      if(o.t==='plot'&&o.c){const at=o.pt+growTime(o.c);soon('crops','crops',at,`🌾 Your ${ITEMS[o.c].n.toLowerCase()} is ready to harvest!`)}
      else if(o.t==='pen'){const P=PENS[o.k];for(const a of o.a)if(a.f){const at=a.f+P.time*1000*(1-.1*stars('pen_'+P.out));soon('animals','animals',at,`${({chicken:'🐔',cow:'🐄',pig:'🐷',sheep:'🐑',goat:'🐐'})[ANIMAL_KIND[o.k]]||'🐄'} Your animals have ${ITEMS[P.out].n.toLowerCase()} ready to collect!`)}}
      else if(o.t==='bld'){for(const q of o.q){const r=BUILDINGS[o.k].r[q.r];soon('goods','goods',q.end,`${BUILDINGS[o.k].e} ${r?ITEMS[r.out].n:'Your goods'} ${r&&r.q>1?'are':'is'} done at the ${BUILDINGS[o.k].n}!`)}}
      else if(o.t==='tree'&&!o.dead){const T=TREES[o.k];soon('orchard','orchard',o.pt+T.time*1000,`🍎 Your ${T.n.toLowerCase()} is full of ${ITEMS[T.fruit].n.toLowerCase()}!`)}
      else if(o.t==='hive')soon('orchard','orchard',(o.ht||0)+hiveTime(),'🍯 Fresh honey is ready at the beehive!');
    }
    if(S.feat.dock&&S.boat&&S.boat.state==='away')soon('ships','ships',S.boat.t,'⛵ A cargo boat just docked — new crates to fill!');
    if(S.feat.station&&S.train&&S.train.state==='away')soon('train','ships',S.train.t,'🚂 The train is in — load it up!');
    const tm=new Date();tm.setHours(24,0,30,0);if(!dailyReady())soon('daily','daily',+tm+9*3600000,'🎁 Your daily gift is waiting at the farmhouse.');
    return out},
  schedule(ka){if(!Net.arcade||!this.sub||!(S.notif&&S.notif.on))return;try{save()}catch(e){}
    ADB.call('alerts',{sub:this.sub,items:this.plan()},ka).catch(()=>{})},
  clear(){if(!Net.arcade||!this.sub)return;ADB.call('alerts',{items:[]}).catch(()=>{})},
  off(){this.sub=null;if(Net.arcade)ADB.call('noalerts').catch(()=>{})}
};
