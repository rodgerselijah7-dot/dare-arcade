<!DOCTYPE html>
<html lang="en">
<head>

<title>Southside Acres — Dontae Amare</title>
<meta name="description" content="Southside Acres by Dontae Amare. A 3D farming game rooted in Fort Worth: grow crops, raise animals, run a taqueria and a print shop, fill truck orders, and build the farm of your dreams.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--wood:#b8763f;--wood2:#7d4a24;--cream:#fff7e3;--paper:#fdf0cf;--gold:#f6b92b;--ink:#3b2412;--red:#d9483b;--green:#3f9c3a;--gem:#3aa0e6;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.memrow{display:flex;gap:5px;margin-top:3px}.mem{position:relative;width:30px;height:30px;border-radius:9px;background:#efe3c4;display:flex;align-items:center;justify-content:center;font-size:17px;opacity:.55}.mem.on{background:#fff3c4;opacity:1;box-shadow:inset 0 0 0 2px #e9b443}.mem b{position:absolute;right:-4px;top:-5px;background:#d9483b;color:#fff;font-size:9px;border-radius:8px;padding:0 4px}
.frbox{display:flex;align-items:center;justify-content:space-between;background:#fff7e3;border:2px dashed #d9b45a;border-radius:14px;padding:8px 12px;margin-bottom:8px}.frbox .code{font-size:24px;font-weight:700;letter-spacing:4px;color:#7d4a24}
#fpsMeter{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 4px);z-index:60;background:rgba(0,0,0,.6);color:#9fe870;font:600 11px ui-monospace,monospace;padding:3px 8px;border-radius:8px;pointer-events:none}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%;overflow:hidden;font-family:Fredoka,ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:#5f9a3c;overscroll-behavior:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
input{font-family:inherit;font-size:16px;width:100%;padding:7px 10px;border-radius:10px;border:2px solid #e3cf9f;background:#fffdf6;user-select:text;-webkit-user-select:text}
#world{position:fixed;inset:0;touch-action:none;display:block}
/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(var(--st) + 8px) 10px 6px;display:flex;gap:6px;align-items:center;pointer-events:none}
#hud>*{pointer-events:auto}
.pill{background:var(--cream);border:3px solid var(--wood2);border-radius:999px;padding:2px 9px 2px 5px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:4px;box-shadow:0 3px 0 rgba(0,0,0,.2);white-space:nowrap}
.pill .ic{font-size:17px}
#lvlWrap{flex:1;display:flex;align-items:center;gap:0;min-width:0}
#lvlBadge{width:38px;height:38px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe27a,var(--gold) 60%,#c98a12);border:3px solid var(--wood2);display:grid;place-items:center;font-weight:700;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.2);z-index:1}
#xpBar{flex:1;height:16px;margin-left:-8px;border-radius:0 9px 9px 0;background:rgba(0,0,0,.35);border:2px solid var(--wood2);overflow:hidden;position:relative;max-width:150px}
#xpFill{height:100%;width:0;background:linear-gradient(90deg,#7fd3ff,#3aa0e6);transition:width .4s}
#xpTxt{position:absolute;inset:0;font-size:10px;line-height:12px;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 0 #0006}
#farmTitle{position:fixed;top:calc(var(--st) + 50px);left:58px;z-index:19;color:#fff;font-weight:700;font-size:13px;text-shadow:0 1px 2px #0008;pointer-events:none;display:flex;gap:6px;align-items:center}
#netDot{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block}#netDot.on{background:#6dfc5a}#netDot.off{background:#ffb347}
#hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 76px);z-index:19;background:rgba(59,36,18,.88);color:#fff;font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;max-width:92%;text-align:center;pointer-events:none;transition:opacity .3s;box-shadow:0 3px 8px rgba(0,0,0,.25)}
#tutSkip{position:fixed;right:10px;top:calc(var(--st) + 112px);z-index:19;background:rgba(255,255,255,.85);border-radius:999px;font-size:12px;padding:3px 10px;font-weight:600}
/* side buttons */
#side{position:fixed;right:10px;bottom:calc(var(--sb) + 14px);z-index:20;display:flex;flex-direction:column;gap:9px}
#left{position:fixed;left:10px;bottom:calc(var(--sb) + 14px);z-index:20;display:flex;flex-direction:column;gap:9px}
.fab{width:58px;height:58px;border-radius:18px;background:linear-gradient(180deg,#fff7e3,#f1dfae);border:3px solid var(--wood2);box-shadow:0 4px 0 var(--wood2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;position:relative;line-height:1}
.fab .ni{font-size:25px;margin-bottom:2px}
.fab:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood2)}
.fab.on{background:linear-gradient(180deg,#ffe27a,#f6b92b)}
.badge{position:absolute;top:-8px;right:-6px;background:var(--red);color:#fff;font-weight:700;font-size:12px;min-width:21px;height:21px;border-radius:11px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
body.visiting #side,body.visiting #left,body.visiting #hint,body.visiting #tutSkip,body.editing #left{display:none}
/* bars */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 16px);z-index:25;background:var(--ink);color:#fff;border-radius:999px;padding:6px 6px 6px 16px;display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.35);white-space:nowrap;max-width:calc(100% - 150px)}
.bar span{overflow:hidden;text-overflow:ellipsis}
#visitBar,#placeBar{max-width:96%}
/* seed tray */
#tray{position:fixed;left:0;right:0;bottom:calc(var(--sb) + 10px);z-index:24;display:flex;gap:7px;overflow-x:auto;padding:8px 80px 8px 10px;scrollbar-width:none}
#tray::-webkit-scrollbar{display:none}
.seed{flex:none;width:62px;height:76px;border-radius:16px;background:var(--cream);border:3px solid var(--wood2);box-shadow:0 3px 0 var(--wood2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.seed .e{font-size:26px}.seed .c{font-weight:700;font-size:13px}.seed .t{font-size:10px;opacity:.7}
.seed.sel{background:#ffe27a;transform:translateY(-4px)}.seed.lock{opacity:.55}.seed.done{width:46px;background:#f4c6bf;font-size:20px;font-weight:700}
/* popover */
#pop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 16px);z-index:26;background:var(--cream);border:3px solid var(--wood2);border-radius:20px;padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 5px 0 rgba(0,0,0,.2);width:min(94vw,440px)}
#pop .pe{font-size:30px}#pop .pm{flex:1;min-width:0;font-size:14px}#pop .sub{font-size:12px;opacity:.75}
/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:40;background:rgba(30,20,10,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
#sheetWrap.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:560px;max-height:84vh;background:var(--cream);border:4px solid var(--wood2);border-bottom:0;border-radius:24px 24px 0 0;display:flex;flex-direction:column;transform:translateY(30px);transition:transform .22s}
#sheetWrap.on .sheet{transform:none}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;border-bottom:2px dashed #d9bf86}
.sheet h2{margin:0;font-size:20px}
.x{width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;font-size:17px;font-weight:700;box-shadow:0 3px 0 #8f2a21;flex:none}
.x.sm{width:30px;height:30px;font-size:14px}
.sbody{overflow:auto;padding:12px 14px calc(var(--sb) + 18px);-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #e3cf9f;border-radius:14px;padding:8px 10px;margin-bottom:8px}
.row.dim{opacity:.6}
.row .e{font-size:28px;width:36px;text-align:center;flex:none}
.row .m{flex:1;min-width:0}.row .t{font-weight:700;font-size:15px}
.sub{font-size:12.5px;opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chip{font-size:12.5px;background:#f3ead3;border-radius:999px;padding:1px 7px;font-weight:600}
.chip.no{background:#ffd9d4;color:#a3271b}.chip.ok{background:#d8f1cf;color:#21661c}
.btn{background:linear-gradient(180deg,#5cc24f,#3f9c3a);color:#fff;font-weight:700;font-size:14px;border-radius:12px;padding:8px 12px;box-shadow:0 3px 0 #276b23;white-space:nowrap}
.btn:disabled{background:#c9bfa5!important;box-shadow:0 3px 0 #9d9178!important;color:#fff!important}
.btn.gold{background:linear-gradient(180deg,#ffd45a,#f0a81d);box-shadow:0 3px 0 #a86f0b;color:var(--ink)}
.btn.red{background:linear-gradient(180deg,#ec6a5c,#d9483b);box-shadow:0 3px 0 #8f2a21;color:#fff}
.btn.gem{background:linear-gradient(180deg,#7fd3ff,#3aa0e6);box-shadow:0 3px 0 #1f6fa8;color:#fff}
.btn.sm{padding:6px 9px;font-size:12.5px}.btn.big{font-size:20px;padding:12px 30px}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.queue{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.slot{flex:1;min-width:60px;height:64px;border-radius:14px;border:2px dashed #cdb27a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:#fffaf0}
.slot .e{font-size:26px}.slot.done{background:#fff1a8;border:2px solid var(--gold)}
.slot.add{background:#e3f4ff;border:2px dashed var(--gem);color:#1f6fa8;font-size:22px}.slot.add span{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{background:#fff;border:2px solid #e3cf9f;border-radius:12px;padding:6px 2px;text-align:center}
.cell .e{font-size:26px}.cell .n{font-size:10.5px;opacity:.75;line-height:1.1}.cell .c{font-weight:700}
h4{margin:14px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;opacity:.6}
.order{background:#fff;border:3px solid #e3cf9f;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px}
.order.can{border-color:var(--green);background:#f3fbef}
.order .its{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.order .it{background:#f6efdc;border-radius:10px;padding:3px 6px;text-align:center;min-width:44px}
.order .it .e{font-size:22px}.order .it .q{font-size:12px;font-weight:700}
.order .it.no .q{color:var(--red)}.order .it.ok .q{color:var(--green)}
.order .rw{font-weight:700;text-align:center;font-size:13.5px}.order .foot{display:flex;gap:6px}
.wait{text-align:center;opacity:.65;padding:14px;border:3px dashed #e3cf9f;border-radius:16px;font-weight:600;font-size:13.5px}
.crate,.sslot,.ad{background:#fff;border:3px solid #e3cf9f;border-radius:16px;padding:8px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.crate .e,.sslot .e,.ad .e{font-size:30px}.crate .q{font-weight:700}.crate.done{background:#eef9e8;border-color:var(--green)}
.crate .btn{width:100%}
.sslot{min-height:120px;justify-content:center}.sslot.empty{border-style:dashed;font-size:26px;color:#a98a52}.sslot.empty span{font-size:12px}
.sslot.sold{background:#fff1a8;border-color:var(--gold)}
.ad .farm{font-size:10.5px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}.ad .btn{width:100%}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tab{flex:1;min-width:58px;background:#f3ead3;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;font-size:20px;border:2px solid transparent}
.tab span{font-size:11px;font-weight:700}.tab.on{background:#fff;border-color:var(--wood2)}
.cap{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.capbar{flex:1;height:14px;background:#eadfc4;border-radius:8px;overflow:hidden}.capbar i{display:block;height:100%;background:linear-gradient(90deg,#5cc24f,#3f9c3a)}
.capbar.sm{height:6px;margin-top:4px}
.vis{display:flex;gap:12px;align-items:center;margin-bottom:12px}.vis .ve{font-size:52px}.vis .say{background:#fff;border:2px solid #e3cf9f;border-radius:14px;padding:10px;font-size:14.5px;position:relative}
.daily{display:flex;gap:10px;align-items:center;background:linear-gradient(180deg,#fff1a8,#ffe27a);border:3px solid var(--gold);border-radius:16px;padding:10px;margin-bottom:6px}.daily .ve{font-size:36px}.daily .m{flex:1}
.ed{text-align:center;margin-bottom:10px}.ed .ve{font-size:56px}
.stepper{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #e3cf9f;border-radius:14px;padding:8px 10px;margin-bottom:8px}.stepper span{flex:1;font-weight:600}.stepper b{min-width:60px;text-align:center;font-size:17px}
.howto p{text-align:left;font-size:14px;margin:6px 0;line-height:1.35}
#toast{position:fixed;left:50%;top:calc(var(--st) + 160px);transform:translate(-50%,-10px);z-index:60;background:var(--ink);color:#fff;padding:9px 16px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;transition:all .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;z-index:80;background:rgba(30,20,10,.55);display:grid;place-items:center;padding:20px}
#modal .box{background:var(--cream);border:4px solid var(--wood2);border-radius:24px;padding:20px;text-align:center;max-width:360px;width:100%;max-height:86vh;overflow:auto;animation:popin .35s cubic-bezier(.3,1.6,.6,1)}
#modal h2{margin:4px 0 6px;font-size:26px}#modal .star{font-size:56px}
@keyframes popin{from{transform:scale(.6);opacity:0}}
/* mini-games */
#mini{position:fixed;inset:0;z-index:50;background:rgba(20,30,40,.92);display:flex;flex-direction:column;align-items:center;padding:calc(var(--st) + 12px) 12px calc(var(--sb) + 12px);gap:10px;overflow:auto}
#mini header{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;color:#fff}#mini h2{margin:0}
#fishCv{border-radius:18px;border:4px solid var(--wood2)}
.minibar,.minebar{color:#fff;font-weight:600;text-align:center;font-size:15px;display:flex;gap:16px;justify-content:center}
.minibtns{display:flex;gap:10px;align-items:center;justify-content:center}
.minegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(94vw,420px);padding:10px;background:#3b322a;border-radius:18px;border:4px solid #241d17}
.rockc{aspect-ratio:1;border-radius:12px;background:linear-gradient(180deg,#9b8f80,#6f6457);font-size:24px;display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.3)}
.rockc.hard{background:linear-gradient(180deg,#6f6457,#463d34)}.rockc.open{background:#241d17;box-shadow:inset 0 3px 6px rgba(0,0,0,.6);font-size:26px}
.fly{position:fixed;left:0;top:0;z-index:70;font-size:26px;margin:-14px 0 0 -14px;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.pulse{animation:pulse .35s}
@keyframes pulse{40%{transform:scale(1.18)}}
.stars{color:#f0a81d;font-size:11px;letter-spacing:1px;text-shadow:0 1px 0 #7d4a24}
.seed .st{font-size:9px;color:#f0a81d;line-height:1}
.order.express{border-color:var(--gold);background:linear-gradient(180deg,#fff8d6,#fff)}
.xtag{background:var(--gold);color:var(--ink);font-weight:700;font-size:11px;border-radius:999px;padding:2px 8px;align-self:center}
.order .it{border:0;font-family:inherit}
.wb{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;text-align:left}.wb div{background:#fff;border-radius:12px;padding:8px 10px;font-size:14.5px}.wb span{font-size:20px;margin-right:6px}.wb b{margin-right:4px}
.sheet{animation:none}
#hud .pill,#lvlBadge{transition:transform .15s}
.fab.fest{background:linear-gradient(180deg,#ffe9a8,#f6b92b)}
.fest{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#fff1a8,#ffd56e);border:3px solid var(--gold);border-radius:18px;padding:12px;margin-bottom:10px}.fest .fe{font-size:44px}.fest .m{flex:1}.fest .capbar{margin:6px 0 3px;background:#fff7e3}
.ways{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}
.tier .tn{width:24px;height:24px;border-radius:50%;background:#f3ead3;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.row.ex{border-color:var(--gold);background:linear-gradient(90deg,#fffbe8,#fff)}
.seed .sb{font-size:9px;font-weight:700;color:#b8402e;line-height:1}
#btnSettings{width:38px;height:38px;flex:none;border-radius:50%;background:var(--cream);border:3px solid var(--wood2);box-shadow:0 3px 0 rgba(0,0,0,.2);font-size:19px;display:grid;place-items:center;padding:0}
#btnSettings:active{transform:translateY(2px) rotate(40deg);box-shadow:0 1px 0 rgba(0,0,0,.2)}
body.visiting #btnSettings{display:none}
.tgl{width:50px;height:28px;border-radius:14px;background:#d6cbb0;position:relative;flex:none;transition:background .2s;box-shadow:inset 0 2px 3px rgba(0,0,0,.15)}
.tgl i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 3px rgba(0,0,0,.25);transition:left .2s}
.tgl.on{background:var(--green)}.tgl.on i{left:25px}
.slide{display:flex;align-items:center;gap:10px;margin:-4px 0 10px;padding:0 12px 0 56px}.slide input{flex:1;accent-color:var(--green);height:28px}.slide b{width:40px;text-align:right;font-size:13px}
.danger{margin-top:16px;border:2px dashed #e7a39b;background:#fff4f2;border-radius:14px;padding:10px;text-align:center}.danger .t{font-weight:700;color:var(--red)}.danger .btn{margin-top:8px}
.uptag{display:inline-block;color:#f0a81d;font-size:12px;letter-spacing:1px;margin-left:4px}.row.up{border-color:var(--gold);background:linear-gradient(90deg,#fffbe8,#fff)}
.rodbar{display:flex;gap:10px;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-wrap:wrap}
.depths{display:flex;gap:5px;width:min(94vw,440px);overflow-x:auto;scrollbar-width:none}.dep{flex:1;min-width:76px;background:#4a4038;color:#fff;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;border:2px solid transparent}.dep b{font-size:16px}.dep.on{border-color:var(--gold);background:#6d5a40}.dep:disabled{opacity:.45}
.legacy{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,#e3f4ff,#fff);border:2px solid var(--gem);border-radius:14px;padding:8px 12px;margin-bottom:8px}.legacy span{font-weight:700;color:#1f6fa8}
.story{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid var(--gold);border-radius:18px;padding:10px;margin-bottom:10px}.story b{font-size:17px}
.pf{width:42px;height:42px;border-radius:50%;border:2px solid var(--wood2);flex:none;background:#fdf0cf}.pfb{width:72px;height:72px;border-radius:50%;border:3px solid var(--wood2);flex:none;background:#fdf0cf}.pfx{width:96px;height:96px;border-radius:50%;border:4px solid var(--gold)}
.say2{font-size:13.5px;margin-top:4px;line-height:1.3}.love{color:#d9483b;font-weight:700;font-size:13px}
.hearts{font-size:11px;letter-spacing:-1px;margin:2px 0}.hearts span{opacity:.45}
.row.an input.nm{padding:3px 8px;font-size:14px;font-weight:700;border-width:1px;width:auto;max-width:100%}.capbar.hap i{background:linear-gradient(90deg,#ffb347,#f0628b)}
.chip.coat{border:0;display:inline-flex;align-items:center;gap:4px;font-family:inherit;padding:3px 8px}.chip.coat i{width:11px;height:11px;border-radius:50%;background:var(--c);border:1px solid rgba(0,0,0,.25)}.chip.coat:disabled{opacity:.5}
.star{background:none;font-size:22px;width:36px;color:#c9bfa5}.star.on{color:#f0a81d}
.seg{display:flex;background:#f3ead3;border-radius:12px;padding:3px;margin-bottom:10px}.seg button{flex:1;background:none;border-radius:9px;padding:6px;font-weight:700;font-size:13px}.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.row.rank .rk{width:30px;text-align:center;font-weight:700;font-size:16px}.row.rank.me{border-color:var(--green);background:#f3fbef}.row.rank b{font-size:14px}
.chatlog{height:min(46vh,380px);overflow-y:auto;background:#fff;border:2px solid #e3cf9f;border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;user-select:text;-webkit-user-select:text}
.msg{background:#f6efdc;border-radius:12px;padding:6px 10px;max-width:85%;align-self:flex-start;position:relative;font-size:14px}.msg b{display:block;font-size:11px;color:#7d4a24}.msg.mine{align-self:flex-end;background:#dff3d6}
.msg .del{position:absolute;top:2px;right:4px;background:none;font-size:10px;opacity:.5}
.chatin{display:flex;gap:8px;margin-top:8px}
.comm{background:linear-gradient(135deg,#e3f4ff,#fff);border:2px solid var(--gem);border-radius:16px;padding:10px;margin-bottom:8px}.comm .capbar{margin-top:6px}
.rockc{position:relative;background:radial-gradient(circle at 35% 30%,#b9b2a6,#857b6e 60%,#5f564b);border-radius:40% 45% 38% 42%}.rockc.hard{background:radial-gradient(circle at 35% 30%,#7f776d,#4f473e 60%,#332d27)}
.rockc .crack{position:absolute;inset:20%;background:linear-gradient(60deg,transparent 46%,#2b241e 47%,#2b241e 53%,transparent 54%),linear-gradient(-30deg,transparent 46%,#2b241e 47%,#2b241e 52%,transparent 53%)}
@media (min-width:700px){.fab{width:66px;height:66px;font-size:12px}.fab .ni{font-size:28px}#left,#side{gap:12px}#left{left:18px}#side{right:18px}.sheet{max-width:620px;border-radius:24px;margin-bottom:16px;border-bottom:4px solid var(--wood2);max-height:80vh}#sheetWrap{align-items:center}#pop{width:min(70vw,480px)}#hint{font-size:15px}}
@media (max-height:540px) and (orientation:landscape){.fab{width:46px;height:46px;font-size:9px;border-radius:14px}.fab .ni{font-size:19px;margin-bottom:0}#left,#side{gap:6px;bottom:calc(var(--sb) + 8px)}#left{left:calc(env(safe-area-inset-left,0px) + 8px)}#side{right:calc(env(safe-area-inset-right,0px) + 8px)}
  .sheet{max-height:94vh;max-width:640px}#hint{top:calc(var(--st) + 50px);font-size:12.5px;padding:5px 12px}#farmTitle{display:none}#tutSkip{top:calc(var(--st) + 50px)}#toast{top:calc(var(--st) + 90px)}#tray{padding-left:70px}.seed{height:64px;width:56px}
  #mini{flex-direction:row;flex-wrap:wrap;justify-content:center;align-content:flex-start}#mini header{width:100%}#fishCv{max-height:60vh}}
.ii{display:inline-block;width:1.3em;height:1.3em;background-size:contain;background-repeat:no-repeat;background-position:center;vertical-align:-.3em;font-style:normal}
.pill .ic .ii{width:24px;height:24px;vertical-align:middle}
.fly .ii{width:32px;height:32px}
.slot .e .ii,.cell .e .ii,.crate .e .ii,.sslot .e .ii,.ad .e .ii{width:34px;height:34px}
.seed .e .ii{width:32px;height:32px}
/* title */
#title{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 42%,rgba(255,247,227,.92) 0,rgba(255,247,227,.75) 38%,rgba(60,110,35,.35) 75%);padding:24px;transition:opacity .45s}
#title h1{animation:bobT 2.4s ease-in-out infinite}@keyframes bobT{50%{transform:translateY(-6px) rotate(-1deg)}}
#title .ver{margin-top:14px;font-size:12px;opacity:.6;font-weight:600}
#title.gone{opacity:0;pointer-events:none}
#title .in{text-align:center}
#title h1{font-size:50px;line-height:.95;margin:0;color:#fff;-webkit-text-stroke:2px var(--wood2);text-shadow:0 5px 0 var(--wood2)}
#title .tag{font-weight:600;margin:12px 0 22px;color:var(--ink);font-size:17px}
#title .hero{font-size:62px;margin-bottom:12px;letter-spacing:6px}
#title .to-arcade{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:16px;color:#7d4a24;font-weight:700;font-size:13px;letter-spacing:.14em;text-decoration:none;z-index:2;background:rgba(255,247,227,.85);padding:6px 12px;border-radius:14px}</style>
</head>
<body>
<canvas id="world"></canvas>

<div id="hud">
  <div id="lvlWrap"><div id="lvlBadge">1</div><div id="xpBar"><div id="xpFill"></div><div id="xpTxt"></div></div></div>
  <div class="pill" id="coinPill"><span class="ic"><i class="ii ii-coin"></i></span><span id="coins">0</span></div>
  <div class="pill" id="gemPill"><span class="ic"><i class="ii ii-gem"></i></span><span id="gems">0</span></div>
  <button id="btnSettings" aria-label="Settings">⚙️</button>
</div>
<div id="farmTitle"><span id="netDot"></span><span id="farmTitleTxt"></span><span id="wx" title="">☀️</span></div>
<div id="hint"></div>
<button id="tutSkip" hidden>Skip tips</button>

<div id="left">
  <button class="fab" id="btnTown"><span class="ni">🏘️</span>Town<span class="badge" id="townBadge" hidden>!</span></button>
  <button class="fab" id="btnHome"><span class="ni">🏡</span>Home<span class="badge" id="houseBadge" hidden>!</span></button>
  <button class="fab" id="btnOrders"><span class="ni">🚚</span>Orders<span class="badge" id="ordBadge" hidden>0</span></button>
  <button class="fab" id="btnStore"><span class="ni">🏚️</span>Barn<span class="badge" id="storeBadge" hidden>!</span></button>
</div>
<div id="side">
  <button class="fab fest" id="btnFest" hidden><span class="ni">🎪</span>Festival<span class="badge" id="festBadge" hidden>0</span></button>
  <button class="fab" id="btnNb"><span class="ni">👥</span>Friends<span class="badge" id="nbBadge" hidden>0</span></button>
  <button class="fab" id="btnEdit"><span class="ni">✏️</span>Edit</button>
  <button class="fab" id="btnBuild"><span class="ni">🔨</span>Build</button>
</div>

<div id="tray" hidden></div>
<div id="pop" hidden></div>
<div class="bar" id="editBar" hidden><span id="editTxt"></span><button class="btn red sm" id="editStore" hidden>Store</button><button class="btn gold sm" id="editDone">Done</button></div>
<div class="bar" id="placeBar" hidden><span>Drag to place</span><button class="btn red sm" id="placeNo">✕</button><button class="btn sm" id="placeOk">✓ Place</button></div>
<div class="bar" id="visitBar" hidden><span>👀 <b id="visitName"></b></span><button class="btn red sm" data-act="likeFarm">❤️</button><button class="btn gold sm" data-act="visitShop">💰 Shop</button><button class="btn sm" data-act="goHome">🏡 Home</button></div>

<div id="sheetWrap"><div class="sheet"><header><h2 id="sheetTitle"></h2><button class="x" id="sheetX">✕</button></header><div class="sbody" id="sheetBody"></div></div></div>
<div id="mini" hidden><header><h2 id="miniTitle"></h2><button class="x" id="miniX">✕</button></header><div id="miniBody" style="display:flex;flex-direction:column;gap:10px;align-items:center;width:100%"></div></div>
<div id="toast"></div>
<div id="modal" hidden><div class="box" id="modalBox"></div></div>

<div id="title"><a class="to-arcade" href="/">‹ ARCADE</a><div class="in">
  <div class="hero">🚜🌾🐔</div>
  <h1>SOUTHSIDE<br>ACRES</h1>
  <div class="tag">Grow it. Make it. Ship it.</div>
  <button class="btn gold big" id="playBtn">Play</button>
  <div class="ver">Fort Worth grown · v11</div>
</div></div>

/* Background music: laid-back country-soul with verse/chorus, swing and light drums */
let musicTimer=null;
function startMusic(){
  if(!AC||musicTimer)return;
  const N=f=>440*Math.pow(2,(f-69)/12);
  const verse=[[55,59,62],[52,55,59],[48,52,55],[50,54,57]];   // G Em C D
  const chorus=[[48,52,55],[55,59,62],[50,54,57],[55,59,62]];  // C G D G
  const vb=[43,40,36,38],cb=[36,43,38,43];
  const scale=[67,69,71,74,76,79,81,83];
  const motif=()=>{const m=[];for(let i=0;i<32;i++)m.push(Math.random()<.5?pick(scale):0);return m};
  let mv=motif(),mc=motif();
  let step=0,next=AC.currentTime+.1;const bpm=96,spb=60/bpm/2;
  const play=(f,d,type,v,at)=>tone(f,d,type,v,Math.max(0,at-AC.currentTime),1,musicGain);
  const drum=(at,kind)=>{try{
    if(kind==='k'){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(120,at);o.frequency.exponentialRampToValueAtTime(40,at+.12);g.gain.setValueAtTime(.35,at);g.gain.exponentialRampToValueAtTime(.001,at+.15);o.connect(g).connect(musicGain);o.start(at);o.stop(at+.16)}
    else{const len=Math.floor(AC.sampleRate*(kind==='s'?.12:.03)),buf=AC.createBuffer(1,len,AC.sampleRate),c=buf.getChannelData(0);for(let i=0;i<len;i++)c[i]=(Math.random()*2-1)*(1-i/len);
      const src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();src.buffer=buf;f.type=kind==='s'?'bandpass':'highpass';f.frequency.value=kind==='s'?1800:7000;g.gain.value=kind==='s'?.12:.05;src.connect(f).connect(g).connect(musicGain);src.start(at)}}catch(e){}};
  const sched=()=>{
    while(next<AC.currentTime+.45){
      const bar=Math.floor(step/8),b=step%8,sec=Math.floor(bar/8)%2,ch=sec?chorus:verse,bs=sec?cb:vb,ci=bar%4;
      const swing=(b%2===1)?spb*.18:0,at=next+swing;
      if(b===0||b===4)play(N(bs[ci]),.34,'triangle',.24,at);
      if(b===6)play(N(bs[ci]+7),.18,'triangle',.16,at);
      if(b===2||b===6)ch[ci].forEach(n=>play(N(n),.13,'square',.03,at));
      if(b===0||b===4)drum(at,'k');if(b===2||b===6)drum(at,'s');drum(at,'h');
      const m=(sec?mc:mv)[step%32];if(m&&(b%2===0||Math.random()<.3))play(N(m),.24,'triangle',.075,at);
      next+=spb;step++;
      if(step%128===0){if(Math.random()<.5)mv=motif();else mc=motif()}
    }
  };
  musicTimer=setInterval(sched,120);sched();
  // ambience: birds by day, crickets at night
  setInterval(()=>{if(!S.sfx||S.ambient===false||document.hidden)return;const n=typeof nightLevel==='function'?nightLevel():0;
    if(n>.6){for(let i=0;i<6;i++)tone(4200,.015,'square',.008,i*.05,1)}
    else if(Math.random()<.5){const f=2200+rnd(1200);for(let i=0;i<2+rnd(3);i++)tone(f+rnd(300),.06,'sine',.018,i*.11,1.35)}},3500);
}

/* ===== depth sorting =====
   Iso boxes that don't overlap on the ground: A is in front of B when A starts past B's far edge on x OR on y.
   Only pairs whose screen rectangles overlap get constrained, then a topological sort (fallback: x+y key). */

function dItem(x0,y0,x1,y1,hgt,f,o){const a=iso(x0,y0),b=iso(x1,y0),c=iso(x0,y1),d=iso(x1,y1);
  return{x0,y0,x1,y1,f,o,k:(x0+x1+y0+y1)/2,sl:c[0],sr:b[0],st:a[1]-hgt,sb:d[1]}}
function inFront(A,B){const e=.001;const ax=A.x0>=B.x1-e,ay=A.y0>=B.y1-e,bx=B.x0>=A.x1-e,by=B.y0>=A.y1-e;
  const af=ax||ay,bf=bx||by;if(af&&!bf)return 1;if(bf&&!af)return-1;return A.k>B.k?1:A.k<B.k?-1:0}
function depthSort(L){
  const n=L.length;L.sort((a,b)=>a.k-b.k);
  const indeg=new Int16Array(n),adj=Array.from({length:n},()=>[]);
  for(let i=0;i<n;i++){const A=L[i];for(let j=i+1;j<n;j++){const B=L[j];
    if(A.sr<=B.sl||B.sr<=A.sl||A.sb<=B.st||B.sb<=A.st)continue;
    const r=inFront(A,B);if(r>0){adj[j].push(i);indeg[i]++}else if(r<0){adj[i].push(j);indeg[j]++}}}
  const out=[],done=new Uint8Array(n);let start=0;
  while(out.length<n){let pick=-1;for(let i=start;i<n;i++)if(!done[i]&&indeg[i]===0){pick=i;break}
    if(pick<0){for(let i=start;i<n;i++)if(!done[i]){pick=i;break}}
    done[pick]=1;out.push(L[pick]);for(const j of adj[pick])indeg[j]--;while(start<n&&done[start])start++}
  return out;
}

  const pk=r3PlotKey();if(pk!==R3.plotKey){R3.plotKey=pk;r3BuildPlots()}
  r3UpdateCrops(t);r3SyncObjs(t,dt);
  // camera matches the 2D iso projection exactly
  const [gx,gy]=unIso(cam.x,cam.y),z=cam.z,hw=VW/2/(PXU*z),hh=VH/2/(PXU*z),el=Math.PI/6,D=150,cd=Math.cos(el)/Math.SQRT2;
  const C=R3.cam;C.left=-hw;C.right=hw;C.top=hh;C.bottom=-hh;C.position.set(gx+D*cd,D*Math.sin(el),gy+D*cd);C.lookAt(gx,0,gy);C.updateProjectionMatrix();

  sun.intensity=1.75*(1-n*.75)*(rain?.45:1);RM.glass.color.set(n>.05?'#ffd27a':'#bcd9ec').lerp(new T.Color('#bcd9ec'),Math.max(0,1-n*2));sun.color.set(n>.15&&n<.8?'#ffd2a0':'#fff3dc');R3.hemi.intensity=1.7*(1-n*.5);
  R3.hemi.color.set(n>.5?'#9fb3e8':rain?'#c9d3dc':'#eaf4ff');
  const R=Math.min(44,Math.max(hw,hh*2)*1.08);sun.position.set(gx-1,26,gy+15);sun.target.position.set(gx,0,gy);
  const sc=sun.shadow.camera;sc.left=-R;sc.right=R;sc.top=R;sc.bottom=-R;sc.near=1;sc.far=90;sc.updateProjectionMatrix();
  const ms=Q==='high'?2048:liteFx||Q==='bal'?1024:(/iPhone|iPad|Android/i.test(navigator.userAgent)?1536:2048);if(sun.shadow.mapSize.x!==ms){sun.shadow.mapSize.set(ms,ms);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}}
  const shOn=S.hq!==false&&Q!=='save'&&!(Q==='auto'&&R3.low);sun.castShadow=shOn;
  if(R3.wtex)R3.wtex.offset.y=(t/24000)%1;
  R3.c.style.display='block';
  R3.r.render(R3.sc,C);
}

/* ================= 3D MODELS — buildings, trees, decorations, animals, people, vehicles, features =================
   Every model is assembled from simple low-poly parts and merged into ONE vertex-coloured mesh (one draw call),
   plus an optional "glass" mesh whose colour switches to warm light at night, plus a few animated sub-parts. */
const PX=1/39.2; // 2D art pixels → world units (keeps 3D heights matching the old art, so taps & bubbles line up)
const RM={geo:null,mat:null,glass:null,cache:new Map(),tex:new Map()};
function rmInit(){if(RM.geo)return;const T=R3.T;
  const base=(g,h=.5)=>{g.translate(0,h,0);return g};
  const prism=new T.BufferGeometry(); // gable roof: ridge along x at y=1, eaves at z=±.5
  const v=[[-.5,0,-.5],[.5,0,-.5],[.5,1,0],[-.5,1,0],[-.5,0,.5],[.5,0,.5]];const f=[[0,3,2],[0,2,1],[4,5,2],[4,2,3],[0,4,3],[1,2,5],[0,1,5],[0,5,4]];
  const pa=[];for(const tri of f)for(const i of tri)pa.push(...v[i]);prism.setAttribute('position',new T.Float32BufferAttribute(pa,3));prism.computeVertexNormals();
  RM.geo={box:base(new T.BoxGeometry(1,1,1)),cyl:base(new T.CylinderGeometry(.5,.5,1,10)),cyl6:base(new T.CylinderGeometry(.5,.5,1,6)),cyl16:base(new T.CylinderGeometry(.5,.5,1,18)),
    cone:base(new T.ConeGeometry(.5,1,8)),cone4:base(new T.ConeGeometry(.5,1,4)),sph:new T.IcosahedronGeometry(.5,1),sph2:new T.IcosahedronGeometry(.5,2),
    dome:new T.SphereGeometry(.5,14,7,0,Math.PI*2,0,Math.PI/2),dode:base(new T.DodecahedronGeometry(.5,0)),prism,torus:new T.TorusGeometry(.5,.12,6,14),
    wheel:(()=>{const g=new T.CylinderGeometry(.5,.5,1,12);g.rotateX(Math.PI/2);return g})()};
  RM.mat=new T.MeshLambertMaterial({vertexColors:true});
  RM.glass=new T.MeshBasicMaterial({vertexColors:true,color:'#bcd9ec'});
}
/* ---- model builder ---- */
class MB{
  constructor(){this.parts=[];this.glass=[];this.subs={};this.planes=[];this.fx={smoke:[],glow:[]}}
  put(geo,x,y,z,sx,sy,sz,col,o={}){const T=R3.T;const m=new T.Matrix4().compose(new T.Vector3(x,y,z),new T.Quaternion().setFromEuler(new T.Euler(o.rx||0,o.ry||0,o.rz||0)),new T.Vector3(sx,sy,sz));
    (o.glass?this.glass:this.parts).push([RM.geo[geo],m,col]);return this}
  box(x,y,z,w,h,d,col,o){return this.put('box',x,y,z,w,h,d,col,o)}
  cyl(x,y,z,r,h,col,o={}){return this.put(o.seg||'cyl',x,y,z,r*2,h,(o.rz2||r)*2,col,o)}
  cone(x,y,z,r,h,col,o={}){return this.put(o.seg||'cone',x,y,z,r*2,h,r*2,col,o)}
  sph(x,y,z,rx,ry,rz,col,o={}){return this.put(o.hi?'sph2':'sph',x,y,z,rx*2,ry*2,rz*2,col,o)}
  roof(x,y,z,l,w,h,col,o){return this.put('prism',x,y,z,l,h,w,col,o)} // ridge along x (use ry:π/2 for along z)
  win(x,y,z,w,h,face,col){// a window on a wall face: 'z' (front-left) or 'x' (front-right)
    if(face==='z'){this.box(x,y-.04,z+.005,w+.08,h+.08,.04,'#fff7e3');this.box(x,y,z+.02,w,h,.04,'#ffffff',{glass:true});this.box(x,y+h/2-.01,z+.03,w,.03,.04,'#fff7e3')}
    else{this.box(x+.005,y-.04,z,.04,h+.08,w+.08,'#fff7e3');this.box(x+.02,y,z,.04,h,w,'#ffffff',{glass:true});this.box(x+.03,y+h/2-.01,z,.04,.03,w,'#fff7e3')}return this}
  sub(name,x,y,z){const s=new MB();s.pivot=[x,y,z];this.subs[name]=s;return s}
  plane(x,y,z,w,h,tex,o={}){this.planes.push({x,y,z,w,h,tex,ry:o.ry||0});return this}
  smoke(x,y,z){this.fx.smoke.push([x,y,z]);return this}
  glow(x,y,z,r){this.fx.glow.push([x,y,z,r]);return this}
}
function mbMerge(list){if(!list.length)return null;const T=R3.T;let n=0;const gs=list.map(([g,m,c])=>{const q=(g.index?g.toNonIndexed():g.clone()).applyMatrix4(m);n+=q.attributes.position.count;return[q,c]});
  const P=new Float32Array(n*3),N=new Float32Array(n*3),C=new Float32Array(n*3);let o=0;const col=new T.Color();
  for(const [q,c] of gs){const p=q.attributes.position.array,nn=q.attributes.normal.array;P.set(p,o*3);N.set(nn,o*3);col.set(c);const k=p.length/3;for(let i=0;i<k;i++){C[(o+i)*3]=col.r;C[(o+i)*3+1]=col.g;C[(o+i)*3+2]=col.b}o+=k;q.dispose()}
  const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(P,3));g.setAttribute('normal',new T.BufferAttribute(N,3));g.setAttribute('color',new T.BufferAttribute(C,3));g.computeBoundingSphere();return g}
function mbCompile(mb){const out={geo:mbMerge(mb.parts),glass:mbMerge(mb.glass),subs:{},planes:mb.planes,fx:mb.fx};for(const [k,s] of Object.entries(mb.subs))out.subs[k]={c:mbCompile(s),pivot:s.pivot};return out}
function mbInstance(c,shadow=true){const T=R3.T,g=new T.Group();
  if(c.geo){const m=new T.Mesh(c.geo,RM.mat);m.castShadow=shadow;m.receiveShadow=true;g.add(m)}
  if(c.glass){const m=new T.Mesh(c.glass,RM.glass);g.add(m)}
  for(const p of c.planes){const m=new T.Mesh(new T.PlaneGeometry(p.w,p.h),new T.MeshLambertMaterial({map:rmTex(p.tex),side:T.DoubleSide,transparent:true}));m.position.set(p.x,p.y,p.z);m.rotation.y=p.ry;g.add(m)}
  g.userData.subs={};for(const [k,s] of Object.entries(c.subs)){const sg=mbInstance(s.c,shadow&&!/^(leg|arm|head)/.test(k));sg.position.set(...s.pivot);g.add(sg);g.userData.subs[k]=sg}
  g.userData.fx=c.fx;return g}
function rmModel(key,build){let c=RM.cache.get(key);if(!c){const mb=new MB();build(mb);c=mbCompile(mb);RM.cache.set(key,c)}return c}

function rmTex(k){let t=RM.tex.get(k);if(t)return t;const c=document.createElement('canvas'),g=c.getContext('2d');c.width=256;c.height=128;
  const txt=(s,col,f=46)=>{g.fillStyle=col;g.font=`700 ${f}px Fredoka,sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(s,128,66)};
  if(k==='mural'){const cols=['#d9483b','#f6b92b','#3d74c2','#58a85b','#8a4fb5'];g.fillStyle='#e8dcc8';g.fillRect(0,0,256,128);cols.forEach((cc,i)=>{g.fillStyle=cc;g.beginPath();g.arc(30+i*48,90,40,Math.PI,0);g.fill()});g.lineWidth=8;g.strokeStyle='#3b2412';g.font='700 40px Fredoka,sans-serif';g.textAlign='center';g.strokeText('SOUTHSIDE',128,44);txt('SOUTHSIDE','#fff',40)}
  else if(k==='arch'){g.fillStyle='#fff7e3';g.fillRect(0,0,256,128);g.strokeStyle='#7d4a24';g.lineWidth=10;g.strokeRect(5,5,246,118);txt('HARVEST FEST','#b8402e',36)}
  else if(k==='magnolia'){c.height=48;g.fillStyle='#2f7a4a';g.fillRect(0,0,256,48);g.fillStyle='#fff';g.font='700 30px Fredoka,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('MAGNOLIA AVE',128,26)}
  else if(k.startsWith('mem:')){c.width=c.height=96;const M=MEM_ALL[k.slice(4)];g.fillStyle='#fff7e3';g.fillRect(0,0,96,96);g.strokeStyle='#c99a2a';g.lineWidth=8;g.strokeRect(4,4,88,88);g.font='54px '+EFONT;g.textAlign='center';g.textBaseline='middle';g.fillText(M?M.e:'⭐',48,52)}
  else if(k==='tower'){g.fillStyle='#c9d2d8';g.fillRect(0,0,256,128);txt('SOUTHSIDE','#b8402e',44)}
  else if(k.startsWith('icon:')){c.width=c.height=128;const id=k.slice(5);g.fillStyle='#fff7e3';g.beginPath();g.arc(64,64,60,0,7);g.fill();g.lineWidth=8;g.strokeStyle='#7d4a24';g.stroke();
    try{const ic=ICO.has(id)&&ICO.canvasFor(id);if(ic)g.drawImage(ic,20,20,88,88);else{g.font='70px '+EFONT;g.textAlign='center';g.textBaseline='middle';g.fillText(id,64,70)}}catch(e){}}
  t=new R3.T.CanvasTexture(c);t.colorSpace=R3.T.SRGBColorSpace;RM.tex.set(k,t);return t}

  if(K==='tall'){m.box(0,H*.48,0,W+.04,.06,D+.04,st.trim)}

    for(let i=0;i<5;i++)m.box(-W/2+.25+i*.55,H-.06,D/2+.01,.18,.06,.03,'#f6b92b')}
  if(K==='cottage'){m.cyl(-.2,H+G*.35,D/2+.12,.16,.04,st.trim,{rx:Math.PI/2});m.cyl(-.2,H+G*.35,D/2+.15,.12,.04,'#ffffff',{rx:Math.PI/2,glass:true})}
  const cx=K==='ranch'?.8:-.5;m.box(cx,H-.2,-.7,.32,1.1+(K==='tall'?.2:0),.32,K==='ranch'?'#6b5a4a':'#8a3b2c');m.box(cx,H+.86+(K==='tall'?.2:0),-.7,.4,.1,.4,'#5a2a20');m.smoke(cx,H+.98+(K==='tall'?.2:0),-.7);

    if(K==='porch'||K==='cottage')for(const [x,z] of [[-.7,D/2],[.85,D/2]]){m.box(x-.27,y-.04,z+.03,.08,.44,.03,st.roof);m.box(x+.27,y-.04,z+.03,.08,.44,.03,st.roof)}

    for(const x of[-pw/2+.06,pw/2-.06,0].slice(0,K==='tall'?3:2))if(x!==0||K==='tall')m.box(x,0,D/2+.68,.08,.9,.08,st.trim);m.box(0,.45,D/2+.69,pw,.05,.04,st.trim)}

function r3SyncObjs(t,dt){
  r3FrameNo++;r3FxList.length=0;const win=WIN()?'w':'';
  for(const o of S.objs){if(o.t==='plot')continue;const [w,h]=foot(o);let key,make,anim=null;
    switch(o.t){
      case 'house':{const hs=curHS();key='house'+hs+win;make=()=>rmModel(key,m=>mHouse(m,HOUSE_STYLES[hs]));break}
      case 'barn':{const hs=curHS();key='barn'+hs+win;make=()=>rmModel(key,m=>mBarn(m,HOUSE_STYLES[hs]));break}
      case 'silo':key='silo'+win;make=()=>rmModel(key,mSilo);break;
      case 'orders':key='orders';make=()=>rmModel(key,mOrders);break;
      case 'stand':key='stand';make=()=>rmModel(key,mStand);break;
      case 'paper':key='paper';make=()=>rmModel(key,mPaper);break;
      case 'bld':{key='bld:'+o.k+win;make=()=>rmModel(key,m=>mBld(m,o.k));const {cur}=bldState(o);anim=g=>{const s=g.userData.subs,sp=cur?t/220:t/1400;
        if(s.blades)s.blades.rotation.x=sp%(Math.PI*2);if(s.press)s.press.position.y=.85-(cur?Math.abs(Math.sin(t/260))*.3:0);if(s.shuttle)s.shuttle.position.z=w/2-.2-.65+(cur?Math.sin(t/180)*.22:0)};o._cur=!!cur;break}
      case 'pen':key='pen:'+o.k+win;make=()=>rmModel(key,m=>mPen(m,o.k));break;
      case 'tree':{const st=treeState(o);const n=st.s==='ready'?'r':st.s==='dead'?'d':Math.floor((st.prog||0)*5);const sk=SEASON+(SEASON==='autumn'?o.id%4:'');key='tree:'+o.k+n+sk;make=()=>rmModel(key,m=>mTree(m,o.k,st,o.id));
        anim=g=>{const c=g.userData.subs.canopy;if(c){c.rotation.z=Math.sin(t/900+o.id)*.03;c.rotation.x=Math.cos(t/1100+o.id)*.02}};break}
      case 'deco':{key='deco:'+o.k+win;make=()=>rmModel(key,m=>mDeco(m,o.k));anim=g=>{const s=g.userData.subs;if(s.fan)s.fan.rotation.x=t/400};break}
      case 'hive':key='hive';make=()=>rmModel(key,mHive);break;
      case 'rock':key='rock';make=()=>rmModel(key,m=>mRock(m,1.5));break;

ACTS.skipPlot=id=>{const o=objById(+id);if(!o||!o.c)return hidePop();const left=o.pt+growTime(o.c)-now();const c=gemCost(left);if(S.gems<c){toast('Not enough <i class="ii ii-gem"></i>');sfx.bad();return}S.gems-=c;o.pt=now()-growTime(o.c);hidePop();sfx.clink();save()};

ACTS.endplant=()=>endPlant();
function endPlant(){plantMode=null;$('#tray').hidden=true}
function plantPlot(o){

function harvestPlot(o){
  const id=o.c;const n=isSeasonal(id)?3:2;
  if(spaceFor(id)<n){fullMsg(id);return false}
  add(id,n);addXP(ITEMS[id].xp);o.c=null;o.pt=0;sfx.pop();stat('harvest',2);memDrop(o.x+1,o.y+1,.008);comboHit(o.x+1,o.y+1);addMastery(id);
  worldFx(o.x+1,o.y+1,`+${n}${II(id)}`);burst(o.x+1,o.y+1,['#ffe56b','#9ad65a','#f6b92b'],8);flyTo(o.x+1,o.y+1,II(id),'#btnStore');buzz(8);

function maybeDrop(gx,gy,p){p*=luck()*(1+.2*perk('luck'));

  if(Math.random()<p/6){S.gems++;setTimeout(()=>worldFx(gx,gy-1,'+1<i class="ii ii-gem"></i>','#9fe8ff'),450)}
}

  add(T.fruit,2);addXP(T.xp);o.h=(o.h||0)+1;sfx.pop();stat('fruit',2);memDrop(o.x+1,o.y+1,.02);comboHit(o.x+1,o.y+1);flyTo(o.x+1,o.y+1,E(T.fruit),'#btnStore');burst(o.x+1,o.y+.8,['#9ad65a','#5aa04a'],8);

}

ACTS.skipTree=id=>{const o=objById(+id);if(!o)return;const T=TREES[o.k];const c=gemCost(o.pt+T.time*1000-now());if(S.gems<c){toast('Not enough <i class="ii ii-gem"></i>');return}S.gems-=c;o.pt=now()-T.time*1000;hidePop();sfx.clink();save()};

/* ================= PENS ================= */
function tapPen(o){
  const p=PENS[o.k];let ready=o.a.filter(a=>animalState(p,a).s==='ready');
  if(ready.length){
    let n=0,bonus=0;for(const a of ready){if(spaceFor(p.out)<1)break;a.f=0;n++;if(hp(a)>=80&&Math.random()<.25)bonus++}
    if(!n){fullMsg(p.out);return}
    bonus=Math.min(bonus,Math.max(0,spaceFor(p.out)-n));if(bonus){setTimeout(()=>worldFx(o.x+2,o.y+1.2,`😊 Happy bonus +${bonus}`,'#ffd56e'),300)}
    add(p.out,n+bonus);addXP(p.xp*n);worldFx(o.x+2,o.y+2,`+${n}${E(p.out)}`);sfx.pop();stat('collected',n);addMastery('pen_'+p.out,n);flyTo(o.x+2,o.y+2,E(p.out),'#btnStore');burst(o.x+2,o.y+2,['#fff','#ffe56b'],8);maybeDrop(o.x+2,o.y+2,.02*n);
    luckyFind(o.x+2,o.y+2,o.k==='coop'?'egg':'find');
    if(n<ready.length)fullMsg(p.out);save();return;
  }
  const hungry=o.a.filter(a=>!a.f);
  if(hungry.length&&have(p.feed)){
    let n=0;for(const a of hungry){if(have(p.feed)<1)break;take(p.feed,1);a.f=now();a.hp=Math.min(100,hp(a)+4);n++}
    worldFx(o.x+2,o.y+2,`Fed ${n}${p.a}`);sfx[ANIMAL_SFX[o.k]]();stat('fed',n);save();return;
  }
  if(hungry.length&&!have(p.feed)){openPen(o);return}
  petPen(o);
}
function openPen(o){
  const p=PENS[o.k];
  openSheet(`${p.a} ${p.n}`,()=>{
    const t=now();let next=Infinity;o.a.forEach(a=>{if(a.f)next=Math.min(next,a.f+penTime(o.k))});
    const hungry=o.a.filter(a=>!a.f).length;
    return `<div class="row"><div class="e">${E(p.feed)}</div><div class="m"><div class="t">${ITEMS[p.feed].n}: ${have(p.feed)}</div><div class="sub">${hungry} hungry · each makes ${E(p.out)} in ${fmt(penTime(o.k))} ${starStr(stars('pen_'+p.out))}</div></div>
      ${hungry&&!have(p.feed)?`<button class="btn sm" data-act="gotoMill">Make feed</button>`:''}</div>
      ${next<Infinity&&next>t?`<div class="row"><div class="e">⏳</div><div class="m"><div class="t">Next ${E(p.out)} in <span data-end="${next}" data-refresh>${fmt(next-t)}</span></div></div><button class="btn gem sm" data-act="skipPen:${o.id}">⚡ <i class="ii ii-gem"></i>${gemCost(next-t)}</button></div>`:''}
      <div class="row"><div class="e">${p.a}</div><div class="m"><div class="t">${o.a.length} / ${MAX_ANIMALS} animals</div><div class="sub">More animals, more ${ITEMS[p.out].n.toLowerCase()}</div></div>
      ${o.a.length<MAX_ANIMALS?`<button class="btn gold sm" data-act="buyAnimal:${o.id}" ${S.coins<p.acost*o.a.length?'disabled':''}>+${p.a} <i class="ii ii-coin"></i>${p.acost*o.a.length}</button>`:'<span class="sub">Full</span>'}</div>`+careHTML(o);
  });
}
ACTS.gotoMill=()=>{const m=objsOf('bld','feedmill')[0];if(m){closeSheet();openBld(m)}};
ACTS.skipPen=id=>{const o=objById(+id);const p=PENS[o.k];let c=0;o.a.forEach(a=>{if(a.f&&animalState(p,a).s==='busy')c+=gemCost(a.f+penTime(o.k)-now())});c=Math.max(1,Math.ceil(c/2));if(S.gems<c){toast(`Need <i class="ii ii-gem"></i>${c}`);return}S.gems-=c;o.a.forEach(a=>{if(a.f)a.f=now()-penTime(o.k)});sfx.clink();save();rerenderSheet()};
ACTS.buyAnimal=id=>{const o=objById(+id);const p=PENS[o.k];const c=p.acost*o.a.length;if(o.a.length>=MAX_ANIMALS)return;if(S.coins<c){toast(`Need <i class="ii ii-coin"></i>${c}`);sfx.bad();return}S.coins-=c;o.a.push({f:0});addXP(2);sfx[ANIMAL_SFX[o.k]]();save();rerenderSheet()};

/* ================= BUILDINGS ================= */
function tapBld(o){if(bldState(o).done){collectBld(o);return}openBld(o)}
function collectBld(o){
  const b=BUILDINGS[o.k];const got=[];
  while(o.q.length&&now()>=o.q[0].end){const r=b.r[o.q[0].r];if(spaceFor(r.out)<r.q){fullMsg(r.out);break}add(r.out,r.q);addXP(r.xp);memDrop(o.x+1.5,o.y+1.5,.015);got.push(`+${r.q}${E(r.out)}`);if(Math.random()<doubleChance(o)&&spaceFor(r.out)>=r.q){add(r.out,r.q);got.push(`×2!`);stat('doubles')}o.q.shift();stat('made',r.q);addMastery('b_'+r.out);flyTo(o.x+1.5,o.y+1.5,E(r.out),'#btnStore')}
  if(got.length){worldFx(o.x+1.5,o.y+1.5,got.join(' '));sfx.pop();maybeDrop(o.x+1.5,o.y+1.5,.015*got.length)}
  save();rerenderSheet();
}
function openBld(o){
  const b=BUILDINGS[o.k];
  openSheet(`${b.e} ${b.n}`,()=>{
    const t=now();const slots=[];
    for(let k=0;k<o.slots;k++){const j=o.q[k];
      if(!j)slots.push(`<div class="slot">empty</div>`);
      else{const r=b.r[j.r];slots.push(t>=j.end?`<div class="slot done"><span class="e">${E(r.out)}</span>ready</div>`:`<div class="slot"><span class="e">${E(r.out)}</span><span data-end="${j.end}" data-refresh>${fmt(j.end-t)}</span></div>`)}}
    const cost=slotGemCost(o);
    if(o.slots<6)slots.push(`<button class="slot add" data-act="addSlot:${o.id}">＋<span><i class="ii ii-gem"></i>${cost}</span></button>`);
    const anyDone=o.q.some(j=>t>=j.end),cur=o.q.find(j=>t<j.end);
    return `<div class="queue">${slots.join('')}</div>
      <div style="display:flex;gap:8px;margin-bottom:10px">${anyDone?`<button class="btn gold" style="flex:1" data-act="collectBld:${o.id}">Collect</button>`:''}
      ${cur?`<button class="btn gem" style="flex:1" data-act="skipBld:${o.id}">⚡ Finish next <i class="ii ii-gem"></i>${gemCost(cur.end-t)}</button>`:''}</div>
      ${upgradeHTML(o)}<h4>Recipes</h4>`+b.r.map((r,k)=>{
        const it=ITEMS[r.out];
        if(r.lvl>S.lvl)return `<div class="row dim"><div class="e">🔒</div><div class="m"><div class="t">${it.n}</div><div class="sub">Unlocks at Lv ${r.lvl}</div></div></div>`;
        const ok=hasAll(r.in)&&o.q.length<o.slots;
        return `<div class="row"><div class="e">${II(r.out)}</div><div class="m"><div class="t">${it.n}${r.q>1?' ×'+r.q:''} <span class="sub">⏱${fmt(jobTime(o,r))} · ⭐${r.xp} <span class="stars">${starStr(stars('b_'+r.out))}</span></span></div><div class="chips">${chipsFor(r.in)}</div></div>
          <button class="btn" data-act="make:${o.id}:${k}" ${ok?'':'disabled'}>Make</button></div>`;
      }).join('');
  });
}
const slotGemCost=o=>[0,0,0,8,16,30,50][o.slots+1]||50;
ACTS.addSlot=id=>{const o=objById(+id);const c=slotGemCost(o);if(S.gems<c){toast(`Need <i class="ii ii-gem"></i>${c}`);sfx.bad();return}S.gems-=c;o.slots++;sfx.build();save();rerenderSheet()};
ACTS.collectBld=id=>collectBld(objById(+id));
ACTS.skipBld=id=>{const o=objById(+id);const t=now();const cur=o.q.find(j=>t<j.end);if(!cur)return;const c=gemCost(cur.end-t);if(S.gems<c){toast(`Need <i class="ii ii-gem"></i>${c}`);return}S.gems-=c;const shift=cur.end-t;o.q.forEach(j=>{if(j.end>=cur.end)j.end-=shift});sfx.clink();save();rerenderSheet()};
ACTS.make=(id,k)=>{
  const o=objById(+id),b=BUILDINGS[o.k],r=b.r[+k];
  if(o.q.length>=o.slots||!hasAll(r.in)){sfx.bad();return}
  for(const [i,q] of Object.entries(r.in))take(i,q);
  const last=o.q.length?o.q[o.q.length-1].end:0;
  o.q.push({r:+k,end:Math.max(now(),last)+jobTime(o,r)});stat('queued');
  sfx.plant();save();rerenderSheet();
};

/* ================= STORAGE ================= */
function storageNeeds(kind){const cap=kind==='silo'?S.silo:S.barn;const lv=(cap-50)/25;const n=Math.min(1+Math.floor(lv),15);
  const tools=kind==='silo'?['nail','screw','panel']:['bolt','plank','tape'];const req={};tools.forEach(t=>req[t]=n);return req}
function openStorage(kind){
  openSheet(kind==='silo'?'🌾 Silo':'🏚️ Barn',()=>{
    const cap=kind==='silo'?S.silo:S.barn,used=kind==='silo'?siloUsed():barnUsed();
    const ids=Object.keys(S.inv).filter(id=>S.inv[id]>0&&(kind==='silo')===inSilo(id));
    const req=storageNeeds(kind);const ok=hasAll(req);
    const missing=Object.entries(req).reduce((s,[id,q])=>s+Math.max(0,q-have(id)),0);
    const groups=kind==='silo'?[['Crops',ids]]:[['Products',ids.filter(id=>['good','animal','fruit','feed','fish','ore','bar'].includes(ITEMS[id].k))],['Tools & supplies',ids.filter(id=>ITEMS[id].k==='tool')]];
    return `<div class="cap"><div class="capbar"><i style="width:${Math.min(100,used/cap*100)}%"></i></div><b>${used} / ${cap}</b></div>
      <div class="row"><div class="e">⬆️</div><div class="m"><div class="t">Upgrade to ${cap+25}</div><div class="chips">${chipsFor(req)}</div></div>
      ${ok?`<button class="btn gold" data-act="upStore:${kind}">Upgrade</button>`:`<button class="btn gem sm" data-act="upStoreGem:${kind}"><i class="ii ii-gem"></i>${missing*4}</button>`}</div>`
      +groups.map(([g,list])=>list.length?`<h4>${g}</h4><div class="grid">${list.map(id=>`<button class="cell" data-act="sellQuick:${id}"><div class="e">${E(id)}</div><div class="c">${S.inv[id]}</div><div class="n">${ITEMS[id].n}</div></button>`).join('')}</div>`:'').join('')
      +(ids.length?'':`<div class="wait">Empty. Go ${kind==='silo'?'harvest':'make something'}!</div>`)
      +`<div class="sub" style="text-align:center;margin-top:12px">Tap an item to sell it at the Roadside Shop.</div>`;
  });
}
ACTS.upStore=kind=>{const req=storageNeeds(kind);if(!hasAll(req))return;for(const [i,q] of Object.entries(req))take(i,q);S[kind]+=25;sfx.build();addXP(10);toast(`${kind==='silo'?'Silo':'Barn'} now holds ${S[kind]}`);save();rerenderSheet()};
ACTS.upStoreGem=kind=>{const req=storageNeeds(kind);const missing=Object.entries(req).reduce((s,[id,q])=>s+Math.max(0,q-have(id)),0);const c=missing*4;if(S.gems<c){toast(`Need <i class="ii ii-gem"></i>${c}`);sfx.bad();return}S.gems-=c;for(const [i,q] of Object.entries(req)){const h=have(i);if(h<q)add(i,q-h)}ACTS.upStore(kind)};
ACTS.sellQuick=id=>{closeSheet();openStand(id)};

/* ================= ORDERS / TRUCK ================= */
const orderSlots=()=>Math.min(9,3+Math.floor(S.lvl/2));
function genOrder(){
  const pool=unlockedItems();const prefer=pool.filter(id=>have(id)>0);
  const types=Math.min(pool.length,1+rnd(Math.min(3,1+Math.floor(S.lvl/2))));const items={};let val=0;
  const src=[...pool].sort(()=>Math.random()-.5);
  if(prefer.length&&Math.random()<.5)src.unshift(pick(prefer));
  for(const id of src){if(Object.keys(items).length>=types)break;if(items[id])continue;const it=ITEMS[id];
    const q=it.k==='crop'?2+rnd(3+Math.floor(S.lvl/2)):1+rnd(it.sell>60?2:3);items[id]=q;val+=it.sell*q}
  if(S.lvl>=4&&Math.random()<.14&&!S.orders.some(o=>o.until)){for(const id in items)items[id]=Math.ceil(items[id]*1.5);val*=1.5;
    return {items,coins:Math.round(val*2)+20,xp:Math.round(val/2)+8,gems:1+rnd(2),until:now()+30*60000}}
  return {items,coins:Math.round(val*1.4)+5,xp:Math.round(val/3)+3};
}
function fillOrders(){const n=orderSlots();while(S.orders.length<n)S.orders.push(genOrder())}
function canFill(o){return !o.cd&&hasAll(o.items)}
function missingGem(o){let c=0;for(const [id,q] of Object.entries(o.items)){const m=Math.max(0,q-have(id));c+=Math.ceil(m*ITEMS[id].sell/12)}return c}
function openOrders(){
  openSheet('🚚 Truck Orders',()=>`<div class="grid2">`+S.orders.map((o,k)=>{
    if(o.cd)return `<div class="wait">🚚 New order<br><span data-end="${o.cd}" data-refresh>${fmt(o.cd-now())}</span></div>`;
    const ok=canFill(o),g=ok?0:missingGem(o);
    return `<div class="order ${ok?'can':''} ${o.until?'express':''}">${o.until?`<div class="xtag">⭐ EXPRESS · <span data-end="${o.until}" data-refresh>${fmt(o.until-now())}</span></div>`:''}<div class="its">${Object.entries(o.items).map(([id,q])=>`<button class="it ${have(id)>=q?'ok':'no'}" data-act="info:${id}"><div class="e">${E(id)}</div><div class="q">${have(id)}/${q}</div></button>`).join('')}</div>
      <div class="rw"><i class="ii ii-coin"></i>${o.coins} · ⭐${o.xp}${o.gems?` · <i class="ii ii-gem"></i>${o.gems}`:''}</div>
      <div class="foot"><button class="btn red sm" data-act="trash:${k}">🗑</button>${ok?`<button class="btn sm" style="flex:1" data-act="deliver:${k}">Ship</button>`:`<button class="btn gem sm" style="flex:1" data-act="deliverGem:${k}"><i class="ii ii-gem"></i>${g}</button>`}</div></div>`;
  }).join('')+`</div>`,'orders');
}
ACTS.deliver=(k,el)=>{const o=S.orders[+k];if(!o||!canFill(o)){sfx.bad();return}shipOrder(+k)};
ACTS.deliverGem=k=>{const o=S.orders[+k];const c=missingGem(o);if(S.gems<c){toast(`Need <i class="ii ii-gem"></i>${c}`);sfx.bad();return}S.gems-=c;for(const [id,q] of Object.entries(o.items)){const h=have(id);if(h<q)add(id,q-h)}shipOrder(+k)};
function shipOrder(k){
  const o=S.orders[k];for(const [id,q] of Object.entries(o.items))take(id,q);
  const oc=Math.round(o.coins*(1+.05*perk('orders')));S.coins+=oc;addXP(o.xp);sfx.coin();stat('orders');festPts(o.until?25:10,...truckHome());if(o.gems){S.gems+=o.gems;toast(`⭐ Express bonus +<i class="ii ii-gem"></i>${o.gems}`)}
  const [hx,hy]=truckHome();worldFx(hx,hy,`+<i class="ii ii-coin"></i>${oc}`,'#ffe56b');flyTo(hx,hy,'<i class="ii ii-coin"></i>','#coinPill',5);flyTo(hx,hy,'⭐','#lvlBadge',2);
  if(Math.random()<.2){const t=pick(TOOL_DROPS);add(t,1);setTimeout(()=>worldFx(hx,hy-.6,`+1${E(t)}`,'#ffe56b'),300)}
  actors.truck.mode='drive';actors.truck.t=0;sfx.horn();
  S.orders[k]={cd:now()+15000};save();rerenderSheet();
}
ACTS.trash=k=>{S.orders[+k]={cd:now()+45000};save();rerenderSheet()};

/* ================= VISITORS ================= */
function spawnVisitor(){
  const max=Math.min(4,1+Math.floor(S.lvl/3));if(S.lvl<2||S.visitors.length>=max)return;
  const pool=unlockedItems();const prefer=pool.filter(id=>have(id)>0);const cv=charVisitor();
  const id=cv&&cv.item?cv.item:prefer.length&&Math.random()<.75?pick(prefer):pick(pool);const it=ITEMS[id];
  const qty=it.k==='crop'?2+rnd(5):1+rnd(it.sell>150?2:3);const loved=!!(cv&&CHARS[cv.id].likes.includes(id));
  S.visitors.push({id:now()+'_'+rnd(999),e:pick(PEOPLE),ch:cv?cv.id:null,loved,item:id,qty,price:Math.round(it.sell*qty*(1.25+Math.random()*.4)*beautyMult()*(1+.05*perk('visitor'))*(loved?1.2:1)),until:now()+20*60000});
  save();
}
function openVisitor(v){
  const C=v.ch&&CHARS[v.ch];
  openSheet(C?`💖 ${C.n}`:`🛒 Visitor`,()=>{const ok=have(v.item)>=v.qty;return `<div class="vis">${C?face(v.ch,'pfb'):`<img class="pfb" src="${strangerFace(v)}" alt="">`}<div class="say">${C&&v.loved?'<span class="love">💖 One of my favorites!</span><br>':''}“${C?C.hi+' ':'Hey neighbor! '}Could I get <b>${v.qty} ${E(v.item)} ${ITEMS[v.item].n}</b>? I’ll pay <b><i class="ii ii-coin"></i>${v.price}</b>.”</div></div>
    <div class="row"><div class="e">${E(v.item)}</div><div class="m"><div class="t">You have ${have(v.item)}</div><div class="sub">Market value <i class="ii ii-coin"></i>${ITEMS[v.item].sell*v.qty}</div></div></div>
    <div style="display:flex;gap:8px"><button class="btn red" style="flex:1" data-act="visNo:${v.id}">No thanks</button><button class="btn" style="flex:2" data-act="visYes:${v.id}" ${ok?'':'disabled'}>Sell for <i class="ii ii-coin"></i>${v.price}</button></div>`});
}
ACTS.visYes=id=>{const v=S.visitors.find(x=>x.id===id);if(!v||have(v.item)<v.qty)return;take(v.item,v.qty);S.coins+=v.price;addXP(Math.round(v.price/8));sfx.coin();stat('visitors');festPts(5);if(v.ch)addFriend(v.ch,v.loved?2:1);
  const a=actors.vis.get(id);if(a)worldFx(a.x,a.y,`+<i class="ii ii-coin"></i>${v.price}`,'#ffe56b');S.visitors=S.visitors.filter(x=>x!==v);S.nextVisitor=now()+40000+rnd(60000);closeSheet();save()};
ACTS.visNo=id=>{S.visitors=S.visitors.filter(x=>x.id!==id);closeSheet();save()};

/* ================= FEATURES: repair + routing ================= */
function tapFeature(k){
  const f=FEATS[k];
  if(!S.feat[k]){
    if(S.lvl<f.lvl){toast(`🔒 ${f.n} opens at Level ${f.lvl}`);return}
    openSheet(`${f.e} ${f.n}`,()=>`<div class="vis"><div class="ve">🛠️</div><div class="say">The ${f.n} needs some fixing up before you can use it.</div></div>
      <button class="btn gold" style="width:100%" data-act="repair:${k}" ${S.coins<f.cost?'disabled':''}>Repair for <i class="ii ii-coin"></i>${f.cost}</button>`);return;
  }
  ({pond:openFishing,dock:openBoat,station:openTrain,mine:openMine})[k]();
}
ACTS.repair=k=>{const f=FEATS[k];if(S.coins<f.cost)return;S.coins-=f.cost;S.feat[k]=true;addXP(15);sfx.build();closeSheet();toast(`${f.e} ${f.n} is open!`);
  if(k==='dock'&&!S.boat)S.boat=newBoat();if(k==='station'&&!S.train)S.train=newTrain();save()};

/* ================= BOAT ================= */
function newBoat(){
  const pool=unlockedItems().filter(id=>ITEMS[id].k!=='crop'||S.lvl<11);
  const crates=[];for(let i=0;i<3;i++){const id=pick(pool);const it=ITEMS[id];const qty=it.k==='crop'?6+rnd(6):2+rnd(it.sell>60?2:4);crates.push({item:id,qty,done:false})}
  return {state:'docked',t:now()+45*60000,crates};
}
function boatTick(){
  const b=S.boat;if(!b||!S.feat.dock)return;
  if(b.state==='docked'&&(now()>=b.t||b.crates.every(c=>c.done))){
    const full=b.crates.every(c=>c.done);
    if(full){const bonus=b.crates.reduce((s,c)=>s+ITEMS[c.item].sell*c.qty,0);S.coins+=bonus;add(pick(TOOL_DROPS),1);add(pick(TOOL_DROPS),1);S.gems+=2;stat('boats');
      toast(`🚢 Boat shipped full! +<i class="ii ii-coin"></i>${bonus} +<i class="ii ii-gem"></i>2 +2 tools`);sfx.horn()}else{toast('🚢 The boat set sail');sfx.horn()}
    S.boat={state:'away',t:now()+10*60000};save();if(sheetKey==='boat')rerenderSheet();
  }else if(b.state==='away'&&now()>=b.t){S.boat=newBoat();sfx.horn();toast('🚢 A boat just docked! Fill its crates.');save()}
}
function openBoat(){if(!S.boat)S.boat=newBoat();
  openSheet('🚢 Boat Dock',()=>{const b=S.boat;
    if(b.state==='away')return `<div class="wait">🚢 Next boat arrives in <span data-end="${b.t}" data-refresh>${fmt(b.t-now())}</span><br><button class="btn gem sm" style="margin-top:8px" data-act="boatNow">⚡ Call it now <i class="ii ii-gem"></i>${gemCost(b.t-now())}</button></div>`;
    return `<div class="sub" style="margin-bottom:8px">Leaves in <b><span data-end="${b.t}" data-refresh>${fmt(b.t-now())}</span></b> — fill every crate for a big bonus, <i class="ii ii-gem"></i>2 and tools.</div><div class="grid3">`+
      b.crates.map((c,i)=>{const ok=have(c.item)>=c.qty,asked=S.helpReq['crate'+i+b.t];
        return `<div class="crate ${c.done?'done':''}"><div class="e">${c.done?'📦':E(c.item)}</div><div class="q">${c.done?'Filled':`${have(c.item)}/${c.qty}`}</div><div class="sub"><i class="ii ii-coin"></i>${Math.round(ITEMS[c.item].sell*c.qty*1.8)}</div>
        ${c.done?'':`<button class="btn sm" data-act="fillCrate:${i}" ${ok?'':'disabled'}>Fill</button><button class="btn gold sm" data-act="askCrate:${i}" ${asked?'disabled':''}>${asked?'Asked':'Help 👥'}</button>`}</div>`}).join('')+`</div>`;
  },'boat');
}
ACTS.boatNow=()=>{const b=S.boat;const c=gemCost(b.t-now());if(S.gems<c)return toast(`Need <i class="ii ii-gem"></i>${c}`);S.gems-=c;b.t=now();boatTick();rerenderSheet()};
ACTS.fillCrate=i=>{const c=S.boat.crates[+i];if(c.done||have(c.item)<c.qty)return;take(c.item,c.qty);completeCrate(+i,false)};
function completeCrate(i,byHelp){const c=S.boat.crates[i];if(!c||c.done)return;c.done=true;festPts(15);const coins=Math.round(ITEMS[c.item].sell*c.qty*1.8);S.coins+=coins;addXP(Math.round(coins/6));stat('crates');sfx.coin();
  if(byHelp)toast(`👥 A neighbor filled your ${E(c.item)} crate! +<i class="ii ii-coin"></i>${coins}`);save();rerenderSheet()}
ACTS.askCrate=i=>{const b=S.boat;const c=b.crates[+i];Net.requestHelp({kind:'crate',ref:'crate'+i+b.t,item:c.item,qty:c.qty,label:'Boat crate'});S.helpReq['crate'+i+b.t]=now();toast('Help request posted');save();rerenderSheet()};

/* ================= TRAIN ================= */
function newTrain(){
  const pool=unlockedItems();const cars=[];
  for(let i=0;i<4;i++){const id=pick(pool);const it=ITEMS[id];const qty=it.k==='crop'?5+rnd(6):2+rnd(3);
    const r=Math.random();const rw=r<.5?{k:'tool',id:pick(TOOL_DROPS),n:1+rnd(2)}:r<.75?{k:'gems',n:1+rnd(2)}:{k:'coins',n:Math.round(it.sell*qty*2)};
    cars.push({item:id,qty,done:false,rw})}
  return {state:'here',t:now()+60*60000,cars};
}
function trainTick(){
  const tr=S.train;if(!tr||!S.feat.station)return;
  if(tr.state==='here'&&(now()>=tr.t||tr.cars.every(c=>c.done))){S.train={state:'away',t:now()+15*60000};sfx.whistle();toast('🚂 The train pulled out');save();if(sheetKey==='train')rerenderSheet()}
  else if(tr.state==='away'&&now()>=tr.t){S.train=newTrain();sfx.whistle();toast('🚂 The train is in! Load its cars.');save()}
}
const rwTxt=rw=>rw.k==='tool'?`${rw.n}× ${E(rw.id)}`:rw.k==='gems'?`<i class="ii ii-gem"></i>${rw.n}`:`<i class="ii ii-coin"></i>${rw.n}`;
function openTrain(){if(!S.train)S.train=newTrain();
  openSheet('🚂 Train Station',()=>{const tr=S.train;
    if(tr.state==='away')return `<div class="wait">🚂 Train returns in <span data-end="${tr.t}" data-refresh>${fmt(tr.t-now())}</span></div>`;
    return `<div class="sub" style="margin-bottom:8px">Departs in <b><span data-end="${tr.t}" data-refresh>${fmt(tr.t-now())}</span></b>. Each car pays a reward when loaded.</div><div class="grid2">`+
      tr.cars.map((c,i)=>`<div class="crate ${c.done?'done':''}"><div class="e">${c.done?'🚃':E(c.item)}</div><div class="q">${c.done?'Loaded':`${have(c.item)}/${c.qty}`}</div><div class="sub">Reward ${rwTxt(c.rw)}</div>
        ${c.done?'':`<button class="btn sm" data-act="loadCar:${i}" ${have(c.item)>=c.qty?'':'disabled'}>Load</button>`}</div>`).join('')+`</div>`;
  },'train');
}
ACTS.loadCar=i=>{const c=S.train.cars[+i];if(c.done||have(c.item)<c.qty)return;take(c.item,c.qty);c.done=true;const rw=c.rw;
  if(rw.k==='tool')add(rw.id,rw.n);else if(rw.k==='gems')S.gems+=rw.n;else S.coins+=rw.n;addXP(Math.round(ITEMS[c.item].sell*c.qty/5));sfx.coin();toast(`Loaded! +${rwTxt(rw)}`);stat('cars');festPts(10);save();rerenderSheet()};

/* ================= EXPANSION ================= */
function blockAdjacent(b){const [x,y]=b.split(',').map(Number);return [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>S.land.includes(`${x+dx},${y+dy}`))}
function expandReq(){const n=Math.min(1+S.exp,5);return{coins:500*(S.exp+1),tools:{deed:n,mallet:n,stake:n}}}
function openExpand(b){
  if(!blockAdjacent(b)){toast('Expand next to land you already own');return}
  const r=expandReq();const ok=hasAll(r.tools)&&S.coins>=r.coins;
  const missing=Object.entries(r.tools).reduce((s,[id,q])=>s+Math.max(0,q-have(id)),0);
  openSheet('🚩 Expand your farm',()=>`<div class="vis"><div class="ve">🗺️</div><div class="say">Clear this plot of land to grow your farm. New land comes with trees and rocks to clear.</div></div>
    <div class="row"><div class="e">🧰</div><div class="m"><div class="t">Needs</div><div class="chips">${chipsFor(r.tools)}<span class="chip ${S.coins>=r.coins?'ok':'no'}"><i class="ii ii-coin"></i>${r.coins}</span></div></div></div>
    <div style="display:flex;gap:8px">${missing?`<button class="btn gem" style="flex:1" data-act="expandGem:${b}">Buy tools <i class="ii ii-gem"></i>${missing*5}</button>`:''}<button class="btn gold" style="flex:1" data-act="expand:${b}" ${ok?'':'disabled'}>Expand</button></div>
    <div class="sub" style="margin-top:10px;text-align:center">Tools drop from harvests, orders, the train, the mine and the market.</div>`);
}
ACTS.expandGem=b=>{const r=expandReq();const missing=Object.entries(r.tools).reduce((s,[id,q])=>s+Math.max(0,q-have(id)),0);const c=missing*5;if(S.gems<c){toast(`Need <i class="ii ii-gem"></i>${c}`);return}S.gems-=c;for(const [id,q] of Object.entries(r.tools)){const h=have(id);if(h<q)add(id,q-h)}rerenderSheet();openExpand(b)};
ACTS.expand=b=>{const r=expandReq();if(!hasAll(r.tools)||S.coins<r.coins)return;for(const [i,q] of Object.entries(r.tools))take(i,q);S.coins-=r.coins;S.land.push(b);S.exp++;addXP(30);sfx.build();closeSheet();
  const [bx,by]=b.split(',').map(Number);for(let i=0;i<5;i++){const t=pick(['stump','stump','rock','bigtree']);const o={t,x:FARM0+bx*BLOCK+rnd(BLOCK-1),y:FARM0+by*BLOCK+rnd(BLOCK-1)};if(canPlace(o,o.x,o.y)){o.id=S.nextId++;S.objs.push(o)}}
  toast('New land! 🚩');save();Net.publishFarm()};

/* ================= BUILD SHOP ================= */

    if(shopTab==='farm'){const n=objsOf('plot').length,c=fieldCost();
      h+=row('🟫','Field',`${n} fields · plant crops here`,`<button class="btn gold sm" data-act="buyField" ${S.coins<c?'disabled':''}><i class="ii ii-coin"></i>${c}</button>`);
      {const n=objsOf('hive').length,lock=HIVE.lvl>S.lvl;h+=row('🐝','Beehive',lock?`Unlocks at Lv ${HIVE.lvl}`:`${n}/${HIVE.max} · makes 🍯 every 10 min, no feed needed`,lock||n>=HIVE.max?'':`<button class="btn gold sm" data-act="buyHive" ${S.coins<HIVE.cost?'disabled':''}><i class="ii ii-coin"></i>${HIVE.cost}</button>`,lock)}
      for(const [k,t] of Object.entries(TREES)){const lock=t.lvl>S.lvl;h+=row(E(t.fruit),t.n,lock?`Unlocks at Lv ${t.lvl}`:`${t.life} harvests of ${E(t.fruit)}×2 · ${fmt(t.time*1000)} each`,lock?'':`<button class="btn gold sm" data-act="buyTree:${k}" ${S.coins<t.cost?'disabled':''}><i class="ii ii-coin"></i>${t.cost}</button>`,lock)}}
    if(shopTab==='decor'){h+=`<div class="sub" style="margin-bottom:8px">✨ Farm beauty <b>${beauty()}</b> — visitors pay ${Math.round((beautyMult()-1)*100)}% more and come more often.</div>`;const st=S.decoStore||{};for(const [k,d] of Object.entries(DECOS)){const lock=d.lvl>S.lvl;const stored=st[k]||0;if(d.ex&&!stored)continue;
      h+=row(d.e,d.n,lock?`Unlocks at Lv ${d.lvl}`:stored?`${stored} in storage · ✨+${beautyOf(d)}`:d.g?`💎 Gem exclusive · ✨+${beautyOf(d)} beauty`:`✨+${beautyOf(d)} beauty`,lock?'':stored?`<button class="btn sm" data-act="placeDeco:${k}:1">Place</button>`:d.g?`<button class="btn gem sm" data-act="buyGemDeco:${k}" ${S.gems<d.g?'disabled':''}><i class="ii ii-gem"></i>${d.g}</button>`:`<button class="btn gold sm" data-act="placeDeco:${k}:0" ${S.coins<d.cost?'disabled':''}><i class="ii ii-coin"></i>${d.cost}</button>`,lock)}}
    if(shopTab==='supplies'){

      h+=`<h4>Tools</h4>`;

}
ACTS.shopTab=k=>{shopTab=k;rerenderSheet()};
ACTS.shopDecor=()=>openShop('decor');
const fieldCost=()=>20+Math.max(0,objsOf('plot').length-6)*25;
function buyPlace(o,cost,after){
  if(S.coins<cost){toast(`Need <i class="ii ii-coin"></i>${cost}`);sfx.bad();return}
  startPlacing(o,ok=>{if(!ok)return;if(S.coins<cost){toast(`Need <i class="ii ii-coin"></i>${cost}`);return}S.coins-=cost;o.id=S.nextId++;S.objs.push(o);sfx.build();const [fw,fh]=foot(o);dust(o.x+fw/2,o.y+fh/2);bump(o);addXP(3);if(after)after(o);save();Net.publishFarm()});
}
ACTS.buyBld=k=>{const b=BUILDINGS[k];buyPlace({t:'bld',k,q:[],slots:QUEUE_BASE},b.cost,()=>{toast(`${b.e} ${b.n} built!`);fillOrders()})};
ACTS.buyPen=k=>{const p=PENS[k];buyPlace({t:'pen',k,a:[{f:0}]},p.cost,()=>{toast(`${p.a} ${p.n} built!`);fillOrders()})};
ACTS.buyField=()=>buyPlace({t:'plot',c:null,pt:0},fieldCost());
ACTS.buyTree=k=>{const t=TREES[k];buyPlace({t:'tree',k,pt:now(),h:0,dead:false},t.cost,()=>{fillOrders()})};
ACTS.placeDeco=(k,stored)=>{const d=DECOS[k];
  if(+stored){const o={t:'deco',k};startPlacing(o,ok=>{if(!ok||!(S.decoStore||{})[k])return;S.decoStore[k]--;if(!S.decoStore[k])delete S.decoStore[k];o.id=S.nextId++;S.objs.push(o);sfx.build();save()});return}

function flyTo(gx,gy,e,target,count=1){
  const tg=$(target);if(!tg||document.hidden)return;
  const [ix,iy]=iso(gx,gy);const [sx,sy]=toScreen(ix,iy-24);const r=tg.getBoundingClientRect();const tx=r.left+r.width/2,ty=r.top+r.height/2;
  for(let i=0;i<Math.min(count,6);i++){
    const d=document.createElement('div');d.className='fly';d.innerHTML=e;document.body.appendChild(d);
    const ox=(Math.random()-.5)*30,oy=(Math.random()-.5)*20;const mx=(sx+tx)/2+(Math.random()-.5)*80,my=Math.min(sy,ty)-60-Math.random()*40;
    const an=d.animate([{transform:`translate(${sx+ox}px,${sy+oy}px) scale(.6)`,opacity:0},{transform:`translate(${sx+ox}px,${sy+oy-20}px) scale(1.2)`,opacity:1,offset:.15},{transform:`translate(${mx}px,${my}px) scale(1)`,offset:.55},{transform:`translate(${tx}px,${ty}px) scale(.5)`,opacity:.9}],{duration:800+i*70,delay:i*60,easing:'cubic-bezier(.5,0,.6,1)',fill:'forwards'});
    an.onfinish=()=>{d.remove();tg.classList.remove('pulse');void tg.offsetWidth;tg.classList.add('pulse')};
  }
}

/* portraits drawn with the same hand-drawn person art */
const portraitCache={};
function portrait(id,size=64){
  const k=id+size;if(portraitCache[k])return portraitCache[k];
  const c=document.createElement('canvas');c.width=c.height=size*2;const g=c.getContext('2d');
  const main=ctx;ctx=g;try{g.fillStyle='#fdf0cf';g.beginPath();g.arc(size,size,size,0,7);g.fill();g.save();g.beginPath();g.arc(size,size,size-2,0,7);g.clip();drawPerson(size,size*.82+29*size/10,false,0,false,CHARS[id].L,size/10);g.restore()}finally{ctx=main}
  return portraitCache[k]=c.toDataURL();
}

function storyCh(){return STORY.find(c=>!(S.story||{}).done?.includes(c.id))}
function chState(){S.story=S.story||{done:[],base:{},start:0,hand:{}};return S.story}
function ensureBase(ch){const st=chState();if(st.cur!==ch.id){st.cur=ch.id;st.base={};st.hand={};for(const q of ch.q)if(q.s)st.base[q.s]=S.stats[q.s]||0}}
function qProg(ch,q,i){const st=chState();
  if(q.s){const v=(S.stats[q.s]||0)-(st.base[q.s]||0);return [Math.min(q.n,v),q.n]}
  if(q.h)return [st.hand[i]?1:0,1];
  if(q.b)return [(q.b==='hive'?objsOf('hive').length:objsOf('bld',q.b).length+objsOf('pen',q.b).length)>0?1:0,1];
  if(q.f)return [S.feat[q.f]?1:0,1];
  if(q.l)return [Math.min(S.lvl,q.l),q.l];
  if(q.u)return [Math.min(S.stats.upgrades||0,q.u),q.u];
  if(q.beauty)return [Math.min(beauty(),q.beauty),q.beauty];
  if(q.fr)return [Math.min(q.n,Math.max(0,...Object.keys(CHARS).map(hearts))),q.n];
  return [0,1];
}
const qDone=(ch,q,i)=>{const [a,b]=qProg(ch,q,i);return a>=b};
function storyReady(){const ch=storyCh();if(!ch||S.lvl<ch.lvl)return false;ensureBase(ch);return ch.q.every((q,i)=>qDone(ch,q,i))||ch.q.some((q,i)=>q.h&&!qDone(ch,q,i)&&hasAll(q.h))}
function openTown(tab){
  if(tab)townTab=tab;
  openSheet('🏘️ Southside Town',()=>{
    let h=`<div class="tabs"><button class="tab ${townTab==='story'?'on':''}" data-act="townTab:story">📖<span>Story</span></button><button class="tab ${townTab==='folks'?'on':''}" data-act="townTab:folks">💖<span>Neighbors</span></button></div>`;
    if(townTab==='story'){
      const ch=storyCh();
      if(!ch)return h+`<div class="story done">${face('ray','pfb')}<div><b>The End… for now</b><div class="sub">You brought the whole Southside together. New chapters are coming.</div></div></div>`;
      const c=CHARS[ch.who];
      if(S.lvl<ch.lvl)return h+`<div class="story">${face(ch.who,'pfb')}<div><div class="sub">Chapter ${ch.id}</div><b>${ch.t}</b><div class="sub">Opens at level ${ch.lvl}</div></div></div>`;
      ensureBase(ch);
      const all=ch.q.every((q,i)=>qDone(ch,q,i));
      h+=`<div class="story">${face(ch.who,'pfb')}<div><div class="sub">Chapter ${ch.id} of ${STORY.length}</div><b>${ch.t}</b><div class="say2">“${ch.intro}” <span class="sub">— ${c.n}</span></div></div></div>`;
      h+=ch.q.map((q,i)=>{const [a,b]=qProg(ch,q,i),ok=a>=b;
        return `<div class="row ${ok?'dim':''}"><div class="e">${ok?'✅':'⬜'}</div><div class="m"><div class="t">${q.d}</div>${q.h&&!ok?`<div class="chips">${chipsFor(q.h)}</div>`:`<div class="capbar sm"><i style="width:${a/b*100}%"></i></div><div class="sub">${a}/${b}</div>`}</div>
          ${q.h&&!ok?`<button class="btn sm" data-act="handIn:${i}" ${hasAll(q.h)?'':'disabled'}>Give</button>`:''}</div>`}).join('');
      h+=`<div class="row"><div class="e">🎁</div><div class="m"><div class="t">Chapter reward</div><div class="sub">${festRwTxt(ch.rw)}${ch.rw.c&&ch.rw.g?'':''}</div></div><button class="btn gold sm" data-act="chapterDone" ${all?'':'disabled'}>Complete</button></div>`;
      h+=`<div class="sub" style="text-align:center;margin-top:6px">${(S.story.done||[]).length} of ${STORY.length} chapters complete</div>`;
    }else{
      h+=`<div class="sub" style="margin-bottom:8px">Neighbors visit your shop. Sell them what they love to earn hearts — gifts at 3, 6 and 10 💖.</div>`;
      h+=Object.entries(CHARS).map(([id,c])=>{const hr=hearts(id);return `<div class="row">${face(id)}<div class="m"><div class="t">${c.n}</div><div class="sub">${c.role}</div><div class="hearts">${'❤️'.repeat(hr)}<span>${'🤍'.repeat(10-hr)}</span></div><div class="sub">Loves ${c.likes.filter(x=>(ITEMS[x].lvl||1)<=S.lvl+3).map(E).join(' ')||'—'}</div></div></div>`}).join('');
    }
    return h;
  },'town');
}
